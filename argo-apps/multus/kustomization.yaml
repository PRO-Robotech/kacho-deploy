# Kustomize-обёртка над upstream Multus **thin** daemonset (v4.2.2).
# Меняет hardcoded namespace `kube-system` на `kacho-multus`. Multus не имеет
# официального публичного Helm-chart'а, поэтому vendor'им upstream YAML.
#
# Почему thin, а не thick: thick mode (отдельный multus-daemon long-running
# процесс) в этом кластере молча exit 0 после `API readiness check done!` —
# debug непосильный для прототипа. Thin — простой CNI binary `multus-shim`
# + `/thin_entrypoint`, который только генерирует `00-multus.conf` из primary
# conflist (auto-detect, алфавитная сортировка).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kacho-multus

resources:
  - multus-daemonset-thin.yml

patches:
  # Upstream daemonset выставляет main-container limit memory=50Mi —
  # этого не хватает на pod-watch'ер всего кластера, контейнер OOMKill'ится.
  # Поднимаем до 256Mi (наблюдаемый rss ~80-150Mi). Init container — добавляем
  # generous limit на случай если cp 50MB бинаря в /opt/cni/bin делается через
  # буфер.
  - target:
      kind: DaemonSet
      name: kube-multus-ds
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      - op: add
        path: /spec/template/spec/initContainers/0/resources/limits
        value:
          cpu: 200m
          memory: 128Mi
