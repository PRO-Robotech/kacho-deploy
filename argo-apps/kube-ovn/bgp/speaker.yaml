# kube-ovn-speaker — BGP-анонс CIDR Kachō-подсетей в BGP-фабрику (OP2-P-BGP, S1).
#
# Speaker — DaemonSet на нодах с label `ovn.kubernetes.io/bgp=true` (gateway-роль).
# Анонсирует CIDR той kube-ovn Subnet, на которой стоит аннотация
# `ovn.kubernetes.io/bgp=cluster` (её выставляет kacho-vpc-operator на каждой
# материализуемой подсети). Это рабочий путь доставки subnet-CIDR в маршрутизацию
# вместо `Vpc.spec.staticRoutes`, которые kube-ovn v1.16.1 стрипает на custom-VPC
# (issue kacho-vpc-operator#2).
#
# Аддитивно: НЕ меняет флаги kube-ovn-controller (datapath OP1 не затрагивается).
# Бинарь speaker уже в образе kube-ovn; SA `ovn` — существующий kube-ovn SA.
# Применяется out-of-band через scripts/bgp-up.sh (как operator-up.sh).
#
# ASN-план (private, RFC 6996): cluster-as=65001 (speaker), neighbor-as=65000 (RR).
# auth-password в happy-path НЕ задаётся (in-cluster PoC); если нужен — через
# k8s Secret, НИКОГДА не plaintext в git (см. README §security, S5-01).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-ovn-speaker
  namespace: kacho-kube-ovn
  labels:
    app: kube-ovn-speaker
    app.kubernetes.io/part-of: kube-ovn
    kacho.io/component: bgp-speaker
spec:
  selector:
    matchLabels:
      app: kube-ovn-speaker
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: kube-ovn-speaker
        app.kubernetes.io/part-of: kube-ovn
    spec:
      serviceAccountName: ovn
      # SA `ovn` отключает automount на уровне SA; реальные kube-ovn DaemonSet'ы
      # переопределяют это на уровне пода (иначе speaker не найдёт SA-токен).
      automountServiceAccountToken: true
      hostNetwork: true
      # Только gateway-ноды (label out-of-band, bgp-up.sh) + linux.
      nodeSelector:
        kubernetes.io/os: linux
        ovn.kubernetes.io/bgp: "true"
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: kube-ovn-speaker
          image: docker.io/kubeovn/kube-ovn:v1.16.1
          imagePullPolicy: IfNotPresent
          command: ["/kube-ovn/kube-ovn-speaker"]
          args:
            - --cluster-as=65001
            - --neighbor-as=65000
            # IP ноды (route-reflector hostNetwork слушает 179 на ноде). Прямое
            # соединение без kube-proxy SNAT (через ClusterIP источник SNAT'ился в
            # 10.244.0.1, ломая identity peer'а). bgp-up.sh подставляет реальный
            # InternalIP вместо дефолтного 172.19.0.2.
            - --neighbor-address=172.19.0.2
            # ClusterIP-сервисы НЕ анонсим (least-exposure, S4-04/S5-01).
            - --announce-cluster-ip=false
            # Маршруты переживают реконнект speaker'а (S4-01 self-heal).
            - --graceful-restart
            - --logtostderr=true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_IPS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIPs
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # speaker пишет gobgp-лог в /var/log/kube-ovn (хардкод-путь) — без mount
            # gobgp-логгер падает и глушит FSM-логи сессии.
            - name: kube-ovn-log
              mountPath: /var/log/kube-ovn
      volumes:
        - name: kube-ovn-log
          hostPath:
            path: /var/log/kube-ovn
            type: DirectoryOrCreate
