# GoBGP route-reflector — BGP-peer для kube-ovn-speaker (OP2-P-BGP, S2).
#
# На kind нет upstream-роутера/RR → PoC поднимает свой BGP-peer. RR принимает
# анонсы speaker'а (CIDR Kachō-подсетей) и является точкой проверки
# «маршрут выучен / персистит» (S3-03 — главный результат фазы).
#
# Обычный pod (НЕ hostNetwork): speaker подключается к pod-IP RR напрямую. Прямое
# соединение node→podIP сохраняет source (= IP ноды), в отличие от ClusterIP-пути
# (kube-proxy SNAT'ил источник в cni-gateway 10.244.0.1, ломая identity peer'а).
# RR и speaker — РАЗНЫЕ network namespace (speaker hostNetwork) → нет конфликта за
# gobgp gRPC-порт 50051 / BGP-179.
#
# ASN: local-as=65000 (RR), peer-as=65001 (speaker). Dynamic-neighbor (accept от
# любого источника с peer-as 65001, passive) — устойчив к фактическому source-IP
# speaker'а (bgp-up.sh подтверждает session по RR-логам). Инспекция маршрутов:
#   kubectl -n kacho-kube-ovn exec deploy/kube-ovn-bgp-rr -- gobgp global rib
# (см. argo-apps/kube-ovn/bgp/README.md — PoC-runbook).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-ovn-bgp-rr-config
  namespace: kacho-kube-ovn
  labels:
    app: kube-ovn-bgp-rr
    kacho.io/component: bgp-route-reflector
data:
  gobgp.toml: |
    [global.config]
      as = 65000
      router-id = "10.255.255.1"

    [[peer-groups]]
      [peer-groups.config]
        peer-group-name = "kube-ovn-speakers"
        peer-as = 65001
      [peer-groups.transport.config]
        passive-mode = true

    [[dynamic-neighbors]]
      [dynamic-neighbors.config]
        prefix = "0.0.0.0/0"
        peer-group = "kube-ovn-speakers"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-ovn-bgp-rr
  namespace: kacho-kube-ovn
  labels:
    app: kube-ovn-bgp-rr
    kacho.io/component: bgp-route-reflector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-ovn-bgp-rr
  template:
    metadata:
      labels:
        app: kube-ovn-bgp-rr
        kacho.io/component: bgp-route-reflector
    spec:
      containers:
        - name: gobgp
          image: jauderho/gobgp:latest
          imagePullPolicy: IfNotPresent
          command: ["gobgpd"]
          args: ["-t", "toml", "-f", "/etc/gobgp/gobgp.toml", "-l", "info"]
          ports:
            - name: bgp
              containerPort: 179
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/gobgp
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kube-ovn-bgp-rr-config
