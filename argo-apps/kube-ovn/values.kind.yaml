# kube-ovn helm values — LOCAL kind throwaway cluster `kacho-ovn` (тест data-plane
# оператора). Адаптация argo-apps/kube-ovn/application.yaml (client-кластер) под kind:
#   - MASTER_NODES = InternalIP kind-ноды (172.19.0.3), label kube-ovn/role=master.
#   - primary CNI на kind = kindnet (НЕ Cilium) → kube-ovn остаётся NON_PRIMARY
#     (secondary через Multus), CNI_CONFIG_PRIORITY=90 уводит conflist ПОСЛЕ kindnet.
#   - CIDR'ы не пересекаются с kind (pod 10.244.0.0/16, svc 10.96.0.0/16).
namespace: kacho-kube-ovn

MASTER_NODES: "172.19.0.3"

cni_conf:
  NON_PRIMARY_CNI: true
  CNI_CONFIG_PRIORITY: "90"

networking:
  NET_STACK: ipv4
  NETWORK_TYPE: geneve
  TUNNEL_TYPE: geneve
  DEFAULT_SUBNET: "ovn-default"
  DEFAULT_VPC: "ovn-cluster"
  NODE_SUBNET: "join"
  ENABLE_EIP_SNAT: false

# Secondary-CNI режим: LB / NetworkPolicy / NAT-GW не нужны (primary path —
# kindnet). Disable упрощает init и сокращает поверхность.
func:
  ENABLE_LB: false
  ENABLE_NP: false
  ENABLE_NAT_GW: false

ipv4:
  # ovn-default pod-subnet kube-ovn — не пересекается с kind pod(10.244/16)/svc(10.96/16).
  POD_CIDR: "172.30.0.0/16"
  POD_GATEWAY: "172.30.0.1"
  SVC_CIDR: "10.96.0.0/16"
  JOIN_CIDR: "100.64.0.0/16"
  PINGER_EXTERNAL_ADDRESS: "1.1.1.1"
