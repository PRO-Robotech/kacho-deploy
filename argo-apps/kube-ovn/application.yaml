# ArgoCD Application — Kube-OVN в NON_PRIMARY_CNI режиме, namespace kacho-kube-ovn.
# Primary CNI на eth0 — Cilium (стоит в beget-cilium). Kube-OVN тут поднимает
# OVN northbound/southbound + OVS, но НЕ перезаписывает primary CNI conf-file
# на нодах (выставляем `cni_conf.NON_PRIMARY_CNI=true`). К pod'ам Kube-OVN
# подключается только через Multus + NetworkAttachmentDefinition как secondary
# CNI — для tenant-NIC из Kachō VPC/Subnet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kacho-kube-ovn
  namespace: in-cloud-argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kacho-kube-ovn
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: kube-ovn
    repoURL: https://kubeovn.github.io/kube-ovn
    targetRevision: v1.16.1
    helm:
      releaseName: kube-ovn
      values: |
        # ВСЕ системные ресурсы Kube-OVN (DaemonSet'ы, Deployment'ы, SA,
        # ClusterRoleBinding'и) живут в kacho-kube-ovn, не в kube-system.
        namespace: kacho-kube-ovn

        # Master-нода для ovn-central (одна — single-master deployment).
        # IP узла e2c825-client-e71297-jrg82-s6v7v (отлейблена `kube-ovn/role=master`).
        # Без явного MASTER_NODES env-var ovn-central стартует с пустым NODE_IPS,
        # ovsdb остаётся non-clustered, а liveness probe (`cluster/status`)
        # требует clustered DB → бесконечный рестарт. Перечисляем явно.
        MASTER_NODES: "10.16.0.19"

        cni_conf:
          # NON_PRIMARY_CNI=true — Kube-OVN не выкатывает 01-kube-ovn.conflist
          # на ноды (primary остаётся Cilium), работает только через Multus
          # как secondary CNI по NetworkAttachmentDefinition.
          NON_PRIMARY_CNI: true

        networking:
          # IPv4-overlay geneve — стандартный режим Kube-OVN для multi-VPC.
          NET_STACK: ipv4
          NETWORK_TYPE: geneve
          TUNNEL_TYPE: geneve
          DEFAULT_SUBNET: "ovn-default"
          DEFAULT_VPC: "ovn-cluster"
          NODE_SUBNET: "join"
          # Default ovn-default 10.16.0.0/16 пересекается с node-network (ноды
          # на 10.16.0.x). Уводим default-pod-subnet в 10.99.0.0/16 — не
          # используется ни для primary CNI (Cilium), ни для underlay.
          ENABLE_EIP_SNAT: false

        # Для secondary-CNI режима не нужны OVN-овые LB / NetworkPolicy / NAT-GW
        # (это всё Cilium делает на primary path). Disable'им — упрощает init
        # и уменьшает поверхность Kube-OVN.
        func:
          ENABLE_LB: false
          ENABLE_NP: false
          ENABLE_NAT_GW: false

        ipv4:
          POD_CIDR: "10.99.0.0/16"
          POD_GATEWAY: "10.99.0.1"
          SVC_CIDR: "10.100.0.0/12"
          JOIN_CIDR: "100.64.0.0/16"
          PINGER_EXTERNAL_ADDRESS: "1.1.1.1"

        dual_stack:
          POD_CIDR: "10.99.0.0/16,fd00:10:99::/112"
          POD_GATEWAY: "10.99.0.1,fd00:10:99::1"
          SVC_CIDR: "10.100.0.0/12,fd00:10:96::/112"
          JOIN_CIDR: "100.64.0.0/16,fd00:100:64::/112"
          PINGER_EXTERNAL_ADDRESS: "1.1.1.1,2606:4700:4700::1111"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
