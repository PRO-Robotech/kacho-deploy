# ArgoCD Application — Kube-OVN в NON_PRIMARY_CNI режиме, namespace kacho-kube-ovn.
# Primary CNI на eth0 — Cilium (стоит в beget-cilium). Kube-OVN тут поднимает
# OVN northbound/southbound + OVS, но НЕ перезаписывает primary CNI conf-file
# на нодах (выставляем `cni_conf.NON_PRIMARY_CNI=true`). К pod'ам Kube-OVN
# подключается только через Multus + NetworkAttachmentDefinition как secondary
# CNI — для tenant-NIC из Kachō VPC/Subnet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kacho-kube-ovn
  namespace: in-cloud-argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kacho-kube-ovn
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: kube-ovn
    repoURL: https://kubeovn.github.io/kube-ovn
    targetRevision: v1.16.1
    helm:
      releaseName: kube-ovn
      values: |
        # ВСЕ системные ресурсы Kube-OVN (DaemonSet'ы, Deployment'ы, SA,
        # ClusterRoleBinding'и) живут в kacho-kube-ovn, не в kube-system.
        namespace: kacho-kube-ovn

        # Master-нода для ovn-central (одна — single-master deployment).
        # IP должен соответствовать InternalIP ноды с label `kube-ovn/role=master`.
        # Без явного MASTER_NODES ovn-central стартует с пустым NODE_IPS, ovsdb
        # остаётся non-clustered → бесконечный рестарт. При ротации нод —
        # обновить этот IP под актуальную master-ноду.
        MASTER_NODES: "10.16.0.26"

        cni_conf:
          # NON_PRIMARY_CNI=true — kube-ovn работает secondary-CNI (primary —
          # Cilium), подключается к pod'ам только через Multus + NAD.
          NON_PRIMARY_CNI: true
          # CNI_CONFIG_PRIORITY задаёт имя conflist'а: <priority>-kube-ovn.conflist.
          # ВАЖНО: kube-ovn ВСЕГДА ставит conflist на ноду (даже при
          # NON_PRIMARY_CNI). Multus авто-выбирает default-делегат как ПЕРВЫЙ
          # conflist по алфавиту. При дефолтном "01" получался 01-kube-ovn.conflist,
          # который сортировался раньше 05-cilium.conflist → multus делал kube-ovn
          # primary-сетью для всех подов ноды → они не поднимались (kube-ovn в
          # NON_PRIMARY режиме IP не аллоцирует). "90" уводит conflist ПОСЛЕ
          # cilium — multus берёт 05-cilium.conflist как default.
          CNI_CONFIG_PRIORITY: "90"

        networking:
          # IPv4-overlay geneve — стандартный режим Kube-OVN для multi-VPC.
          NET_STACK: ipv4
          NETWORK_TYPE: geneve
          TUNNEL_TYPE: geneve
          DEFAULT_SUBNET: "ovn-default"
          DEFAULT_VPC: "ovn-cluster"
          NODE_SUBNET: "join"
          # Default ovn-default 10.16.0.0/16 пересекается с node-network (ноды
          # на 10.16.0.x). Уводим default-pod-subnet в 10.99.0.0/16 — не
          # используется ни для primary CNI (Cilium), ни для underlay.
          ENABLE_EIP_SNAT: false

        # Для secondary-CNI режима не нужны OVN-овые LB / NetworkPolicy / NAT-GW
        # (это всё Cilium делает на primary path). Disable'им — упрощает init
        # и уменьшает поверхность Kube-OVN.
        func:
          ENABLE_LB: false
          ENABLE_NP: false
          ENABLE_NAT_GW: false

        ipv4:
          # Все cidr должны быть взаимно непересекающимися. node-network на
          # кластере = 10.16.x.x; реальный k8s service-CIDR = 10.100.0.0/16
          # (Service IP'и кластера 10.100.0.1, 10.100.x.y). Выбираем POD_CIDR
          # из RFC1918, не пересекающегося с обоими.
          POD_CIDR: "172.30.0.0/16"
          POD_GATEWAY: "172.30.0.1"
          SVC_CIDR: "10.100.0.0/16"
          JOIN_CIDR: "100.64.0.0/16"
          PINGER_EXTERNAL_ADDRESS: "1.1.1.1"

        dual_stack:
          POD_CIDR: "172.30.0.0/16,fd00:172:30::/112"
          POD_GATEWAY: "172.30.0.1,fd00:172:30::1"
          SVC_CIDR: "10.100.0.0/16,fd00:10:100::/112"
          JOIN_CIDR: "100.64.0.0/16,fd00:100:64::/112"
          PINGER_EXTERNAL_ADDRESS: "1.1.1.1,2606:4700:4700::1111"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
