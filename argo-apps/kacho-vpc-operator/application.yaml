# ArgoCD Application для kacho-vpc-operator. Источник — собственно репо
# kacho-vpc-operator, директория `config/` (RBAC + Deployment). Деплоится в
# namespace `kacho-vpc-operator` на client-кластере. Image — Docker Hub
# (`docker.io/prorobotech/kacho-vpc-operator:dev`).
#
# Оператор подключается gRPC'ом к `vpc.kacho.svc:9091` и материализует Subnets
# из указанного folder'а в `kubeovn.io/Subnet` + Multus NAD в `kacho-multus`.
# Folder-id берётся из ConfigMap `kacho-vpc-operator-config`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kacho-vpc-operator
  namespace: in-cloud-argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kacho-vpc-operator
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/PRO-Robotech/kacho-vpc-operator.git
    path: config
    targetRevision: main
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
