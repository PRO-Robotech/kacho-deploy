# AddonValue для client-кластерного cilium addon. Снимает `cni.exclusive`,
# из-за которого Cilium бэкапил sterонние CNI-конфиги в /etc/cni/net.d/ как
# `*.cilium_bak` — это блокировало Multus от регистрации `00-multus.conf`
# поверх Cilium и от вызова Kube-OVN CNI как secondary через NetworkAttachmentDefinition.
#
# Селекторы соответствуют Addon/cilium-client.valuesSelectors[name=custom]
# (priority 90) — `addons.in-cloud.io/addon: cilium-client` +
# `addons.in-cloud.io/values: custom`.
#
# Apply на context=infra (там addon-operator). После применения addon-operator
# пересинхрнизирует ArgoCD Application `cilium-client`, и Cilium на client-
# кластере получит `cni.exclusive=false` → перестанет бэкапить multus-conf.
apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonValue
metadata:
  name: cilium-client-cni-non-exclusive
  namespace: beget-argocd
  labels:
    addons.in-cloud.io/addon: cilium-client
    addons.in-cloud.io/values: custom
spec:
  values: |
    cilium:
      cni:
        # Не бэкапить sterонние CNI conf'ы (00-multus.conf,
        # 01-kube-ovn.conflist) как *.cilium_bak. Нужно для multi-CNI с Multus.
        exclusive: false
