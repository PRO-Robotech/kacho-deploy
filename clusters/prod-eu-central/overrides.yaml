# Cluster-specific overrides for prod-eu-central region.
# Applied on top of values.yaml + values.prod.yaml at install time:
#   helm upgrade kacho ./helm/umbrella \
#     -f helm/umbrella/values.yaml \
#     -f helm/umbrella/values.prod.yaml \
#     -f clusters/prod-eu-central/overrides.yaml

kacho:
  domain: "api.kacho.cloud"
  region: "prod-eu-central"
  cluster: "prod-eu-central"

multiRegion:
  loadBalancer:
    zone: "kacho.cloud"

# Region-aware default labels propagated to all kacho-iam-platform workloads.
podLabels:
  "kacho.cloud/region": "prod-eu-central"
  "kacho.cloud/cluster": "prod-eu-central"
  "kacho.cloud/canary": "false"
  "app.kubernetes.io/part-of": "kacho-iam-platform"

# Postgres clusters in eu-central are PRIMARY for cross-region streaming.
postgresHa:
  defaults:
    backup:
      s3:
        bucket: "kacho-postgres-backups-eu-central-1-prod"
        region: "eu-central-1"

# Observability — point to S3 buckets owned by this region account.
observability:
  tempo:
    storage:
      s3:
        bucket: "kacho-traces-eu-central-1-prod"
        region: "eu-central-1"
  mimir:
    storage:
      s3:
        bucket: "kacho-metrics-eu-central-1-prod"
        region: "eu-central-1"
  loki:
    storage:
      s3:
        bucket: "kacho-logs-eu-central-1-prod"
        region: "eu-central-1"

# Audit pipeline — Kafka MirrorMaker 2 producer side (eu-central → eu-west).
kafka:
  mirrorMaker2:
    enabled: true
    role: "producer"
    sourceCluster: "prod-eu-central"
    targetCluster: "prod-eu-west"
    targetBootstrapServers: "kafka.prod-eu-west.kacho.svc.cluster.local:9092"
