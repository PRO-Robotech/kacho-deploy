# Staging-cluster overrides. Used by argocd-apps/staging/* applications.
# Applied with values.yaml + values.dev.yaml + this overrides file.

kacho:
  domain: "staging.kacho.cloud"
  region: "staging"
  cluster: "staging"

# Single-region staging — multi-region is prod-only.
multiRegion:
  regions:
    - name: staging
      enabled: true
      priority: 1
      weight: 100
      cloudProvider: "aws"
      region: "eu-central-1"

# Reduced resource footprint for staging.
postgresHa:
  defaults:
    replicas: 1                            # single-node staging
    storageSize: "20Gi"
    syncStandbyCount: 0
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: 1000m, memory: 2Gi }
    backup:
      enabled: false

observability:
  mimir:
    replicas:
      ingester: 1
      querier: 1
      storeGateway: 1
      compactor: 1
      ruler: 1
  loki:
    replicas:
      ingester: 1
      querier: 1
      distributor: 1

# cert-manager: use Let's Encrypt staging (no rate-limit + non-trusted certs).
certManager:
  issuers:
    prod:
      enabled: false
    staging:
      enabled: true
  certificates:
    - name: "kacho-wildcard-tls"
      namespace: "kacho-system"
      secretName: "kacho-wildcard-tls"
      issuerRef: "letsencrypt-staging"
      dnsNames:
        - "staging.kacho.cloud"
        - "*.staging.kacho.cloud"
      duration: "2160h"
      renewBefore: "720h"
      privateKey: { algorithm: "ECDSA", size: 256 }
