---
# cert-manager Issuer + Certificate для api-gateway TLS.
# Self-signed (8760h / 1y) — для prod заменить на letsencrypt-prod ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kacho-selfsigned
  namespace: kacho
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-gateway-tls
  namespace: kacho
spec:
  secretName: api-gateway-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: kacho-selfsigned
    kind: Issuer
  commonName: api.kacho.local
  subject:
    organizations: [Kacho]
  dnsNames:
    - api.kacho.local
    - localhost
  ipAddresses:
    - 127.0.0.1
    - 0.0.0.0
