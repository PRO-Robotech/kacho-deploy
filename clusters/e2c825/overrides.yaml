# Cluster e2c825-specific overrides (Beget hosting).
# Use: helm install -f helm/umbrella/values.dev.yaml -f clusters/e2c825/overrides.yaml
#
# KAC-115: Zitadel + OpenFGA stack REPLACED by Ory Kratos + Hydra + Keto.

# KAC-124: resource-manager image override удалён — backend упразднён.

# KAC-106 (E1): folder_id → project_id; peers switched to kacho-iam
vpc:
  image: ttl.sh/kac125-1779140193/kacho-vpc:24h
  imagePullPolicy: Always
  iamAddr: "kacho-iam.kacho.svc.cluster.local:9090"
  # KAC-120: per-RPC Check через kacho-iam.InternalIAMService.Check (port 9091).
  authz:
    iamEndpoint: "kacho-iam-internal.kacho.svc.cluster.local:9091"
    breakglass: false
    checkTimeout: 2s
    cacheTtl: 5s
    denyRateLimitPerSec: 100

compute:
  image: ttl.sh/kac125-1779140195/kacho-compute:24h
  imagePullPolicy: Always
  iamAddr: "kacho-iam.kacho.svc.cluster.local:9090"
  # KAC-120: env для Check-interceptor.
  env:
    KACHO_COMPUTE_AUTHZ_IAM_GRPC_ADDR: "kacho-iam-internal.kacho.svc.cluster.local:9091"
    KACHO_COMPUTE_AUTHZ_IAM_TLS: "false"
    KACHO_COMPUTE_AUTHZ_BREAKGLASS: "false"

api-gateway:
  # KAC-125: rebuilt с восстановленным InternalIAMService.Check + UserService.Invite stubs.
  image: ttl.sh/kac125b-1779139142/kacho-api-gateway:24h
  imagePullPolicy: Always
  authn:
    mode: dev
    devSecret: "kacho-dev-jwt-secret-2026"
  # KAC-115/116: OIDC → Hydra (вместо Zitadel). Primary auth path —
  # Kratos session cookie (см. KACHO_API_GATEWAY_KRATOS_PUBLIC_URL ниже).
  oidc:
    enabled: true
    issuer: "http://kacho-umbrella-hydra-public:4444"
    externalIssuer: "http://5.35.93.58/.ory/hydra/public"
    redirectUri: "http://5.35.93.58/iam/v1/auth/callback"
    clientIdSecretRef:
      name: kacho-iam-oidc-client
      key: client_id
      optional: true
  env:
    # KAC-116: Kratos session-based auth (cookie ory_kratos_session).
    KACHO_API_GATEWAY_KRATOS_PUBLIC_URL: "http://kacho-umbrella-kratos-public.kacho.svc.cluster.local:80"

ui:
  # KAC-125: AccessPage YC-style + Cascader + InviteModal.
  image: ttl.sh/kac125c-1779139941/kacho-ui:24h
  imagePullPolicy: Always

kacho-iam:
  # KAC-125: User per-Account + Invite RPC + UpsertFromIdentity rewrite.
  image:
    repository: ttl.sh/kac125-1779138741/kacho-iam
    tag: "24h"
    pullPolicy: Always
  initContainer:
    waitForExtAuth:
      enabled: false
  env:
    KACHO_DEBUG_PRINCIPAL: "1"
    # KAC-116: AuthZ backend → Keto (replaces OpenFGA).
    KACHO_IAM_AUTHZ_BACKEND: "keto"
    # Service expose'ит port 80 (Read API REST). 4466 — это headless container port.
    KACHO_IAM_KETO_READ_URL: "http://kacho-umbrella-keto-read.kacho.svc.cluster.local:80"
    KACHO_IAM_KETO_WRITE_URL: "http://kacho-umbrella-keto-write.kacho.svc.cluster.local:80"
    # KAC-119: bootstrap admin matcher.
    # Format: exact email (`admin@prorobotech.ru`) либо domain suffix
    # начинается с `@` (`@prorobotech.ru` — любой user с этим domain → admin).
    # Domain-based — для corporate setup (все сотрудники @prorobotech.ru — админы).
    KACHO_IAM_BOOTSTRAP_ADMIN_EMAIL: "@prorobotech.ru"

# === Deprecated stack (KAC-115 migration): disabled ===
zitadel:
  enabled: false
openfga:
  enabled: false
pg-zitadel:
  enabled: false
pg-openfga:
  enabled: false
openfgaBootstrap:
  enabled: false
zitadelOidcBootstrap:
  enabled: false
mailhog:
  enabled: false

# === Ory stack (KAC-115) ===
pg-kratos:
  enabled: true
pg-hydra:
  enabled: true
pg-keto:
  enabled: true
kratos:
  enabled: true
hydra:
  enabled: true
keto:
  enabled: true
kratosSelfServiceUI:
  enabled: true

# Disable kind-style ingress-nginx (требует node-label `ingress-ready=true`).
# Внешний доступ — через LoadBalancer Services (clusters/e2c825/loadbalancers.yaml).
ingress-nginx:
  enabled: false
