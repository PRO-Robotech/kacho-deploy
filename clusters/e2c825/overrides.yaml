# Cluster e2c825-specific overrides (Beget hosting).
# Use: helm install -f helm/umbrella/values.dev.yaml -f clusters/e2c825/overrides.yaml
#
# KAC-115: Zitadel + OpenFGA stack REPLACED by Ory Kratos + Hydra + Keto.

resource-manager:
  image: ttl.sh/kacho-kac111-202605170506/kacho-resource-manager:24h
  imagePullPolicy: Always

# KAC-106 (E1): folder_id → project_id; peers switched to kacho-iam
vpc:
  image: ttl.sh/kacho-kac106-202605171800/kacho-vpc:24h
  imagePullPolicy: Always
  iamAddr: "kacho-iam.kacho.svc.cluster.local:9090"

compute:
  image: ttl.sh/kacho-kac106-202605171800/kacho-compute:24h
  imagePullPolicy: Always
  iamAddr: "kacho-iam.kacho.svc.cluster.local:9090"

api-gateway:
  image: ttl.sh/kacho-ory-116-1779055873/kacho-api-gateway:24h
  imagePullPolicy: Always
  authn:
    mode: dev
    devSecret: "kacho-dev-jwt-secret-2026"
  # KAC-115/116: OIDC → Hydra (вместо Zitadel). Primary auth path —
  # Kratos session cookie (см. KACHO_API_GATEWAY_KRATOS_PUBLIC_URL ниже).
  oidc:
    enabled: true
    issuer: "http://kacho-umbrella-hydra-public:4444"
    externalIssuer: "http://5.35.93.58/.ory/hydra/public"
    redirectUri: "http://5.35.93.58/iam/v1/auth/callback"
    clientIdSecretRef:
      name: kacho-iam-oidc-client
      key: client_id
      optional: true
  env:
    # KAC-116: Kratos session-based auth (cookie ory_kratos_session).
    KACHO_API_GATEWAY_KRATOS_PUBLIC_URL: "http://kacho-umbrella-kratos-public.kacho.svc.cluster.local:80"

ui:
  image: ttl.sh/kacho-118-ui-1779058241/kacho-ui:24h
  imagePullPolicy: Always

kacho-iam:
  image:
    repository: ttl.sh/kacho-118-1779058224/kacho-iam
    tag: "24h"
    pullPolicy: Always
  initContainer:
    waitForExtAuth:
      enabled: false
  env:
    KACHO_DEBUG_PRINCIPAL: "1"
    # KAC-116: AuthZ backend → Keto (replaces OpenFGA).
    KACHO_IAM_AUTHZ_BACKEND: "keto"
    KACHO_IAM_KETO_READ_URL: "http://kacho-umbrella-keto-read.kacho.svc.cluster.local:4466"
    KACHO_IAM_KETO_WRITE_URL: "http://kacho-umbrella-keto-write.kacho.svc.cluster.local:4467"

# === Deprecated stack (KAC-115 migration): disabled ===
zitadel:
  enabled: false
openfga:
  enabled: false
pg-zitadel:
  enabled: false
pg-openfga:
  enabled: false
openfgaBootstrap:
  enabled: false
zitadelOidcBootstrap:
  enabled: false
mailhog:
  enabled: false

# === Ory stack (KAC-115) ===
pg-kratos:
  enabled: true
pg-hydra:
  enabled: true
pg-keto:
  enabled: true
kratos:
  enabled: true
hydra:
  enabled: true
keto:
  enabled: true
kratosSelfServiceUI:
  enabled: true

# Disable kind-style ingress-nginx (требует node-label `ingress-ready=true`).
# Внешний доступ — через LoadBalancer Services (clusters/e2c825/loadbalancers.yaml).
ingress-nginx:
  enabled: false
