# Cluster e2c825-specific overrides (Beget hosting).
# Use: helm install -f helm/umbrella/values.dev.yaml -f clusters/e2c825/overrides.yaml

resource-manager:
  image: ttl.sh/kacho-kac111-202605170506/kacho-resource-manager:24h
  imagePullPolicy: Always
# KAC-106 (E1): folder_id → project_id; peers switched to kacho-iam
vpc:
  image: ttl.sh/kacho-kac106-202605171800/kacho-vpc:24h
  imagePullPolicy: Always
  iamAddr: "kacho-iam.kacho.svc.cluster.local:9090"
compute:
  image: ttl.sh/kacho-kac106-202605171800/kacho-compute:24h
  imagePullPolicy: Always
  iamAddr: "kacho-iam.kacho.svc.cluster.local:9090"
api-gateway:
  # KAC-107 followup REST-Principal fix (apigw#13 + mux WithMetadata + IncomingHeaderMatcher):
  # HTTP middleware extracts JWT → Grpc-Metadata-X-Kacho-Principal-* (then mux
  # WithMetadata callback forwards them as outgoing gRPC metadata for the
  # gateway→backend hop) → backend ctx via UnaryPrincipalExtract.
  image: ttl.sh/kacho-debug-173134-202605172040/kacho-api-gateway:24h
  imagePullPolicy: Always
  authn:
    mode: dev
    devSecret: "kacho-dev-jwt-secret-2026"
ui:
  image: ttl.sh/kacho-kac109-202605171612/kacho-ui:24h
  imagePullPolicy: Always

# KAC-105 (IAM E0): kacho-iam control-plane deployed в e2c825 2026-05-17
# после merge всей IAM-цепочки (proto#16/corelib#3/iam#1/apigw#9+#10/vpc#98+#99/
# compute#21/rm#6/iam#2). KAC-104 DoD #6 closure.
kacho-iam:
  # KAC-107 followup (corelib#7 + iam#5 + corelib debug-extract): scanOperation
  # Principal-assign + operationToProto Principal-copy — closes DoD #4
  # (Operation.principal real). Image rebuilt with KACHO_DEBUG_PRINCIPAL env hook
  # in corelib/grpcsrv principal_extract.go for debugging incoming metadata.
  image:
    repository: ttl.sh/kacho-iam-principal-fix2-202605172100/kacho-iam
    tag: "24h"
    pullPolicy: Always
  initContainer:
    # E0/E1 (текущая фаза): Zitadel/OpenFGA не deployed → отключаем wait-for-*
    # init-container'ы (иначе pod зависает в Init на 300s timeout).
    waitForExtAuth:
      enabled: false
  env:
    KACHO_DEBUG_PRINCIPAL: "1"

# KAC-108 (E3 DoD #5): OpenFGA + pg-openfga + bootstrap deployed.
# KAC-107 (E2 DoD #1): chicken-and-egg pg-zitadel resolved через
# `values.dev.yaml#zitadel.{initJob,setupJob}` override:
#   - annotations: {} → снимает `helm.sh/hook: pre-install,pre-upgrade`
#     (Job создаётся в основной фазе install ВМЕСТЕ с pg-zitadel Service,
#     а не в pre-фазе, когда pg ещё нет).
#   - initContainers: wait-for-pg busybox loop на kacho-umbrella-pg-zitadel:5432.
# Теперь одной командой `helm upgrade --install` deploy'ит весь IAM-стек
# (pg-zitadel + zitadel) — no two-stage manual ordering.
zitadel:
  enabled: true
openfga:
  enabled: true
pg-zitadel:
  enabled: true
pg-openfga:
  enabled: true
openfgaBootstrap:
  enabled: false

# Disable kind-style ingress-nginx (требует node-label `ingress-ready=true`).
# Внешний доступ — через LoadBalancer Services (clusters/e2c825/loadbalancers.yaml).
ingress-nginx:
  enabled: false
