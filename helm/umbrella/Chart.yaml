apiVersion: v2
name: kacho-umbrella
version: 1.0.0
description: Kachō Cloud Control Plane — dev umbrella (flat API + Operations)
dependencies:
  - name: ingress-nginx
    version: 4.x
    repository: https://kubernetes.github.io/ingress-nginx
  - name: postgresql
    alias: pg-resource-manager
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  - name: postgresql
    alias: pg-vpc
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  - name: postgresql
    alias: pg-compute
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  # KAC-105: IAM stack — отдельные Postgres-инстансы под kacho-iam / Zitadel / OpenFGA
  # (запрет #8: database-per-service; +«независимые БД» из sub-phase-2.0-iam-overview §4).
  - name: postgresql
    alias: pg-iam
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  - name: postgresql
    alias: pg-zitadel
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  - name: postgresql
    alias: pg-openfga
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  - name: resource-manager
    version: 1.0.0
    repository: file://../../../kacho-resource-manager/deploy
  - name: vpc
    version: 1.0.0
    repository: file://../../../kacho-vpc/deploy
  - name: compute
    version: 1.0.0
    repository: file://../../../kacho-compute/deploy
  # vpc-controllers упразднён: IPAM/default-SG встроены в kacho-vpc inline (Phase 2).
  # loadbalancer — frozen в 1.0 (proto verbatim YC, backend ещё не переписан)
  - name: api-gateway
    version: 1.0.0
    repository: file://../../../kacho-api-gateway/deploy
  - name: ui
    version: 1.0.0
    repository: file://../../../kacho-ui/deploy
  # KAC-105 (sub-phase 2.0 IAM, E0 skeleton). Sub-chart живёт в umbrella/charts/kacho-iam/
  # (file:// относительно Chart.yaml). На E0 image скорее всего ещё не существует —
  # см. values.dev.yaml `kacho-iam.image.repository` / `tag` для конкретики.
  - name: kacho-iam
    version: 1.0.0
    repository: file://./charts/kacho-iam
  # External charts для IAM stack. Версии резолвнуты `helm dependency update`
  # на 2026-05-17 (KAC-105): zitadel-8.13.4, openfga-0.2.62.
  - name: zitadel
    version: 8.x
    repository: https://charts.zitadel.com
  - name: openfga
    version: 0.2.x
    repository: https://openfga.github.io/helm-charts
