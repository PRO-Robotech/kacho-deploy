apiVersion: v2
name: kacho-umbrella
version: 2.0.0
description: "Kachō Cloud Control Plane — production umbrella (flat API + Operations). KAC-127 Phase 11: Multi-region active-active + Cloudflare WAF/DDoS/Access + cert-manager Let's Encrypt + Argo CD GitOps with canary ArgoRollouts + SBOM/SLSA L3/cosign supply-chain + OpenTelemetry/Tempo/Mimir/Loki/Grafana observability + Sloth SLO controller + AlertManager → PagerDuty + Patroni Postgres HA. Builds on Phase 10 (SPIRE+Cilium mesh), Phase 9 (audit pipeline), Phase 3 (OpenFGA+OPA+Conditions), Phase 2 (Kratos+Hydra+JWKS), Phase 1 (DB foundation)."
dependencies:
  - name: ingress-nginx
    version: 4.x
    repository: https://kubernetes.github.io/ingress-nginx
    # condition-gated: clusters that expose via LoadBalancer Services (e.g.
    # e2c825) disable the kind-style ingress-nginx via `ingress-nginx.enabled:
    # false`. Без `condition:` сабчарт ставился безусловно и его controller
    # вечно висел Pending (нет node-label `ingress-ready=true`) → `helm --wait`
    # timeout.
    condition: ingress-nginx.enabled
  # KAC-124: `pg-resource-manager` Postgres-инстанс удалён — backend kacho-resource-manager упразднён.
  - name: postgresql
    alias: pg-vpc
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  - name: postgresql
    alias: pg-compute
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  # KAC-105: IAM stack — отдельные Postgres-инстансы под kacho-iam / OpenFGA
  # (запрет #8: database-per-service; +«независимые БД» из sub-phase-2.0-iam-overview §4).
  # KAC-127: pg-zitadel удалён — auth-tier (identity/OIDC) на Ory Kratos + Hydra.
  - name: postgresql
    alias: pg-iam
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  - name: postgresql
    alias: pg-openfga
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-openfga.enabled
  # KAC-NLB: kacho-nlb owns its own Postgres instance (database-per-service,
  # workspace CLAUDE.md "Запреты" #8). Schema `kacho_nlb`, owned by the
  # `kacho-nlb` init-container migrator (goose). Condition-gated so clusters
  # that do not yet need NLB (e.g. early-phase dev) can stay lean — flip
  # `pg-nlb.enabled=true` in values.dev.yaml / values.prod.yaml.
  - name: postgresql
    alias: pg-nlb
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-nlb.enabled
  # KAC-124: resource-manager sub-chart удалён — backend заменён на kacho-iam
  # (Account/Project — см. ниже).
  # KAC-125: sibling sub-chart версии оставляем без жёсткого pin (`>= 0.0.0`),
  # т.к. CI клонирует origin/main каждого sibling-репо и Chart.yaml там может быть
  # любой версии. Жёсткий pin (например `1.2.0`) ломает `helm dep update` в CI:
  # `can't get a valid version for "api-gateway"`. Локально и в проде версия всё
  # равно резолвится из самого Chart.yaml sibling-репо — pin тут только проверка.
  # Sibling sub-charts are resolved from sibling repo checkouts laid out next to
  # kacho-deploy (CI checks them out into $GITHUB_WORKSPACE/kacho-<svc>; локально —
  # kacho-workspace/project/kacho-<svc>). CI pins the sibling checkout to the
  # KAC-127 branch while the epic is in flight (см. .github/workflows/ci.yaml) —
  # the `file://` path itself is branch-agnostic and stays canonical.
  - name: vpc
    version: ">= 0.0.0"
    repository: file://../../../kacho-vpc/deploy
  - name: compute
    version: ">= 0.0.0"
    repository: file://../../../kacho-compute/deploy
  # vpc-controllers упразднён: IPAM/default-SG встроены в kacho-vpc inline (Phase 2).
  # loadbalancer — frozen в 1.0 (proto verbatim YC, backend ещё не переписан)
  # KAC-NLB: kacho-nlb L4 NLB control-plane (NetworkLoadBalancer / Listener /
  # TargetGroup, flat resources + Operations LRO). Sibling sub-chart, same
  # convention as vpc/compute. Condition-gated (`kacho-nlb.enabled=true`) so
  # clusters without NLB skip the deploy entirely.
  - name: kacho-nlb
    version: ">= 0.0.0"
    repository: file://../../../kacho-nlb/deploy
    condition: kacho-nlb.enabled
  - name: api-gateway
    version: ">= 0.0.0"
    repository: file://../../../kacho-api-gateway/deploy
  - name: ui
    version: ">= 0.0.0"
    repository: file://../../../kacho-ui/deploy
  # Experimental next-gen UI. Kept as a separate chart so it can run next to
  # the legacy `ui` Service and be port-forwarded independently.
  - name: ui-future
    version: ">= 0.0.0"
    repository: file://./charts/ui-future
    condition: ui-future.enabled
  # KAC-105 (sub-phase 2.0 IAM, E0 skeleton). Sub-chart живёт в umbrella/charts/kacho-iam/
  # (file:// относительно Chart.yaml). На E0 image скорее всего ещё не существует —
  # см. values.dev.yaml `kacho-iam.image.repository` / `tag` для конкретики.
  - name: kacho-iam
    version: ">= 1.0.0"
    repository: file://./charts/kacho-iam
  # OpenFGA — REBAC engine для kacho-iam (Phase 3). Condition-gated.
  - name: openfga
    version: 0.2.x
    repository: https://openfga.github.io/helm-charts
    condition: openfga.enabled
  # KAC-115/127: Ory stack — Kratos (identity+self-service flows), Hydra (OAuth2/OIDC),
  # Keto (REBAC). Kratos+Hydra заменили Zitadel (удалён из umbrella в KAC-127).
  - name: kratos
    version: 0.x
    repository: https://k8s.ory.sh/helm/charts
    condition: kratos.enabled
  - name: hydra
    version: 0.x
    repository: https://k8s.ory.sh/helm/charts
    condition: hydra.enabled
  - name: keto
    version: 0.x
    repository: https://k8s.ory.sh/helm/charts
    condition: keto.enabled
  - name: postgresql
    alias: pg-kratos
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-kratos.enabled
  - name: postgresql
    alias: pg-hydra
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-hydra.enabled
  - name: postgresql
    alias: pg-keto
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-keto.enabled
  # KAC-127 Phase 9 — Audit pipeline (sub-phase 3.9): Kafka KRaft + ClickHouse
  # + Kafka Connect S3 sink. Все три chart'а — vendored под helm/umbrella/charts/.
  # Все три выключены по умолчанию (condition: <chart>.enabled); включаются
  # values.prod.yaml или helm upgrade --set kafka.enabled=true.
  - name: kafka
    version: ">= 0.0.0"
    repository: file://./charts/kafka
    condition: kafka.enabled
  - name: clickhouse
    version: ">= 0.0.0"
    repository: file://./charts/clickhouse
    condition: clickhouse.enabled
  - name: kafka-connect
    version: ">= 0.0.0"
    repository: file://./charts/kafka-connect
    condition: kafka-connect.enabled
  # KAC-127 Phase 10 — SPIFFE/SPIRE + Cilium eBPF mesh + cosign attestor.
  # All charts vendored under helm/umbrella/charts/; all condition'ы (opt-in).
  # Dev умbrellа kind-стенд: all disabled by default (нужна полноценная Cilium
  # CNI install + HSM, что выходит за рамки single-node kind). Включаются
  # values.prod.yaml или helm upgrade --set spire-server.enabled=true.
  - name: spire-server
    version: ">= 0.0.0"
    repository: file://./charts/spire-server
    condition: spire-server.enabled
  - name: spire-agent
    version: ">= 0.0.0"
    repository: file://./charts/spire-agent
    condition: spire-agent.enabled
  - name: cilium
    version: ">= 0.0.0"
    repository: file://./charts/cilium
    condition: cilium.enabled
  - name: cosign-policy-controller
    version: ">= 0.0.0"
    repository: file://./charts/cosign-policy-controller
    condition: cosign-policy-controller.enabled
  - name: spiffe-csi-driver
    version: ">= 0.0.0"
    repository: file://./charts/spiffe-csi-driver
    condition: spiffe-csi-driver.enabled
  # Postgres-instance под SPIRE Server DataStore (database-per-service, запрет #8).
  - name: postgresql
    alias: pg-spire
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-spire.enabled
  # KAC-127 Phase 11 — Production deploy + Observability subcharts. All vendored.
  # Conditionally enabled via values.prod.yaml; disabled by default in dev/staging.
  - name: cloudflare-config
    version: ">= 0.0.0"
    repository: file://./charts/cloudflare-config
    condition: cloudflare-config.enabled
  - name: cert-manager-config
    version: ">= 0.0.0"
    repository: file://./charts/cert-manager-config
    condition: cert-manager-config.enabled
  - name: argo-cd
    version: ">= 0.0.0"
    repository: file://./charts/argo-cd
    condition: argo-cd.enabled
  - name: multi-region-router
    version: ">= 0.0.0"
    repository: file://./charts/multi-region-router
    condition: multi-region-router.enabled
  - name: observability
    version: ">= 0.0.0"
    repository: file://./charts/observability
    condition: observability.enabled
  - name: postgres-ha
    version: ">= 0.0.0"
    repository: file://./charts/postgres-ha
    condition: postgres-ha.enabled
  # KAC-127 Phase 12 — Litmus chaos engineering. Opt-in (chaos game-days
  # are operator-driven; never enabled by default in prod values.yaml).
  - name: litmus-chaos
    version: ">= 0.0.0"
    repository: file://./charts/litmus-chaos
    condition: litmus-chaos.enabled
