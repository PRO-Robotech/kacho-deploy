apiVersion: v2
name: kacho-umbrella
version: 1.0.0
description: Kachō Cloud Control Plane — dev umbrella (flat API + Operations)
dependencies:
  - name: ingress-nginx
    version: 4.x
    repository: https://kubernetes.github.io/ingress-nginx
  - name: postgresql
    alias: pg-resource-manager
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  - name: postgresql
    alias: pg-vpc
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  - name: resource-manager
    version: 1.0.0
    repository: file://../../../kacho-resource-manager/deploy
  - name: vpc
    version: 1.0.0
    repository: file://../../../kacho-vpc/deploy
  - name: vpc-controllers
    version: 1.0.0
    repository: file://../../../kacho-vpc-controllers/deploy
  # compute и loadbalancer — frozen в 1.0 (proto verbatim YC, backends ещё не переписаны)
  - name: api-gateway
    version: 1.0.0
    repository: file://../../../kacho-api-gateway/deploy
  - name: ui
    version: 1.0.0
    repository: file://../../../kacho-ui/deploy
