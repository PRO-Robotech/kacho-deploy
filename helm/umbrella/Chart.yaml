apiVersion: v2
name: kacho-umbrella
version: 0.1.0
description: Kachō Cloud Control Plane — dev umbrella
dependencies:
  - name: ingress-nginx
    version: 4.x
    repository: https://kubernetes.github.io/ingress-nginx
  - name: postgresql
    alias: pg-resource-manager
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
