apiVersion: v2
name: kacho-umbrella
version: 1.0.9
description: "Kachō Cloud Control Plane — dev umbrella (flat API + Operations). KAC-125: User per-Account + Invite-flow + helm-lint fix (sibling chart versions unpinned)."
dependencies:
  - name: ingress-nginx
    version: 4.x
    repository: https://kubernetes.github.io/ingress-nginx
  # KAC-124: `pg-resource-manager` Postgres-инстанс удалён — backend kacho-resource-manager упразднён.
  - name: postgresql
    alias: pg-vpc
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  - name: postgresql
    alias: pg-compute
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  # KAC-105: IAM stack — отдельные Postgres-инстансы под kacho-iam / Zitadel / OpenFGA
  # (запрет #8: database-per-service; +«независимые БД» из sub-phase-2.0-iam-overview §4).
  - name: postgresql
    alias: pg-iam
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  - name: postgresql
    alias: pg-zitadel
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-zitadel.enabled
  - name: postgresql
    alias: pg-openfga
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-openfga.enabled
  # KAC-124: resource-manager sub-chart удалён — backend заменён на kacho-iam
  # (Account/Project — см. ниже).
  # KAC-125: sibling sub-chart версии оставляем без жёсткого pin (`>= 0.0.0`),
  # т.к. CI клонирует origin/main каждого sibling-репо и Chart.yaml там может быть
  # любой версии. Жёсткий pin (например `1.2.0`) ломает `helm dep update` в CI:
  # `can't get a valid version for "api-gateway"`. Локально и в проде версия всё
  # равно резолвится из самого Chart.yaml sibling-репо — pin тут только проверка.
  - name: vpc
    version: ">= 0.0.0"
    repository: file://../../../kacho-vpc/deploy
  - name: compute
    version: ">= 0.0.0"
    repository: file://../../../kacho-compute/deploy
  # vpc-controllers упразднён: IPAM/default-SG встроены в kacho-vpc inline (Phase 2).
  # loadbalancer — frozen в 1.0 (proto verbatim YC, backend ещё не переписан)
  - name: api-gateway
    version: ">= 0.0.0"
    repository: file://../../../kacho-api-gateway/deploy
  - name: ui
    version: ">= 0.0.0"
    repository: file://../../../kacho-ui/deploy
  # KAC-105 (sub-phase 2.0 IAM, E0 skeleton). Sub-chart живёт в umbrella/charts/kacho-iam/
  # (file:// относительно Chart.yaml). На E0 image скорее всего ещё не существует —
  # см. values.dev.yaml `kacho-iam.image.repository` / `tag` для конкретики.
  - name: kacho-iam
    version: 1.0.0
    repository: file://./charts/kacho-iam
  # External charts для IAM stack. Версии резолвнуты `helm dependency update`
  # на 2026-05-17 (KAC-105): zitadel-8.13.4, openfga-0.2.62.
  # Conditions добавлены 2026-05-17 — позволяют выключать chart'ы через values
  # (`zitadel.enabled: false` / `openfga.enabled: false`). Нужны для E0/E1 deploy,
  # пока Zitadel/OpenFGA-инфраструктура не развернута; включить на E2/E3.
  - name: zitadel
    version: 8.x
    repository: https://charts.zitadel.com
    condition: zitadel.enabled
  - name: openfga
    version: 0.2.x
    repository: https://openfga.github.io/helm-charts
    condition: openfga.enabled
  # KAC-115: Ory stack — Kratos (identity+self-service flows), Hydra (OAuth2/OIDC),
  # Keto (REBAC ≈ OpenFGA). Включаются через `<chart>.enabled` в overrides;
  # заменяют Zitadel+OpenFGA одной командой helm upgrade.
  - name: kratos
    version: 0.x
    repository: https://k8s.ory.sh/helm/charts
    condition: kratos.enabled
  - name: hydra
    version: 0.x
    repository: https://k8s.ory.sh/helm/charts
    condition: hydra.enabled
  - name: keto
    version: 0.x
    repository: https://k8s.ory.sh/helm/charts
    condition: keto.enabled
  - name: postgresql
    alias: pg-kratos
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-kratos.enabled
  - name: postgresql
    alias: pg-hydra
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-hydra.enabled
  - name: postgresql
    alias: pg-keto
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-keto.enabled
