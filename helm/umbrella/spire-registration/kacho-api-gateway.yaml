# KAC-127 Phase 10 — SPIFFE registration entry for kacho-api-gateway.
apiVersion: kacho.cloud/v1
kind: SpiffeRegistration
metadata:
  name: kacho-api-gateway
  labels:
    kacho.cloud/component: spiffe-registration
    kacho.cloud/phase: "10"
spec:
  spiffeId: "spiffe://{{ trustDomain }}/ns/kacho-system/sa/kacho-api-gateway"
  parentId: "spiffe://{{ trustDomain }}/ns/spire-system/sa/spire-agent"
  selectors:
    - type: k8s
      value: "ns:kacho-system"
    - type: k8s
      value: "sa:kacho-api-gateway"
    - type: cosign
      value: "image-signature:{{ cosignFingerprint }}"
  ttl: 3600
  dnsNames:
    - "api.{{ kachoDomain }}"
    - "kacho-api-gateway.kacho-system.svc"
