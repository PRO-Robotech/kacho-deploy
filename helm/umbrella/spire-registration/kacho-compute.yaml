# KAC-127 Phase 10 — SPIFFE registration entry for kacho-compute.
apiVersion: kacho.cloud/v1
kind: SpiffeRegistration
metadata:
  name: kacho-compute
  labels:
    kacho.cloud/component: spiffe-registration
    kacho.cloud/phase: "10"
spec:
  # SEC-F §«коллизия»: ns aligned to single-source spiffe.namespace (kacho).
  spiffeId: "spiffe://{{ trustDomain }}/ns/kacho/sa/kacho-compute"
  parentId: "spiffe://{{ trustDomain }}/ns/spire-system/sa/spire-agent"
  selectors:
    - type: k8s
      value: "ns:kacho"
    - type: k8s
      value: "sa:kacho-compute"
    - type: cosign
      value: "image-signature:{{ cosignFingerprint }}"
  ttl: 3600
  dnsNames:
    - "kacho-compute.kacho.svc"
    - "kacho-compute.kacho.svc.cluster.local"
