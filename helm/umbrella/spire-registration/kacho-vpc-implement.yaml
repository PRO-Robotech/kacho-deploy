# KAC-127 Phase 10 — SPIFFE registration entry for kacho-vpc-implement (data-plane).
apiVersion: kacho.cloud/v1
kind: SpiffeRegistration
metadata:
  name: kacho-vpc-implement
  labels:
    kacho.cloud/component: spiffe-registration
    kacho.cloud/phase: "10"
spec:
  spiffeId: "spiffe://{{ trustDomain }}/ns/kacho-system/sa/kacho-vpc-implement"
  parentId: "spiffe://{{ trustDomain }}/ns/spire-system/sa/spire-agent"
  selectors:
    - type: k8s
      value: "ns:kacho-system"
    - type: k8s
      value: "sa:kacho-vpc-implement"
    - type: cosign
      value: "image-signature:{{ cosignFingerprint }}"
  ttl: 3600
