# KAC-127 Phase 10 — SPIFFE registration entry for kacho-nlb.
# SEC-F §4.1.6: renamed from kacho-loadbalancer → kacho-nlb (canonical name,
# Makefile DEPLOY_NAME=kacho-nlb). Namespace aligned to the single-source
# `spiffe.namespace` (kacho) — snaps the kacho vs kacho-system collision so the
# cert-manager client-cert URI-SAN, IAM cert→SA mapping and this entry agree.
apiVersion: kacho.cloud/v1
kind: SpiffeRegistration
metadata:
  name: kacho-nlb
  labels:
    kacho.cloud/component: spiffe-registration
    kacho.cloud/phase: "10"
spec:
  spiffeId: "spiffe://{{ trustDomain }}/ns/kacho/sa/kacho-nlb"
  parentId: "spiffe://{{ trustDomain }}/ns/spire-system/sa/spire-agent"
  selectors:
    - type: k8s
      value: "ns:kacho"
    - type: k8s
      value: "sa:kacho-nlb"
    - type: cosign
      value: "image-signature:{{ cosignFingerprint }}"
  ttl: 3600
  dnsNames:
    - "kacho-nlb.kacho.svc"
    - "kacho-nlb.kacho.svc.cluster.local"
