# KAC-127 Phase 10 — SPIFFE registration entry for kacho-ui admin pod.
apiVersion: kacho.cloud/v1
kind: SpiffeRegistration
metadata:
  name: kacho-ui-admin
  labels:
    kacho.cloud/component: spiffe-registration
    kacho.cloud/phase: "10"
spec:
  spiffeId: "spiffe://{{ trustDomain }}/ns/kacho-system/sa/kacho-ui-admin"
  parentId: "spiffe://{{ trustDomain }}/ns/spire-system/sa/spire-agent"
  selectors:
    - type: k8s
      value: "ns:kacho-system"
    - type: k8s
      value: "sa:kacho-ui-admin"
    - type: cosign
      value: "image-signature:{{ cosignFingerprint }}"
  ttl: 3600
