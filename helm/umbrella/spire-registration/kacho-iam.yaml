# KAC-127 Phase 10 — SPIFFE registration entry for kacho-iam.
apiVersion: kacho.cloud/v1
kind: SpiffeRegistration
metadata:
  name: kacho-iam
  labels:
    kacho.cloud/component: spiffe-registration
    kacho.cloud/phase: "10"
spec:
  # SEC-F §«коллизия»: ns aligned to single-source spiffe.namespace (kacho).
  spiffeId: "spiffe://{{ trustDomain }}/ns/kacho/sa/kacho-iam"
  parentId: "spiffe://{{ trustDomain }}/ns/spire-system/sa/spire-agent"
  selectors:
    - type: k8s
      value: "ns:kacho"
    - type: k8s
      value: "sa:kacho-iam"
    # cosign selector — обязательная supply-chain проверка (P10-D9).
    # Fingerprint configurable via {{ cosignFingerprint }} per env.
    - type: cosign
      value: "image-signature:{{ cosignFingerprint }}"
  ttl: 3600
  dnsNames:
    - "kacho-iam.kacho.svc"
    - "kacho-iam.kacho.svc.cluster.local"
