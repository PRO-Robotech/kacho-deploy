{{- if .Values.openfgaBootstrap.enabled }}
{{/*
KAC-127 Phase 3 (acceptance §5.1 / design §4) — full OpenFGA Authorization Model v2.
=====================================================================================

KAC-127 reconciliation: `model.fga` / `model.json` ниже — сгенерированы из
**канонического** артефакта `kacho-proto/proto/kacho/cloud/iam/v1/fga_model.fga`
(единый источник истины). DSL покрывает:
  - cluster (singleton `cluster_kacho_root`) с system_admin / emergency_admin
    (break-glass, conditioned `break_glass_window`) / system_viewer / billing_admin /
    console / any_admin (union system_admin∪emergency_admin).
  - organization tier (optional B2B); owner / admin / editor / viewer / billing_admin / member.
  - account / project tiers с cascading `or admin from <parent>` semantics —
    `account.admin` каскадит `any_admin from cluster` + `admin from organization` + `owner`.
  - per-service resource-types: vpc_network / vpc_subnet / vpc_security_group /
    vpc_route_table / vpc_address / vpc_gateway / vpc_private_endpoint /
    vpc_network_interface / vpc_address_pool / compute_instance / compute_disk /
    compute_image / compute_snapshot / compute_hypervisor / lb_network_load_balancer /
    lb_target_group.
  - IAM resource-types (per-resource scope в permission catalog scope_extractor):
    iam_user / iam_service_account / iam_group / iam_role / iam_access_binding /
    iam_condition.
  - 7 предустановленных Conditions (mfa_fresh / non_expired / source_ip_in_range /
    break_glass_window / jit_window / business_hours / device_compliant).

Bootstrap-job (см. openfga-bootstrap-job.yaml) реализует idempotent-deploy
(sha256-compare DSL с current Secret annotation, skip-write если совпадает;
иначе WriteAuthorizationModel из `data.model.json` + patch Secret
`openfga-model-id.current` + annotate Deployments для rolling-restart).

KAC-127 (deploy#38 fix): bootstrap-job больше НЕ делает runtime DSL→JSON
transform. Причина: `openfga/cli` image — distroless single-binary (нет
`/bin/sh`), `fga model transform` умеет писать только в stdout (нет `--output`),
поэтому init-container `dsl-transform` падал `exec: "/bin/sh": not found`.
Решение — pre-transform на build/commit-time: `data.model.json` ниже —
готовый OpenFGA-JSON, сгенерированный `fga model transform` из `data.model.fga`.
DSL frozen (design §4), drift невозможен; regenerate-команда — см.
`make openfga-model-json` (kacho-deploy/Makefile). Bootstrap-job читает
`model.json` напрямую и шлёт его `WriteAuthorizationModel`-эндпоинту;
`model.fga` остаётся для human-readable diff + sha256-idempotency.

Naming convention (запреты #2): все types — kacho.cloud.<domain>-style.
Conditions — CEL-syntax (OpenFGA 1.5+ stable feature, см. P3-D3).

ВНИМАНИЕ при edit'е:
  - НЕ редактировать DSL здесь напрямую. Канонический источник —
    `kacho-proto/proto/kacho/cloud/iam/v1/fga_model.fga`. После правки канона
    регенерировать оба блока: `make openfga-model-json`.
  - Любое изменение DSL → новый authorization_model_id (P3-D1: versioned +
    immutable). Bootstrap-job detect'ит sha256-diff DSL'а и пишет новую модель.
  - На rollback (helm rollback) FGA-engine retains old model_id (immutable, никогда
    не удаляет) → rollback просто пиннит Secret обратно. См. P3.GWT-04.

DataSource хранения id'а — Kubernetes Secret `openfga-model-id` (P3-D2):
  metadata.name        = openfga-model-id
  metadata.namespace   = {{ .Release.Namespace }}
  data.current         = <base64 model_id ULID>
  annotations:
    kacho-deploy/last-applied-dsl-sha256: <hex>
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.openfgaBootstrap.authorizationModelConfigMap }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: kacho
    kacho.cloud/component: openfga-bootstrap
    kacho.cloud/phase: "3"
    kacho.cloud/kac-ticket: KAC-127
  annotations:
    # Hash content of DSL — позволяет bootstrap-job-у быстро sha256-compare без
    # пересчёта на каждый запуск (idempotency fast-path).
    kacho.cloud/dsl-version: "v2"
data:
  model.fga: |-
    model
      schema 1.1

    # OpenFGA Authorization Model v2 — Kachō (Phase 3, KAC-127).
    #
    # This file is the **canonical source** of the authorization model. It is
    # bundled into kacho-proto so every consumer (kacho-iam, openfga-bootstrap-job,
    # admin-UI catalog) reads from the same artifact. Helm umbrella's
    # `openfga-model-stub-configmap.yaml` is generated from this file at
    # image-build time (acceptance §5.1) — `make openfga-model-json`.
    #
    # KAC-127 reconciliation: this file is the canonical superset of the deployed
    # model. It carries the full hierarchy cascade (`emergency_admin` break-glass,
    # `any_admin from cluster` reaching account/project, `group#member`-userset
    # subjects, `owner` on org/account) AND the per-domain resource types whose
    # `object_type` is referenced by the api-gateway permission catalog
    # (`vpc_network` / `compute_disk` / `iam_group` / ...).
    #
    # DSL conventions (acceptance §4):
    #   - `cluster:cluster_kacho_root`     — singleton enforced on write-side
    #     (P3-D17). One global cluster object.
    #   - `organization` / `account` / `project` — hierarchy parents
    #     (cluster ▶ organization ▶ account ▶ project ▶ <domain resource>).
    #   - per-domain object types — `vpc_network`, `vpc_subnet`, `vpc_address`,
    #     `vpc_security_group`, `vpc_route_table`, `vpc_gateway`,
    #     `vpc_private_endpoint`, `vpc_network_interface`, `vpc_address_pool`,
    #     `compute_instance`, `compute_disk`, `compute_image`, `compute_snapshot`,
    #     `compute_hypervisor`, `lb_network_load_balancer`, `lb_target_group`,
    #     `lb_listener` (KAC-178 §4 — Listener as first-class FGA object),
    #     `iam_role`, `iam_access_binding`, `iam_service_account`, `iam_group`,
    #     `iam_user`, `iam_condition`.
    #   - relations: `viewer` / `editor` / `admin` / `owner` / `member` per the
    #     YC-style roles vocabulary (KAC-121).
    #   - conditional relations: `with` clause names a Condition (built-in or
    #     custom) — FGA pre-compiles CEL on `WriteAuthorizationModel`.

    # ---------------------------------------------------------------------------
    # Generic principal / subject types.
    # ---------------------------------------------------------------------------

    type user

    type service_account

    type federated_subject

    # group — subject-grouping type. `group#member` usersets are accepted as
    # direct subjects on hierarchy + resource relations.
    type group
      relations
        define member: [user, service_account, federated_subject, group#member]

    # ---------------------------------------------------------------------------
    # Cluster — singleton "cluster_kacho_root". Write-side enforcement rejects
    # tuples with any other object id (P3-D17).
    #   - system_admin  — standing cluster administrator.
    #   - emergency_admin — break-glass (Phase 7); conditioned by `break_glass_window`
    #     so it auto-expires; grants the same reach as system_admin while active.
    #   - system_viewer — read-only cluster catalog viewer.
    #   - billing_admin — cluster-wide billing.
    #   - console       — cluster console access, MFA-gated.
    #   - any_admin     — convenience union (system_admin OR emergency_admin) that
    #     hierarchy types cascade from.
    # ---------------------------------------------------------------------------

    type cluster
      relations
        define system_admin: [user, service_account]
        define emergency_admin: [user with break_glass_window]
        define system_viewer: [user, service_account]
        define billing_admin: [user, service_account]
        define console: [user with mfa_fresh, service_account with mfa_fresh]
        define any_admin: system_admin or emergency_admin
        # KAC-178 §3: viewer — общий read-relation для глобальных reference-данных
        # (compute.Region, compute.Zone, …), к которым каталог permissions
        # привязан через scope_extractor {object_type: cluster, from_request_field: '*'}.
        # `user:*` userset делает справочные данные читаемыми ЛЮБЫМ authenticated
        # subject'ом (как и должно быть для tenant-facing reference-data). Также
        # включает system_viewer / any_admin transitively. До этого relation'а на
        # cluster не было `viewer` вообще → catalog `required_relation: "viewer"`
        # на cluster-scope'ed RPC всегда возвращал deny → UI dashboard падал.
        define viewer: [user, user:*, service_account] or system_viewer or any_admin
        # KAC-178 §gate: admin / editor aliases — catalog actions с verb=admin
        # (e.g. compute.zones.admin) / verb=create|update|delete маппятся через
        # iam.resolveActionToRelation на relation 'admin'/'editor'. Cluster type
        # раньше определял только system_admin/system_viewer/billing_admin/console
        # — admin/editor возвращал 'no path' для всех. Алиасы делают эти verbs
        # резолвящимися к фактическому system_admin/any_admin permission.
        define admin: system_admin or emergency_admin
        define editor: system_admin or emergency_admin

    # ---------------------------------------------------------------------------
    # Identity & hierarchy — organization → account → project.
    # ---------------------------------------------------------------------------

    type organization
      relations
        define cluster: [cluster]
        define owner: [user]
        define admin: [user, service_account, group#member] or any_admin from cluster or owner
        define billing_admin: [user, service_account] or admin or billing_admin from cluster
        define editor: [user, service_account, group#member] or admin
        define member: [user, service_account, group#member]
        define viewer: [user, service_account, group#member] or member or editor

    type account
      relations
        define cluster: [cluster]
        define organization: [organization]
        define owner: [user]
        define admin: [user, service_account, group#member] or any_admin from cluster or admin from organization or owner
        define editor: [user, service_account, group#member] or admin or editor from organization
        define viewer: [user, service_account, group#member] or editor or viewer from organization
        define billing_admin: [user, service_account] or admin or billing_admin from organization

    type project
      relations
        define account: [account]
        define admin: [user, service_account, group#member] or admin from account
        define editor: [user, service_account, group#member] or admin or editor from account
        define viewer: [user, service_account, group#member] or editor or viewer from account

    # ---------------------------------------------------------------------------
    # IAM resources. Group / ServiceAccount / Role / User are account-scoped
    # (their `parent` relation cascades from the owning Account); AccessBinding
    # / Condition are project-scoped (their `parent` cascades from the Project
    # the binding is attached to).
    # ---------------------------------------------------------------------------

    type iam_user
      relations
        define account: [account]
        define subject: [user]
        define admin: admin from account
        define editor: editor from account or admin
        define viewer: subject or editor or viewer from account

    type iam_service_account
      relations
        define account: [account]
        define admin: admin from account
        define editor: [user, service_account, group#member] or editor from account or admin
        define viewer: [user, service_account, group#member] or viewer from account or editor
        define user: [user, service_account] or editor
        define token_creator: [user, service_account] or admin

    type iam_group
      relations
        define account: [account]
        define member: [user, service_account]
        define admin: admin from account
        define editor: [user, service_account, group#member] or editor from account or admin
        define viewer: [user, service_account, group#member] or viewer from account or editor

    type iam_role
      relations
        define account: [account]
        define admin: admin from account
        define editor: editor from account or admin
        define viewer: viewer from account or editor

    type iam_access_binding
      relations
        define project: [project]
        define admin: admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor

    type iam_condition
      relations
        define project: [project]
        define admin: admin from project
        define editor: editor from project or admin
        define viewer: viewer from project or editor

    # ---------------------------------------------------------------------------
    # VPC domain.
    # ---------------------------------------------------------------------------

    type vpc_network
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor

    type vpc_subnet
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor
        define use: [user, service_account] or editor

    type vpc_security_group
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor

    type vpc_route_table
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor

    type vpc_address
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor
        define use: [user, service_account] or editor

    type vpc_gateway
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor

    type vpc_private_endpoint
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor

    type vpc_network_interface
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor

    type vpc_address_pool
      relations
        define cluster: [cluster]
        define admin: [user, service_account] or any_admin from cluster
        define viewer: [user, service_account] or admin or system_viewer from cluster

    # ---------------------------------------------------------------------------
    # Compute domain.
    # ---------------------------------------------------------------------------

    type compute_instance
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor
        define ssh: [user with mfa_fresh, service_account] or admin
        define console: [user with mfa_fresh] or admin

    type compute_disk
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor
        define use: [user, service_account] or editor

    type compute_image
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor
        define use: [user, service_account] or editor

    type compute_snapshot
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor

    type compute_hypervisor
      relations
        define cluster: [cluster]
        define admin: [user, service_account] or any_admin from cluster
        define viewer: [user, service_account] or admin or system_viewer from cluster

    # ---------------------------------------------------------------------------
    # Load-balancer domain.
    # ---------------------------------------------------------------------------

    type lb_network_load_balancer
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor

    type lb_target_group
      relations
        define project: [project]
        define admin: [user, service_account, group#member] or admin from project
        define editor: [user, service_account, group#member] or editor from project or admin
        define viewer: [user, service_account, group#member] or viewer from project or editor

    # KAC-178 §4: lb_listener — first-class FGA object для Listener (диверженция от
    # YC inline AddListener pattern — design §3.3). Hierarchy: listener inherits
    # permissions от parent load balancer (load_balancer relation), что даёт viewer
    # cascade: viewer@lb_network_load_balancer → viewer@lb_listener автоматически.
    # api-gateway permission_catalog.json keyed на этот type для Listener
    # Get/Update/Delete/ListOperations (PR PRO-Robotech/kacho-api-gateway#37).
    # Тот же tuple-shape что у lb_target_group, но через load_balancer вместо project
    # (Listener — child resource LB, не direct child project'а).
    type lb_listener
      relations
        define load_balancer: [lb_network_load_balancer]
        define admin: [user, service_account, group#member] or admin from load_balancer
        define editor: [user, service_account, group#member] or editor from load_balancer or admin
        define viewer: [user, service_account, group#member] or viewer from load_balancer or editor

    # ---------------------------------------------------------------------------
    # Conditions catalog — 7 frozen built-ins (acceptance §4.5).
    # ---------------------------------------------------------------------------

    condition mfa_fresh(amr_claims: list<string>, acr_value: string, current_time: timestamp, mfa_at: timestamp) {
      acr_value == "3" &&
      "webauthn" in amr_claims &&
      current_time - mfa_at < duration("15m")
    }

    condition non_expired(current_time: timestamp, valid_until: timestamp) {
      current_time < valid_until
    }

    condition source_ip_in_range(client_ip: ipaddress, allowed_cidrs: list<string>) {
      allowed_cidrs.exists(c, client_ip.in_cidr(c))
    }

    condition break_glass_window(current_time: timestamp, expires_at: timestamp) {
      current_time < expires_at
    }

    condition jit_window(current_time: timestamp, activated_at: timestamp, ttl_seconds: int) {
      current_time - activated_at < duration(string(ttl_seconds) + "s")
    }

    condition business_hours(current_time: timestamp, tz: string, start_h: int, end_h: int) {
      current_time.getHours(tz) >= start_h && current_time.getHours(tz) < end_h
    }

    condition device_compliant(device_attestation: string, allowed_attestations: list<string>) {
      device_attestation in allowed_attestations
    }

  # Pre-transformed OpenFGA-JSON. Generated from the canonical
  # kacho-proto fga_model.fga via `make openfga-model-json`. Do NOT edit
  # by hand — the bootstrap-job consumes this verbatim.
  model.json: |-
    {"schema_version":"1.1","type_definitions":[{"type":"user"},{"type":"service_account"},{"type":"federated_subject"},{"metadata":{"relations":{"member":{"directly_related_user_types":[{"type":"user"},{"type":"service_account"},{"type":"federated_subject"},{"relation":"member","type":"group"}]}}},"relations":{"member":{"this":{}}},"type":"group"},{"metadata":{"relations":{"admin":{},"any_admin":{},"billing_admin":{"directly_related_user_types":[{"type":"user"},{"type":"service_account"}]},"console":{"directly_related_user_types":[{"condition":"mfa_fresh","type":"user"},{"condition":"mfa_fresh","type":"service_account"}]},"editor":{},"emergency_admin":{"directly_related_user_types":[{"condition":"break_glass_window","type":"user"}]},"system_admin":{"directly_related_user_types":[{"type":"user"},{"type":"service_account"}]},"system_viewer":{"directly_related_user_types":[{"type":"user"},{"type":"service_account"}]},"viewer":{"directly_related_user_types":[{"type":"user"},{"type":"user","wildcard":{}},{"type":"service_account"}]}}},"relations":{"admin":{"union":{"child":[{"computedUserset":{"relation":"system_admin"}},{"computedUserset":{"relation":"emergency_admin"}}]}},"any_admin":{"union":{"child":[{"computedUserset":{"relation":"system_admin"}},{"computedUserset":{"relation":"emergency_admin"}}]}},"billing_admin":{"this":{}},"console":{"this":{}},"editor":{"union":{"child":[{"computedUserset":{"relation":"system_admin"}},{"computedUserset":{"relation":"emergency_admin"}}]}},"emergency_admin":{"this":{}},"system_admin":{"this":{}},"system_viewer":{"this":{}},"viewer":{"union":{"child":[{"this":{}},{"computedUserset":{"relation":"system_viewer"}},{"computedUserset":{"relation":"any_admin"}}]}}},"type":"cluster"},{"metadata":{"relations":{"admin":{"directly_related_user_types":[{"type":"user"},{"type":"service_account"},{"relation":"member","type":"group"}]},"billing_admin":{"directly_related_user_types":[{"type":"user"},{"type":"service_account"}]},"cluster":{"dire