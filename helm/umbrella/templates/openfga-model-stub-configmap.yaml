{{- if .Values.openfgaBootstrap.enabled }}
{{/*
KAC-105: stub authorization model для OpenFGA (минимум для bootstrap'а на E0).
E3 (epic KAC-108) заменит на полноценную DSL-модель из
`kacho-iam/internal/apps/kacho/api/access_binding/fga_model.fga`.

Здесь только тривиальный схема с типом `user` — этого хватает, чтобы создать
store + написать authorization-model + получить authorization_model_id.
Bootstrap-job ниже использует JSON-форму (proto-format), потому что DSL → JSON
требует отдельной toolchain (cli.openfga) — в curlimages/curl её нет.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.openfgaBootstrap.authorizationModelConfigMap }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
    kacho.cloud/component: openfga-bootstrap
data:
  model.json: |
    {
      "schema_version": "1.1",
      "type_definitions": [
        { "type": "user" }
      ]
    }
  bootstrap.sh: |
    #!/bin/sh
    # KAC-105: bootstrap OpenFGA store + authorization-model для kacho-iam.
    # Идемпотентно: повторный запуск не дублирует store / model.
    #
    # Шаги:
    # 1. Дождаться OpenFGA :8080/healthz (max 5 мин).
    # 2. GET /stores — если store с name=kacho-store существует, использовать его id.
    # 3. Иначе POST /stores {"name":"kacho-store"} → запомнить id.
    # 4. POST /stores/<id>/authorization-models (stub-model).
    # 5. Создать/обновить Secret kacho-iam-openfga-store со store_id.
    #
    # Зависимости: curl, jq, kubectl. Образ — curlimages/curl + апгрейд jq/kubectl
    # ставится через apk inline (curlimages/curl построен на alpine).
    set -eu

    OPENFGA_URL="${OPENFGA_URL:-http://kacho-umbrella-openfga:8080}"
    STORE_NAME="${STORE_NAME:-kacho-store}"
    SECRET_NAME="${SECRET_NAME:-kacho-iam-openfga-store}"
    NAMESPACE="${NAMESPACE:-kacho}"

    echo "[bootstrap] устанавливаем jq+kubectl (alpine)…"
    apk add --no-cache jq kubectl >/dev/null

    echo "[bootstrap] ждём OpenFGA $OPENFGA_URL/healthz (max 5 мин)…"
    for i in $(seq 1 60); do
      if curl -sf "$OPENFGA_URL/healthz" >/dev/null 2>&1; then
        echo "[bootstrap] OpenFGA готов"
        break
      fi
      sleep 5
      if [ "$i" -eq 60 ]; then
        echo "[bootstrap] TIMEOUT: OpenFGA не отвечает"
        exit 1
      fi
    done

    echo "[bootstrap] ищем существующий store '$STORE_NAME'…"
    STORE_ID=$(curl -sf "$OPENFGA_URL/stores" | jq -r --arg n "$STORE_NAME" '.stores[]? | select(.name==$n) | .id' || true)

    if [ -z "$STORE_ID" ]; then
      echo "[bootstrap] store не найден — создаём"
      STORE_ID=$(curl -sf -XPOST "$OPENFGA_URL/stores" \
        -H 'content-type: application/json' \
        -d "{\"name\":\"$STORE_NAME\"}" | jq -r '.id')
      echo "[bootstrap] создан store id=$STORE_ID"
    else
      echo "[bootstrap] переиспользуем существующий store id=$STORE_ID"
    fi

    echo "[bootstrap] загружаем authorization-model (stub)…"
    MODEL_ID=$(curl -sf -XPOST "$OPENFGA_URL/stores/$STORE_ID/authorization-models" \
      -H 'content-type: application/json' \
      -d @/etc/openfga-model/model.json | jq -r '.authorization_model_id')
    echo "[bootstrap] authorization_model_id=$MODEL_ID"

    echo "[bootstrap] записываем store_id в Secret $NAMESPACE/$SECRET_NAME…"
    kubectl -n "$NAMESPACE" create secret generic "$SECRET_NAME" \
      --from-literal=store_id="$STORE_ID" \
      --from-literal=authorization_model_id="$MODEL_ID" \
      --dry-run=client -o yaml | kubectl apply -f -

    echo "[bootstrap] OK"
{{- end }}
