{{/*
KAC-105: Zitadel требует 32-байтный masterkey. На prod — managed (vault / Sealed-Secret).
На dev — статичный, создаётся как ОБЫЧНЫЙ Secret (не helm hook, чтобы быть доступным
для Zitadel-podов в pre-install momentе через ResourcePolicy keep-on-delete).
masterkey-значение — 32 байта в base64: `MasterkeyForKachoIAMDevStackXYZ=` (32 chars).
ВНИМАНИЕ: это dev-stand only. На prod заменить через external-secrets / SealedSecret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-masterkey
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
    kacho.cloud/component: zitadel
type: Opaque
stringData:
  # ровно 32 символа — Zitadel валидирует длину при старте
  masterkey: "MasterkeyForKachoIAMDevStackXYZ="
