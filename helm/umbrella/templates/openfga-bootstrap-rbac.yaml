{{- if .Values.openfgaBootstrap.enabled }}
{{/*
KAC-105: ServiceAccount + Role + RoleBinding для openfga-bootstrap-job.
Нужны права:
  - create/get/update secret kacho-iam-openfga-store (записать store_id).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openfga-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
    kacho.cloud/component: openfga-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openfga-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
    kacho.cloud/component: openfga-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openfga-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
    kacho.cloud/component: openfga-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openfga-bootstrap
subjects:
  - kind: ServiceAccount
    name: openfga-bootstrap
    namespace: {{ .Release.Namespace }}
{{- end }}
