{{- /*
  KAC-127 Phase 11 — Sealed-Secrets controller for GitOps-safe secrets.
  Allows committing encrypted secrets directly to git repo — only the
  cluster's private key can decrypt. Enable with `sealedSecrets.enabled: true`.
*/}}
{{- if .Values.sealedSecrets.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: "sealed-secrets-system"
  labels:
    kacho.cloud/component: sealed-secrets
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "sealed-secrets-controller"
  namespace: "sealed-secrets-system"
  labels:
    kacho.cloud/component: sealed-secrets
    app.kubernetes.io/name: sealed-secrets-controller
    app.kubernetes.io/part-of: kacho-iam-platform
spec:
  replicas: {{ .Values.sealedSecrets.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sealed-secrets-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sealed-secrets-controller
        app.kubernetes.io/part-of: kacho-iam-platform
    spec:
      serviceAccountName: "sealed-secrets-controller"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: sealed-secrets-controller
              topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: "DoNotSchedule"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sealed-secrets-controller
      containers:
        - name: controller
          image: {{ .Values.sealedSecrets.image | default "docker.io/bitnami/sealed-secrets-controller:0.27.0" | quote }}
          args:
            - "--update-status"
            - "--key-renew-period={{ .Values.sealedSecrets.keyRenewPeriod | default "720h" }}"   # 30d
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "sealed-secrets-controller"
  namespace: "sealed-secrets-system"
{{- end }}
