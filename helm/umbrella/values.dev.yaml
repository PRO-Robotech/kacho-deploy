ingress-nginx:
  controller:
    # Standard kind+ingress-nginx pattern: hostPort на kind-ноде,
    # extraPortMappings в kind-config мапит хост:80 → нода:80.
    hostPort:
      enabled: true
      ports:
        http: 80
        https: 443
    service:
      type: ClusterIP
    nodeSelector:
      ingress-ready: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        effect: NoSchedule
    # На single-node kind кластере с одним replica — без anti-affinity
    affinity: {}
    publishService:
      enabled: false
    extraArgs:
      publish-status-address: localhost

pg-resource-manager:
  auth:
    username: resource_manager
    password: dev-resource-manager-password
    database: kacho_resource_manager
  primary:
    persistence:
      enabled: false
  image:
    repository: bitnamilegacy/postgresql   # Bitnami переехал; legacy registry имеет нужные теги
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell   # → emptyDir в Bitnami chart

