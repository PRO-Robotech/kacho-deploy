# Ory Kratos self-service UI (login/registration/recovery/verification/settings).
# Образ oryd/kratos-selfservice-ui-node. UI nginx проксирует /login,/registration,
# /recovery,/verification,/settings,/error → этот pod на :3000.
kratosSelfServiceUI:
  enabled: false
  image:
    repository: oryd/kratos-selfservice-ui-node
    tag: "v1.3.1"
  kratosBrowserUrl: "http://5.35.93.58/.ory/kratos/public"
  kratosPublicUrl: "http://kacho-umbrella-kratos-public:80"
  hydraAdminUrl: "http://kacho-umbrella-hydra-admin:4445"
  cookieSecret: "please-change-this-32-bytes-A1Bx"

zitadelOidcBootstrap:
  enabled: false
  appName: "kacho-console"
  projectName: "kacho-console"
  redirectUri: "http://localhost/iam/v1/auth/callback"  # override в cluster overrides
  clientSecretName: "kacho-iam-oidc-client"
  zitadelInternal: "http://kacho-umbrella-zitadel.kacho.svc.cluster.local:8080"
  machineSaSecretName: "zitadel-admin-sa"
  machineSaKeyFile: "zitadel-admin-sa.json"
  # Admin human user — создаётся через Admin API с isEmailVerified=true и
  # passwordChangeRequired=false (без SMTP не получим verification codes).
  adminEmail: "admin@kacho.local"
  adminPassword: "Admin1234!"
  image:
    repository: python
    tag: "3.12-slim"

  # KAC-107 — chicken-and-egg fix: Zitadel chart по умолчанию рендерит
  # `zitadel-init` / `zitadel-setup` как Helm `pre-install,pre-upgrade` hooks
  # (см. zitadel/templates/{init,setup}job.yaml + defaults в `setupJob.annotations`).
  # Pre-install hook'и выполняются ДО основной фазы install, а зависимый
  # `pg-zitadel` StatefulSet (Bitnami postgresql sub-chart, не hook) создаётся
  # уже в основной фазе → init/setup Job пытаются открыть TCP-connect к
  # `kacho-umbrella-pg-zitadel:5432`, DNS не резолвится, backoffLimit=5
  # исчерпывается → `BackoffLimitExceeded` → helm upgrade fail.
  #
  # Fix (двухсоставной — Makefile + values):
  #   1. **Two-stage install в Makefile** (см. `dev-up` target): stage 1
  #      устанавливает только pg-zitadel (`--set zitadel.enabled=false`),
  #      ждёт `kubectl wait sts/...-pg-zitadel`, stage 2 включает zitadel
  #      (`--set zitadel.enabled=true`) — pre-install hook'и теперь стартуют
  #      ПОСЛЕ того как pg-Service+Endpoints существуют.
  #      Через values.yaml (`annotations: ~`/`{}`) hook-метки убрать **нельзя**
  #      — Helm v3 deep-merge отбрасывает null/empty overlay, оставляя
  #      chart-default (helm/helm#9136). `--set ...=null` через CLI работал бы,
  #      но прятать критичную семантику в командной строке — хуже, чем
  #      явный two-stage в Makefile.
  #   2. **`wait-for-pg` init-container** ниже — safety-net на случай flap'а
  #      pg-Service между stage 1 и stage 2 или ручного helm-upgrade без
  #      Makefile. Init-container крутит `nc -z` loop до 600s.
  initJob:
    enabled: true
    backoffLimit: 5
    activeDeadlineSeconds: 600
    initContainers:
      - name: wait-for-pg
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            set -e
            echo "[wait-for-pg] waiting for kacho-umbrella-pg-zitadel:5432..."
            until nc -z kacho-umbrella-pg-zitadel 5432; do
              echo "[wait-for-pg] not ready, sleep 2s"
              sleep 2
            done
            echo "[wait-for-pg] pg-zitadel reachable, proceeding"
  setupJob:
    backoffLimit: 5
    activeDeadlineSeconds: 600
    additionalArgs:
      - "--init-projections=true"
    initContainers:
      - name: wait-for-pg
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            set -e
            echo "[wait-for-pg] waiting for kacho-umbrella-pg-zitadel:5432..."
            until nc -z kacho-umbrella-pg-zitadel 5432; do
              echo "[wait-for-pg] not ready, sleep 2s"
              sleep 2
            done
            echo "[wait-for-pg] pg-zitadel reachable, proceeding"

# OpenFGA — REBAC engine для kacho-iam.
# В dev — playground enabled (доступен на openfga.kacho.local через ingress).
# store-id создаётся bootstrap-job'ом (templates/openfga-bootstrap-job.yaml).
openfga:
  datastore:
    engine: postgres
    uri: postgres://openfga:dev-openfga-password@kacho-umbrella-pg-openfga:5432/openfga?sslmode=disable
  service:
    type: ClusterIP
    grpc:
      port: 8081
    http:
      port: 8080
  playground:
    enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: openfga.kacho.local
        paths:
          - path: /
            pathType: Prefix
            backend:
              port: http

# kacho-iam — control-plane сервис IAM (Account / Project / User / ServiceAccount /
# Group / Role / AccessBinding). E0 — skeleton + CRUD; интеграция с Zitadel/OpenFGA — E2/E3.
kacho-iam:
  name: kacho-iam
  replicas: 1
  image:
    repository: kacho-iam
    tag: dev
    pullPolicy: IfNotPresent
  ports:
    grpc: 9090
    internalGrpc: 9091
  service:
    public:
      type: ClusterIP
      port: 9090
    internal:
      type: ClusterIP
      port: 9091
  db:
    host: kacho-umbrella-pg-iam
    port: "5432"
    user: iam
    name: kacho_iam
    passwordSecretName: kacho-umbrella-pg-iam
    passwordSecretKey: password
  config:
    logger:
      level: INFO
    apiServer:
      gracefulShutdown: 10s
    metrics:
      enable: true
    healthcheck:
      enable: true
    repository:
      postgres:
        maxConns: 100
        sslMode: disable
    authn:
      mode: dev
    extapi:
      zitadel:
        endpoint: http://zitadel:8080
        issuer: http://zitadel.kacho.local
      openfga:
        endpoint: openfga:8081
        # store-id заполняется bootstrap-job'ом в Secret kacho-iam-openfga-store
        storeIdSecretName: kacho-iam-openfga-store
        storeIdSecretKey: store_id
  initContainer:
    migrator:
      enabled: true
      command: ["/usr/local/bin/kacho-migrator", "up"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  env: {}

# ─── KAC-105: OpenFGA bootstrap-job ─────────────────────────────────────
# post-install hook, который (1) ждёт OpenFGA готовности, (2) создаёт store
# `kacho-store` (idempotent), (3) загружает authorization-model (заглушка
# на E0; E3 заменит на полноценную DSL-модель), (4) пишет store_id в
# Secret kacho-iam-openfga-store (kacho-iam читает на старте).
openfgaBootstrap:
  enabled: true
  image: curlimages/curl:8.5.0
  storeName: kacho-store
  authorizationModelConfigMap: openfga-model-stub

