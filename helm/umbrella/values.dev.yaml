# yc CLI compatibility shim (kacho-yc-shim repo) — advertised endpoint that
# yc CLI dials AFTER calling ApiEndpointService.List for service discovery.
# In dev we use localhost:18443 because that is the port-forward to ingress-nginx
# (kubectl -n kacho port-forward svc/kacho-umbrella-ingress-nginx-controller 18443:443).
# In production the value would be api.kacho.local:443.
api-gateway:
  advertisedEndpoint: localhost:18443

ingress-nginx:
  controller:
    # Standard kind+ingress-nginx pattern: hostPort на kind-ноде,
    # extraPortMappings в kind-config мапит хост:80 → нода:80.
    hostPort:
      enabled: true
      ports:
        http: 80
        https: 443
    service:
      type: ClusterIP
    nodeSelector:
      ingress-ready: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        effect: NoSchedule
    # На single-node kind кластере с одним replica — без anti-affinity
    affinity: {}
    publishService:
      enabled: false
    extraArgs:
      publish-status-address: localhost

pg-resource-manager:
  auth:
    username: resource_manager
    password: dev-resource-manager-password
    database: kacho_resource_manager
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 300
      shared_buffers = 256MB
      work_mem = 16MB
      effective_cache_size = 1GB
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell   # → emptyDir в Bitnami chart

pg-vpc:
  auth:
    username: vpc
    password: dev-vpc-password
    database: kacho_vpc
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 4000m
        memory: 4Gi
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 300
      shared_buffers = 512MB
      work_mem = 16MB
      effective_cache_size = 2GB
      checkpoint_timeout = 15min
      max_wal_size = 2GB
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell


pg-compute:
  auth:
    username: compute
    password: dev-compute-password
    database: kacho_compute
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 300
      shared_buffers = 256MB
      work_mem = 16MB
      effective_cache_size = 1GB
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell


# kacho-vpc — admin networkpolicy для :9091.
# В dev-стенде disabled (port-forward kachoctl-ipam должен работать).
# В prod values эту секцию переопределить enabled=true + adminPodsSelector.
vpc:
  networkPolicy:
    enabled: false
    adminPodsSelector: {}

# ─── KAC-105: IAM stack (sub-phase 2.0) ─────────────────────────────────
# Три отдельные Postgres-инстанса (запрет #8: database-per-service):
#   pg-iam      → kacho-iam (схема kacho_iam)
#   pg-zitadel  → Zitadel internal state
#   pg-openfga  → OpenFGA tuple-store
# Все три в dev — emptyDir (без persistence), небольшие resource-лимиты.

pg-iam:
  auth:
    username: iam
    password: dev-iam-password
    database: kacho_iam
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 200
      shared_buffers = 128MB
      work_mem = 8MB
      effective_cache_size = 512MB
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

pg-zitadel:
  auth:
    username: zitadel
    password: dev-zitadel-password
    database: zitadel
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

pg-openfga:
  auth:
    username: openfga
    password: dev-openfga-password
    database: openfga
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

# Zitadel — OIDC issuer для kacho-iam.
# Dev-конфиг: TLS отключён, ExternalDomain=zitadel.kacho.local (нужна запись в /etc/hosts).
# masterkey должен быть ровно 32 символа; в dev — статичный (создаётся отдельным Secret-манифестом
# kacho-iam-zitadel-masterkey в charts/kacho-iam/templates/ либо вручную).
zitadel:
  zitadel:
    masterkeySecretName: zitadel-masterkey
    configmapConfig:
      ExternalDomain: zitadel.kacho.local
      ExternalSecure: false
      ExternalPort: 80
      TLS:
        Enabled: false
      Database:
        Postgres:
          Host: kacho-umbrella-pg-zitadel
          Port: 5432
          Database: zitadel
          MaxOpenConns: 20
          MaxIdleConns: 10
          MaxConnLifetime: 30m
          MaxConnIdleTime: 5m
          User:
            Username: zitadel
            Password: dev-zitadel-password
            SSL:
              Mode: disable
          Admin:
            Username: zitadel
            Password: dev-zitadel-password
            SSL:
              Mode: disable
      # Machine user (service account) — Zitadel setup-Job создаст SA + private key,
      # положит в /machinekey/sa.json; sidecar machinekey-writer затем создаст
      # k8s Secret `zitadel-admin-sa` (имя == Username). Используется post-install
      # Job zitadel-oidc-bootstrap для создания OIDC app `kacho-console` через
      # jwt-bearer grant.
      FirstInstance:
        Org:
          Machine:
            Machine:
              Username: zitadel-admin-sa
              Name: "Zitadel Admin SA"
            MachineKey:
              Type: 1  # JSON enum (PEM RSA + metadata)
              ExpirationDate: "2030-01-01T00:00:00Z"
  # machinekey-writer sidecar — bitnami/kubectl. Default registry depreced
  # (Bitnami переехал на bitnamilegacy/). На e2c825 без этого override
  # sidecar падает с ErrImagePull → setup-Job DeadlineExceeded.
  setupJob:
    machinekeyWriter:
      image:
        # `bitnami/kubectl` resolves tag из k8s version (1.35) — но такого tag нет
        # ни в bitnami, ни в bitnamilegacy. Используем alpine/k8s — multi-arch
        # альтернатива с фиксированным tag-номером.
        repository: alpine/k8s
        tag: "1.30.0"
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: zitadel.kacho.local
        paths:
          - path: /
            pathType: Prefix

# OIDC application bootstrap — post-install Job через Zitadel Management API.
# Создаёт OIDC app `kacho-console` + пишет client_id в Secret `kacho-iam-oidc-client`.
# api-gateway читает client_id из этого Secret через valueFrom.secretKeyRef.
# MailHog — SMTP catch-all (UI на :8025). Включается per-cluster в overrides.
mailhog:
  enabled: false
  image:
    repository: mailhog/mailhog
    tag: "v1.0.1"

# KAC-115: Ory stack — Kratos (identity) + Hydra (OIDC) + Keto (REBAC).
# Включаются вместо Zitadel+OpenFGA через overrides.yaml.

pg-kratos:
