# yc CLI compatibility shim (kacho-yc-shim repo) — advertised endpoint that
# yc CLI dials AFTER calling ApiEndpointService.List for service discovery.
# In dev we use localhost:18443 because that is the port-forward to ingress-nginx
# (kubectl -n kacho port-forward svc/kacho-umbrella-ingress-nginx-controller 18443:443).
# In production the value would be api.kacho.local:443.
# KAC-127 — dev-стенд (kind) использует локально-загруженные образы `:dev`
# (`kind load docker-image kacho-*:dev`), а не DockerHub. pullPolicy IfNotPresent —
# образ уже в node-кэше kind. Чтобы тянуть из DockerHub в dev — убрать эти
# override'ы (вернётся registry/tag из values.yaml).

# KAC-127 — обнуляем global.imageRegistry для dev. В values.yaml он =
# `docker.io/prorobotech` (DockerHub-namespace для kacho-* образов). Но
# third-party sub-chart'ы (Ory kratos/hydra/keto, OpenFGA, bitnami postgresql)
# тоже уважают `global.imageRegistry` и подставляют его перед СВОИМ image →
# получается несуществующий `docker.io/prorobotech/oryd/hydra`. На dev-стенде
# kacho-* образы и так заданы явной строкой `image: kacho-*:dev` (flat-string,
# global.imageRegistry не используется этими sub-chart'ами), поэтому обнуление
# global безопасно для kacho-сервисов и чинит pull third-party образов
# (Ory → docker.io/oryd/*, OpenFGA → docker.io/openfga/*).
global:
  imageRegistry: ""

api-gateway:
  advertisedEndpoint: localhost:18443
  image: kacho-api-gateway:dev
  imagePullPolicy: IfNotPresent
  # KAC-127 (#40): dev-mode auth-interceptor HS256 secret. Without it every
  # Bearer JWT is ignored and all principals collapse to system:bootstrap —
  # anonymous / bootstrap / per-user tokens become indistinguishable, which
  # makes the authz-deny matrix untestable.
  #
  # Dev-ONLY secret. Production (values.prod.yaml) uses authn.mode=production
  # with Hydra JWKS RS256 and never this value — committing it here is safe
  # (this is the kind dev stand, not prod). MUST stay in sync with the secret
  # the authz-fixtures JWT minter signs with
  # (tests/authz-fixtures/setup.sh DEV_SECRET default).
  authn:
    mode: dev
    devSecret: kacho-dev-jwt-secret-2026
  # KAC-127: Phase 3 per-RPC authz middleware — ENABLED.
  #
  # The two structural blockers that previously forced `enabled: false` are
  # resolved (kacho-api-gateway#20):
  #   * Problem 1 — `RestRouter` is now wired (NewRestRouter, route table
  #     generated from the proto `google.api.http` annotations); REST paths
  #     resolve to gRPC FQNs so catalog lookups succeed.
  #   * Problem 2 — the permission catalog is fully populated (264/264 RPCs
  #     annotated in kacho-proto; the warnings file is empty).
  #
  # failOpen=false (fail-closed); iamAuthorizeUrl unset → derived from the
  # `iam` backend (public 9090); AuthorizeService.Check is the public RPC,
  # not routed through internal :9091 (loop-prevention #6).
  authz:
    enabled: true
    failOpen: false

compute:
  image: kacho-compute:dev
  imagePullPolicy: IfNotPresent

ui:
  image: kacho-ui:dev
  imagePullPolicy: IfNotPresent
  # Лок-стенд: ingress на host `localhost` (kind host-port 28080) — UI открывается
  # http://localhost:28080 без записи в /etc/hosts. Kratos/Hydra urls — туда же.
  ingress:
    host: localhost

ingress-nginx:
  controller:
    # Standard kind+ingress-nginx pattern: hostPort на kind-ноде,
    # extraPortMappings в kind-config мапит хост:80 → нода:80.
    hostPort:
      enabled: true
      ports:
        http: 80
        https: 443
    service:
      type: ClusterIP
    nodeSelector:
      ingress-ready: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        effect: NoSchedule
    # На single-node kind кластере с одним replica — без anti-affinity
    affinity: {}
    publishService:
      enabled: false
    extraArgs:
      publish-status-address: localhost

# KAC-124: pg-resource-manager values удалён — Postgres-инстанс упразднён вместе с backend'ом.

pg-vpc:
  auth:
    username: vpc
    password: dev-vpc-password
    database: kacho_vpc
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 4000m
        memory: 4Gi
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 300
      shared_buffers = 512MB
      work_mem = 16MB
      effective_cache_size = 2GB
      checkpoint_timeout = 15min
      max_wal_size = 2GB
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell


pg-compute:
  auth:
    username: compute
    password: dev-compute-password
    database: kacho_compute
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 300
      shared_buffers = 256MB
      work_mem = 16MB
      effective_cache_size = 1GB
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell


# kacho-vpc — admin networkpolicy для :9091.
# В dev-стенде disabled (port-forward kachoctl-ipam должен работать).
# В prod values эту секцию переопределить enabled=true + adminPodsSelector.
vpc:
  # KAC-127 — local kind-loaded image (см. комментарий у api-gateway выше).
  image: kacho-vpc:dev
  imagePullPolicy: IfNotPresent
  networkPolicy:
    enabled: false
    adminPodsSelector: {}
  # KAC-127 issue #22: write-side FGA. Each VPC resource Create publishes
  # `vpc_<resource>:<id>#project@project:<project_id>` into the shared OpenFGA
  # store so per-resource Get/Update/Delete Checks resolve. store-id / model-id
  # are bootstrap-job-populated Secrets, injected as config ENV-override.
  authz:
    # KAC-127 Phase 4 — FGA-filtered List: List RPCs return 200 with only the
    # caller-visible ids instead of a per-RPC 403. Required for the authz
    # matrix *-LS-*-EMPTY scope-filter cases.
    listFilter:
      enabled: true
      authorizeEndpoint: kacho-iam.kacho.svc.cluster.local:9090
    tupleWrite:
      enabled: true
      # OpenFGA HTTP API (http port 8080; grpc is 8081). Same store kacho-iam
      # writes its account/project tuples into.
      openfgaEndpoint: kacho-umbrella-openfga:8080
      storeIdSecretName: kacho-iam-openfga-store
      storeIdSecretKey: store_id
      modelIdSecretName: openfga-model-id
      modelIdSecretKey: current
      timeoutMs: 2000

# ─── KAC-105: IAM stack (sub-phase 2.0) ─────────────────────────────────
# Отдельные Postgres-инстансы (запрет #8: database-per-service):
#   pg-iam      → kacho-iam (схема kacho_iam)
#   pg-openfga  → OpenFGA tuple-store (Phase 3)
# В dev — emptyDir (без persistence), небольшие resource-лимиты.
# KAC-127: pg-zitadel удалён — auth-tier (identity/OIDC) на Ory (Kratos/Hydra).

pg-iam:
  auth:
    username: iam
    password: dev-iam-password
    database: kacho_iam
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 200
      shared_buffers = 128MB
      work_mem = 8MB
      effective_cache_size = 512MB
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

pg-openfga:
  # KAC-127: backing Postgres для OpenFGA tuple-store — включён вместе с openfga.
  enabled: true
  auth:
    username: openfga
    password: dev-openfga-password
    database: openfga
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

# KAC-127: Zitadel chart + конфиг удалены — auth-tier (identity/OIDC) на Ory
# Kratos + Hydra. OIDC issuer для kacho-iam теперь Hydra.

# MailHog — SMTP catch-all (UI на :8025). Включается per-cluster в overrides.
mailhog:
  enabled: false
  image:
    repository: mailhog/mailhog
    tag: "v1.0.1"

# KAC-115: Ory stack — Kratos (identity) + Hydra (OIDC) + Keto (REBAC).
# Включаются вместо Zitadel+OpenFGA через overrides.yaml.

pg-kratos:
  # KAC-127: backing Postgres для Kratos — включён вместе с kratos.
  enabled: true
  global: { security: { allowInsecureImages: true } }
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "16.4.0-debian-12-r0"
  auth:
    username: kratos
    password: dev-kratos-password
    database: kratos
  primary:
    persistence: { enabled: false }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 1, memory: 1Gi }

pg-hydra:
  # KAC-127: backing Postgres для Hydra — включён вместе с hydra.
  enabled: true
  global: { security: { allowInsecureImages: true } }
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "16.4.0-debian-12-r0"
  auth:
    username: hydra
    password: dev-hydra-password
    database: hydra
  primary:
    persistence: { enabled: false }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 1, memory: 1Gi }

pg-keto:
  enabled: false
  global: { security: { allowInsecureImages: true } }
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "16.4.0-debian-12-r0"
  auth:
    username: keto
    password: dev-keto-password
    database: keto
  primary:
    persistence: { enabled: false }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 1, memory: 1Gi }

kratos:
  # KAC-127: Phase 2 IAM-стек требует Kratos (identity) включённым для smoke.
  enabled: true
  kratos:
    development: true
    automigration:
      enabled: true
      # KAC-127: type=initContainer вместо дефолтного `job`. Ory-чарт по дефолту
      # вешает на migration-Job pre-install hook (job.annotations в values чарта) →
      # Job стартует ДО pg-kratos (обычный release-ресурс) → DNS-резолв
      # `kacho-umbrella-pg-kratos` фейлится навсегда → hook не завершается →
      # `helm --wait` блокируется → release failed. initContainer-режим исполняет
      # миграцию как init-container Kratos-пода — отдельного hook-Job нет.
      type: initContainer
    config:
      dsn: "postgres://kratos:dev-kratos-password@kacho-umbrella-pg-kratos:5432/kratos?sslmode=disable"
      serve:
        public:
          base_url: "http://localhost:28080/.ory/kratos/public/"
          cors:
            enabled: true
            allowed_origins: ["http://localhost:28080"]
        admin:
          base_url: "http://kacho-umbrella-kratos-admin:80/"
      selfservice:
        default_browser_return_url: "http://localhost:28080/"
        allowed_return_urls: ["http://localhost:28080"]
        methods:
          password: { enabled: true }
          oidc: { enabled: false }
          totp: { enabled: false }
        flows:
          registration:
            enabled: true
            ui_url: "http://localhost:28080/registration"
            after:
              password: { hooks: [{ hook: "session" }] }
          login:
            ui_url: "http://localhost:28080/login"
          settings:
            ui_url: "http://localhost:28080/settings"
          recovery:
            enabled: true
            ui_url: "http://localhost:28080/recovery"
          verification:
            enabled: false
          error:
            ui_url: "http://localhost:28080/error"
      log:
        level: info
        format: json
      secrets:
        cookie: ["please-change-this-32-bytes-A1Bx"]
        cipher: ["please-change-this-32-bytes-A1Bx"]
      session:
        lifespan: "24h"
      identity:
        default_schema_id: default
        schemas:
          # Inline schema через base64 — не зависим от extra ConfigMap.
          - id: default
            url: "base64:"
      courier:
        smtp:
          connection_uri: "smtp://mailhog.kacho.svc.cluster.local:1025/?disable_starttls=true"
          from_address: "noreply@kacho.local"
          from_name: "Kacho"
  identitySchemas:
    "identity.default.schema.json": |
      {
        "$id": "https://schemas.kacho.local/identity/v1.0.0/default.json",
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Person",
        "type": "object",
        "properties": {
          "traits": {
            "type": "object",
            "properties": {
              "email": {
                "type": "string", "format": "email",
                "title": "E-Mail",
                "ory.sh/kratos": {
                  "credentials": { "password": { "identifier": true } },
                  "recovery": { "via": "email" },
                  "verification": { "via": "email" }
                }
              },
              "name": {
                "type": "object",
                "properties": {
                  "first": { "type": "string", "title": "First Name" },
                  "last":  { "type": "string", "title": "Last Name" }
                }
              }
            },
            "required": ["email"],
            "additionalProperties": false
          }
        }
      }

# KAC-127 Phase 2 — Hydra OAuth 2.1 + DPoP + mTLS-bound + JWT-strategy.
# Acceptance §5.2: refresh rotation (force-rotate, 1s race window), PKCE mandatory,
# Implicit + ROPC grants disabled, TTLs (access 15min / refresh 30d / id 15min / auth_code 1min),
# JWT signing (RS256 / ES256 / EdDSA), token_hook + refresh_hook → kacho-iam :9091.
#
# Dev-стенд (kind, kacho.local) — `enabled: false` по умолчанию; включается через
# overrides.yaml в clusters/<cluster>/. URLs используют intentional dev-IP
# (localhost:28080 — kind ingress, host-port 28080). Prod-overlay переопределит
# все `urls.*` через `{{ .Values.kacho.domain }}` — см. values.prod.yaml.
hydra:
  # KAC-127: Phase 2 IAM-стек требует Hydra (OAuth2/OIDC) включённым для smoke.
  enabled: true
  hydra:
    automigration:
      enabled: true
      # KAC-127: type=initContainer вместо `job` — устраняет pre-install hook
      # deadlock (migration-Job дефолтно hook'нут pre-install, стартует до
      # pg-hydra → DNS-резолв фейлится → `helm --wait` блокируется). См.
      # аналогичный комментарий у kratos.automigration выше.
      type: initContainer
    dev: true
    config:
      dsn: "postgres://hydra:dev-hydra-password@kacho-umbrella-pg-hydra:5432/hydra?sslmode=disable"
      serve:
        public:
          cors:
            enabled: true
            allowed_origins: ["http://localhost:28080"]
      urls:
        # Dev URLs — kacho-deploy историчный IP (kind ingress port-forward).
        # В prod values.prod.yaml override'ит через `https://hydra.{{ .Values.kacho.domain }}`.
        self:
          public: "http://localhost:28080/.ory/hydra/public/"
          issuer: "http://localhost:28080/.ory/hydra/public/"
        consent: "http://localhost:28080/consent"
        login: "http://localhost:28080/login"
        logout: "http://localhost:28080/logout"
        error: "http://localhost:28080/error"
        post_logout_redirect: "http://localhost:28080/"
        # KAC-127 (deploy#37): `urls.identity_provider.publicly_writable` удалён —
        # ключ не существует в Hydra v26.2.0 config-schema (`urls.identity_provider`
        # принимает только `url` / `publicUrl` / `headers`). Динамическая
        # OAuth2-client-регистрация и так выключена by-default; Hydra-admin
        # `/clients` endpoint остаётся cluster-internal через Service-разделение.
      secrets:
        system: ["please-change-this-32-bytes-A1Bx"]
      # ─── OAuth 2.1 / DPoP / mTLS-bound / JWT strategy (acceptance §5.2) ──
      strategies:
        # Self-contained JWT access tokens (allows api-gateway локальную validation
        # без trip-к-Hydra introspect — acceptance §2.3 token shape).
        access_token: jwt
        jwt:
          scope_claim: list
      ttl:
        # Acceptance §5.2 — TTL discipline.
        access_token: 15m
        refresh_token: 720h        # 30 days
        id_token: 15m
        auth_code: 1m
      oauth2:
        expose_internal_errors: true
        # OAuth 2.1 §6.1 — PKCE mandatory + refresh-token rotation с reuse-detection
        # → family-revoke (acceptance §2.9).
        pkce:
          enforced: true
          enforced_for_public_clients: true
        # KAC-127 (deploy#37): `grant` в Hydra v26.2.0 принимает только `jwt`
        # и `refresh_token`. Старый `grant.authorization_code.{require_pkce,ttl}`
        # удалён — PKCE-enforcement задаётся через `oauth2.pkce.*` выше,
        # auth_code-TTL — через `ttl.auth_code` (1m, см. блок ttl выше).
        grant:
          jwt:
            iat_optional: false
            jti_optional: false
            max_ttl: 720h
          # Refresh-token rotation (OAuth 2.1 §6.1) — в v26.2.0 rotation ВСЕГДА
          # включён (старый toggle `oauth2.refresh_token_rotation` упразднён);
          # настраивается только grace-window. `rotation_grace_period: 1s` —
          # concurrent legit refresh (две вкладки); reuse вне grace → family-revoke.
          # Старые `oauth2.refresh_token_rotation` /
          # `refresh_token_rotation_grace_period` /
          # `refresh_token_grant_skip_token_binding_validation` удалены —
          # их нет в v26.2.0 schema.
          refresh_token:
            rotation_grace_period: 1s
        exclude_not_before_claim: false
        # Phase 2 — `ext_claims` единственный top-level claim, разрешённый Hydra
        # для passthrough из token_hook (acceptance §2.3 — ext_claims содержит
        # kacho_external_id / kacho_active_account / kacho_organization_id / …).
        allowed_top_level_claims:
          - ext_claims
        client_credentials:
          default_grant_allowed_scope: false
        # KAC-127 (deploy#37): глобальные `oauth2.dpop` / `oauth2.mtls` блоки
        # удалены — их нет в Hydra v26.2.0 config-schema. В v26.2.0 sender-
        # constrained tokens конфигурируются per-client, а не глобально:
        #   - DPoP (RFC 9449)   — через client-metadata `dpop_bound_access_tokens`
        #     при регистрации OAuth2-клиента (Hydra-admin `/clients`);
        #   - mTLS (RFC 8705)   — через client `tls_client_auth_*` /
        #     `tls_client_certificate_bound_access_tokens`.
        # Acceptance §6.4/§6.5 — enforcement переезжает на per-client регистрацию
        # (см. kacho-iam client-bootstrap); глобального config-knob нет.
        # token_hook + refresh_hook → kacho-iam HTTP hooks listener (acceptance §5.4).
        # KAC-127 (deploy#39): URL исправлен — webhook'и обслуживает HTTP-listener
        # на :9092 Service'а `kacho-iam-internal` (НЕ gRPC :9091 на `kacho-iam`).
        # Shared secret через KACHO_IAM_HOOK_TOKEN env (см. Secret kacho-iam-hook-token).
        token_hook:
          url: "http://kacho-iam-internal.kacho.svc.cluster.local:9092/iam/v1/hooks/token"
          auth:
            type: api_key
            config:
              in: header
              name: X-Kacho-Hook-Token
              value: ${KACHO_IAM_HOOK_TOKEN}
        refresh_token_hook:
          url: "http://kacho-iam-internal.kacho.svc.cluster.local:9092/iam/v1/hooks/refresh"
          auth:
            type: api_key
            config:
              in: header
              name: X-Kacho-Hook-Token
              value: ${KACHO_IAM_HOOK_TOKEN}
      # JWKS — публикуются Hydra'ой; private keys управляются kacho-iam jwks-rotator
      # (см. jwks-rotator-cronjob.yaml). Phase 2 — RS256 + ES256 + EdDSA одновременно.
      webfinger:
        jwks:
          broadcast_keys:
            - hydra.openid.id-token         # signing-key set, populated by rotator
      log:
        level: info
        format: json
        leak_sensitive_values: true
      tracing:
        provider: otel
        providers:
          # KAC-127 (deploy#37): ключ `endpoint` переименован в `server_url` —
          # Hydra v26.2.0 tracing-schema (ory/x otelx) принимает `otlp.server_url`.
          otlp:
            server_url: otel-collector.observability.svc.cluster.local:4317
            insecure: true

keto:
  enabled: false
  keto:
    config:
      dsn: "postgres://keto:dev-keto-password@kacho-umbrella-pg-keto:5432/keto?sslmode=disable"
      # KAC-119: full namespace catalog. id-numbers стабильны.
      namespaces:
        - id: 0
          name: user
        - id: 1
          name: service_account
        - id: 2
          name: group
        - id: 3
          name: account
        - id: 4
          name: project
        - id: 5
          name: vpc_network
        - id: 6
          name: compute_instance
        - id: 7
          name: kacho_system        # KAC-119 system-wide admin marker
        - id: 8
          name: vpc_subnet
        - id: 9
          name: vpc_address
        - id: 10
          name: vpc_security_group
        - id: 11
          name: vpc_route_table
        - id: 12
          name: vpc_gateway
        - id: 13
          name: compute_disk
        - id: 14
          name: compute_image
        - id: 15
          name: compute_snapshot
      log:
        level: info
        format: json
    automigration:
      enabled: true
      type: initContainer

# Ory Kratos self-service UI (login/registration/recovery/verification/settings).
# Образ oryd/kratos-selfservice-ui-node. UI nginx проксирует /login,/registration,
# /recovery,/verification,/settings,/error → этот pod на :3000.
kratosSelfServiceUI:
  # KAC-127: включён вместе с kratos. kacho-ui nginx безусловно проксирует
  # /login,/registration,... → upstream `kratos-selfservice-ui.kacho.svc` —
  # при enabled=false Service не существует → nginx падает на старте
  # (`host not found in upstream`). С включённым Kratos-стеком этот UI-pod
  # обязателен для рабочего IAM-стенда.
  enabled: true
  image:
    repository: oryd/kratos-selfservice-ui-node
    tag: "v1.3.1"
  kratosBrowserUrl: "http://localhost:28080/.ory/kratos/public"
  kratosPublicUrl: "http://kacho-umbrella-kratos-public:80"
  hydraAdminUrl: "http://kacho-umbrella-hydra-admin:4445"
  cookieSecret: "please-change-this-32-bytes-A1Bx"

# KAC-127: zitadelOidcBootstrap удалён — identity/OIDC tier перешёл на Ory
# Kratos + Hydra (см. секции pg-kratos / pg-hydra выше).

# OpenFGA — REBAC engine для kacho-iam (Phase 3). Condition-gated через
# `openfga.enabled` / `openfgaBootstrap.enabled` (default false на E0/E1).
openfga:
  enabled: true
  datastore:
    engine: postgres
    uri: postgres://openfga:dev-openfga-password@kacho-umbrella-pg-openfga:5432/openfga?sslmode=disable
    # KAC-127: migrationType=initContainer вместо job. Дефолт sub-chart'а — `job` +
    # waitForMigrations=true: OpenFGA Deployment получает init-container
    # `wait-for-migration` (groundnuty/k8s-wait-for `job-wr`), который ждёт
    # завершения отдельного migration-Job. Под `helm install --wait` это deadlock:
    # `--wait` блокируется на не-Ready OpenFGA pod (init-container крутится),
    # release уходит в failed по timeout. С `initContainer` миграция исполняется
    # как собственный init-container OpenFGA Deployment — отдельного Job нет,
    # нет гонки, `--wait` дожидается обычным порядком.
    migrationType: initContainer
  service:
    type: ClusterIP
    grpc:
      port: 8081
    http:
      port: 8080
  playground:
    enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: openfga.kacho.local
        paths:
          - path: /
            pathType: Prefix
            backend:
              port: http

# kacho-iam — control-plane сервис IAM (Account / Project / User / ServiceAccount /
# Group / Role / AccessBinding). E0 — skeleton + CRUD; интеграция с Ory — E2/E3.
kacho-iam:
  name: kacho-iam
  replicas: 1
  image:
    repository: kacho-iam
    tag: dev
    pullPolicy: IfNotPresent
  ports:
    grpc: 9090
    internalGrpc: 9091
  service:
    public:
      type: ClusterIP
      port: 9090
    internal:
      type: ClusterIP
      port: 9091
  db:
    host: kacho-umbrella-pg-iam
    port: "5432"
    user: iam
    name: kacho_iam
    passwordSecretName: kacho-umbrella-pg-iam
    passwordSecretKey: password
  config:
    logger:
      level: INFO
    apiServer:
      gracefulShutdown: 10s
    metrics:
      enable: true
    healthcheck:
      enable: true
    repository:
      postgres:
        maxConns: 100
        sslMode: disable
    authn:
      mode: dev
    extapi:
      # KAC-127: zitadel config удалён — identity/OIDC tier на Ory Kratos + Hydra.
      openfga:
        # KAC-127 Phase 3: REBAC authorization Check is ON for dev. Without
        # `enabled: true` the kacho-iam config-validate logs
        # `extapi.openfga.enabled=false — authorization Check disabled` and
        # the config is inconsistent with the runtime (the FGA client *is*
        # wired whenever KACHO_IAM_OPENFGA_STORE_ID is populated by the
        # openfga-bootstrap-job). Set it true so config matches reality.
        enabled: true
        endpoint: openfga:8081
        # store-id заполняется bootstrap-job'ом в Secret kacho-iam-openfga-store
        storeIdSecretName: kacho-iam-openfga-store
        storeIdSecretKey: store_id
  initContainer:
    migrator:
      enabled: true
      command: ["/usr/local/bin/kacho-migrator", "up"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  env:
    # KAC-127 #25: enable AuthorizeService.ListObjects (FGA-filtered List).
    # Scope-filtered List RPCs (vpc NetworkService/List, iam User/SA List) call
    # ListObjects to resolve the caller's allowed-id set; without this the RPC
    # returns Unimplemented and the handler-side scope-filter fails 503.
    KACHO_AUTHZ_LISTOBJECTS: "on"
  # KAC-127 Phase 3: OPA sidecar config propagated from umbrella to sub-chart.
  # KAC-127 (deploy#39 fix): включён — kacho-iam отдаёт OPA-bundle по HTTP на
  # :9092; см. комментарий у top-level `opaSidecar` ниже.
  opaSidecar:
    enabled: true
    # KAC-127: `1.0.0-rootless` тег не существует. Нужен ИМЕННО opa-envoy
    # вариант — kacho-iam Deployment передаёт OPA-сайдкару флаг
    # `--set=plugins.envoy_ext_authz_grpc.enabled=false`; плагин
    # `envoy_ext_authz_grpc` есть только в opa-envoy-сборке (plain `opa`
    # падает `plugin not registered`). `-static`-суффикс = rootless static-build.
    image: openpolicyagent/opa:1.0.0-envoy-static
    logLevel: info
    jwks:
      configMapName: kacho-iam-jwks
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  openfgaBootstrap:
    modelIdSecretName: openfga-model-id

# ─── KAC-127 Phase 3: OpenFGA bootstrap-job (KAC-105 extended) ──────────
# post-install hook with full DSL v2 + idempotent + model-id Secret patch +
# rolling-restart annotation on consumer Deployments.
# See umbrella/templates/openfga-bootstrap-job.yaml for full behaviour.
openfgaBootstrap:
  # KAC-127 (deploy#38 fix): включён. Раньше был отключён из-за template-бага —
  # init-container `dsl-transform` запускал `/bin/sh`-скрипт на distroless
  # образе openfga/cli (нет shell) → падал `exec: "/bin/sh": not found`.
  # Fix: init-container удалён, DSL→JSON transform перенесён на commit-time —
  # ConfigMap openfga-model-stub несёт оба ключа (model.fga + model.json).
  # bootstrap-job (curlimages/curl, alpine) читает model.json напрямую.
  enabled: true
  # KAC-127 (deploy#38): alpine/k8s несёт kubectl+jq+curl+coreutils,
  # бежит root → bootstrap-скрипту не нужен runtime apk add.
  image: alpine/k8s:1.29.2
  # cliImage больше не нужен (init-container `dsl-transform` удалён) — оставлен
  # пустым на случай отката; см. openfga-bootstrap-job.yaml.
  cliImage: ""
  storeName: kacho-store
  authorizationModelConfigMap: openfga-model-stub
  modelIdSecretName: openfga-model-id
  clusterSingletonId: cluster_kacho_root
  # Dev: rely on bitnami pg-openfga auto-init (database `openfga`).
  initDatabase: false

# ─── KAC-127 Phase 3: OPA sidecar pipeline (acceptance §5.6) ────────────
# Enables per-pod OPA sidecar across api-gateway + kacho-iam + vpc + compute
# + loadbalancer for runtime guardrails (deny-only Rego on top of FGA ALLOW).
# KAC-127: ВРЕМЕННО отключён на dev. OPA bundle-plugin тянет policy-bundle по
# HTTP с `kacho-iam-internal:9091/opa/v1/bundle.tar.gz`, но порт 9091 kacho-iam —
# gRPC-only listener (нет HTTP bundle-эндпоинта) → connection refused → OPA
# sidecar не становится Ready → pod'ы застревают 1/2. Phase 3 OPA-bundle-delivery
# integration не завершена — см. GitHub-issue. kacho-iam main-container здоров и
# отдаёт gRPC API без OPA (OPA — deny-only guardrail-слой поверх FGA).
opaSidecar:
  # KAC-127 (deploy#39 fix): включён. Раньше отключён — OPA bundle-plugin тянул
  # bundle по HTTP с `kacho-iam-internal:9091`, но :9091 — gRPC-only listener
  # (нет HTTP bundle-эндпоинта) → connection refused → sidecar не Ready.
  # Fix: kacho-iam теперь отдаёт bundle через HTTP на :9092 (тот же listener,
  # что Hydra-hooks — `OPABundleHTTPHandler`, route `/opa/v1/bundle.tar.gz`);
  # порт :9092 экспонирован в Service kacho-iam-internal как `http-hooks`.
  enabled: true
  # KAC-127: opa-envoy-сборка обязательна (envoy_ext_authz_grpc плагин);
  # `-static`-суффикс = rootless static-build. См. opaSidecar выше.
  image: openpolicyagent/opa:1.0.0-envoy-static
  logLevel: info
  # KAC-127 (deploy#39): OPA sidecar тянет bundle с kacho-iam-контейнера
  # В ТОМ ЖЕ pod'е по loopback (127.0.0.1:9092) — НЕ через Service (это
  # дедлок rollout'а: Service маршрутизирует только на Ready-pod'ы, а pod
  # Ready только после загрузки bundle). `iamInternalHost` оставлен для
  # обратной совместимости values-схемы, но в configmap не используется.
  iamInternalHost: kacho-iam-internal
  iamInternalPort: 9092
  bundleResource: bundle.tar.gz
  # KAC-127 (deploy#39): in-tarball JWS bundle signing. kacho-iam OpaBundleService
  # currently produces an UNSIGNED tarball (detached JWS via separate gRPC RPC),
  # so OPA must not require in-bundle `.signatures.json` — иначе bundle не
  # загрузится. Hardening follow-up: embed `.signatures.json` → flip to true.
  bundleSigningEnabled: false
  # Shorter poll interval on dev for faster iteration on Rego changes.
  bundlePollMinSec: 60   # ~1min
  bundlePollMaxSec: 90
  signingKeyId: kacho-iam-signing-key-current
  bundle:
    ttlSeconds: 60          # dev: also short
    signingAlgorithm: ES256
    signingKeyKid: kacho-iam-signing-key-current
    buildShaEnvVar: KACHO_BUILD_SHA
    cacheStaleAfterSeconds: 600
    keyRotationGraceSeconds: 600
  jwks:
    configMapName: kacho-iam-jwks
    bootstrapKeyPem: ""
  networkPolicy:
    # Disabled on dev (would break port-forward debugging of kacho-iam :9091).
    enabled: false

# Sub-chart propagation note: opaSidecar + openfgaBootstrap.modelIdSecretName
# are propagated to kacho-iam sub-chart via the kacho-iam.opaSidecar / .openfgaBootstrap
# blocks above (inside the kacho-iam: top-level mapping). Duplicate top-level
# `kacho-iam:` block would last-wins-overwrite — see KAC-127 PR review.

