  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "16.4.0-debian-12-r0"
  auth:
    username: keto
    password: dev-keto-password
    database: keto
  primary:
    persistence: { enabled: false }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 1, memory: 1Gi }

kratos:
  enabled: false
  kratos:
    development: true
    automigration:
      enabled: true
    config:
      dsn: "postgres://kratos:dev-kratos-password@kacho-umbrella-pg-kratos:5432/kratos?sslmode=disable"
      serve:
        public:
          base_url: "http://5.35.93.58/.ory/kratos/public/"
          cors:
            enabled: true
            allowed_origins: ["http://5.35.93.58"]
        admin:
          base_url: "http://kacho-umbrella-kratos-admin:80/"
      selfservice:
        default_browser_return_url: "http://5.35.93.58/"
        allowed_return_urls: ["http://5.35.93.58"]
        methods:
          password: { enabled: true }
          oidc: { enabled: false }
          totp: { enabled: false }
        flows:
          registration:
            enabled: true
            ui_url: "http://5.35.93.58/registration"
