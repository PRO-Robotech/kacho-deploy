# Kachō umbrella — production overrides (KAC-127 Phase 2).
#
# Этот файл задаёт production defaults поверх values.yaml/values.dev.yaml.
# Применяется через:
#   helm upgrade kacho ./helm/umbrella \
#       -f values.yaml -f values.prod.yaml \
#       --set kacho.domain=api.kacho.cloud
#
# Per-cluster (multi-tenant) overrides — отдельные overrides.yaml под
# clusters/<cluster>/, которые override'ят `kacho.domain` под конкретный tenant.
#
# ─── KAC-127 IMPORTANT — domain interpolation ──────────────────────────
#
# Helm sub-chart values (как hydra.hydra.config.urls.*) НЕ проходят через
# template-evaluation pass перед передачей в sub-chart — поэтому строки вида
# `{{ .Values.kacho.domain }}` тут работать НЕ будут (sub-chart их получит
# verbatim).
#
# Решение: для каждого URL'а указываем явное значение, **которое CI/CD генерирует
# через envsubst / yq из template-source-файла** перед `helm install`. Либо —
# Phase 2 production deploy использует свой собственный ConfigMap вместо
# sub-chart-провайденного (см. charts/kacho-iam/templates/kratos-config-configmap.yaml
# — он рендерится через template и поэтому может использовать `{{ .Values.kacho.domain }}`).
#
# Sub-chart-провайденный Hydra config мы заменяем на standalone ConfigMap-mount
# в Phase 2 production (см. README раздел deployment). Этот файл задаёт **только
# `enabled`-флаги + DSN-paths**; полная config-структура — в standalone
# ConfigMap'ах под `templates/`.
#
# Для prod-only / customer-managed deploy domain нужно подставлять CD-pipeline'у;
# на этапе KAC-127 в values.prod.yaml выписаны эталонные prod-defaults для
# `api.kacho.cloud`, но любой downstream может их override'нуть через `--set`.

# ─── Domain (default = api.kacho.cloud; override через --set kacho.domain=…) ─
kacho:
  domain: api.kacho.cloud

# ─── Hydra production block ────────────────────────────────────────────
# Включаем Hydra в prod; остальной config приходит из standalone ConfigMap
# (см. charts/kacho-iam/templates/ — Phase 2 controls Hydra config через
# kacho-iam-managed mount, не через sub-chart-defaults).
hydra:
  enabled: true
  hydra:
    automigration:
      enabled: true
      type: job
    dev: false
    # Hydra-pod env переопределяется через раздел `deployment.environment`
    # sub-chart'а — там подсасываем `secretKeyRef` для DSN, system secret,
    # KACHO_IAM_HOOK_TOKEN из external-secrets-managed Secret.
    # `config.*` URLs — выставляются CD-pipeline через `--set hydra.hydra.config.urls.*`.
    config:
      # DSN — из external-secrets `kacho-hydra-db`.
      dsn: "${HYDRA_DSN}"
      serve:
        public:
          cors:
            enabled: true
            # Allowed origins — UI subdomain под текущим kacho.domain.
            # CD pipeline override'ит через --set:
            #   --set "hydra.hydra.config.serve.public.cors.allowed_origins[0]=https://app.api.kacho.cloud"
            allowed_origins:
              - "https://app.api.kacho.cloud"
      urls:
        self:
          # Prod issuer — должен быть HTTPS + matchнутый с TLS-cert для разъёма
          # `iss` claim. CD-pipeline override'ит:
          #   --set "hydra.hydra.config.urls.self.issuer=https://hydra.${KACHO_DOMAIN}"
          public: "https://hydra.api.kacho.cloud"
          issuer: "https://hydra.api.kacho.cloud"
        consent: "https://app.api.kacho.cloud/oauth/consent"
        login: "https://app.api.kacho.cloud/oauth/login"
        logout: "https://app.api.kacho.cloud/oauth/logout"
        error: "https://app.api.kacho.cloud/auth/error"
        post_logout_redirect: "https://app.api.kacho.cloud/"
        identity_provider:
          publicly_writable: false
      secrets:
        system: ["${HYDRA_SYSTEM_SECRET}"]
        cookie: ["${HYDRA_COOKIE_SECRET}"]
      strategies:
        access_token: jwt
        jwt:
          scope_claim: list
      ttl:
        access_token: 15m
        refresh_token: 720h
        id_token: 15m
        auth_code: 1m
      oauth2:
        expose_internal_errors: false   # prod — НЕ leak'ить internal errors.
        pkce:
          enforced: true
          enforced_for_public_clients: true
        grant:
          jwt:
            iat_optional: false
            jti_optional: false
            max_ttl: 720h
          authorization_code:
            require_pkce: true
            ttl: 1m
        refresh_token_rotation: true
        refresh_token_rotation_grace_period: 1s
        refresh_token_grant_skip_token_binding_validation: false
        exclude_not_before_claim: false
        allowed_top_level_claims:
          - ext_claims
        client_credentials:
          default_grant_allowed_scope: false
        dpop:
          enabled: true
          signing_algorithms: [ES256, EdDSA]
          iat_skew_tolerance: 60s
        mtls:
          enabled: true
          cnf_thumbprint_algorithm: SHA-256
        token_hook:
          url: "http://kacho-iam.kacho.svc.cluster.local:9091/iam/v1/hooks/token"
          auth:
            type: api_key
            config:
              in: header
              name: X-Kacho-Hook-Token
              value: ${KACHO_IAM_HOOK_TOKEN}
        refresh_token_hook:
          url: "http://kacho-iam.kacho.svc.cluster.local:9091/iam/v1/hooks/refresh"
          auth:
            type: api_key
            config:
              in: header
              name: X-Kacho-Hook-Token
              value: ${KACHO_IAM_HOOK_TOKEN}
      webfinger:
        jwks:
          broadcast_keys:
            - hydra.openid.id-token
      log:
        level: info
        format: json
        leak_sensitive_values: false   # prod — обязательно false (security).
      tracing:
        provider: otel
        providers:
          otlp:
            endpoint: otel-collector.observability.svc.cluster.local:4317
            insecure: false

# ─── Kratos production block ───────────────────────────────────────────
# Включаем Kratos в prod. Config-source — standalone ConfigMap
# (kratos-config-configmap.yaml) с template-interpolated `kacho.domain`.
# Sub-chart `kratos.kratos.config.*` оставляем минимальным — только DSN
# и automigration; полный config приходит из mounted ConfigMap.
kratos:
  enabled: true
  kratos:
    development: false
    automigration:
      enabled: true
    config:
      dsn: "${KRATOS_DSN}"
      # Остальные ключи (selfservice / methods / hooks / RP-id) — в standalone
      # ConfigMap charts/kacho-iam/templates/kratos-config-configmap.yaml, который
      # mount'ится в pod на /etc/config/kratos/kratos.yaml. Kratos sub-chart
      # `extraVolumeMounts` указывает на этот ConfigMap.
      log:
        level: info
        format: json
        leak_sensitive_values: false

# ─── Keto production block ──────────────────────────────────────────────
keto:
  enabled: true
  keto:
    config:
      dsn: "${KETO_DSN}"
      log:
        level: info
        format: json
    automigration:
      enabled: true
      type: initContainer

# ─── Postgres sub-charts: prod-режим (persistence enabled) ─────────────
# В prod нужны PV / production-grade-resource-limits. Здесь — overlay для
# pg-iam / pg-hydra / pg-kratos / pg-keto; остальные (pg-vpc / pg-compute /
# pg-zitadel / pg-openfga) — отдельный values.prod.yaml блок (вне scope KAC-127).
pg-iam:
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""        # CD-pipeline override'ит per-cluster.
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: 4, memory: 4Gi }

pg-hydra:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: 4, memory: 4Gi }

pg-kratos:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: ""
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits:   { cpu: 2, memory: 2Gi }

pg-keto:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: ""
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits:   { cpu: 2, memory: 2Gi }

# ─── kacho-iam production block ────────────────────────────────────────
kacho-iam:
  replicas: 3
  image:
    repository: kacho-iam
    tag: "${KACHO_IAM_TAG}"     # CD-pipeline injectit конкретный SHA.
    pullPolicy: IfNotPresent
  config:
    logger:
      level: INFO
    repository:
      postgres:
        maxConns: 200
        sslMode: require
    authn:
      mode: prod
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 2Gi
  # KAC-127 Phase 3: OPA sidecar — REQUIRED on prod (acceptance §5.6 + §5.7).
  # Pod gets OPA injected; sidecar pulls signed bundle from kacho-iam :9091.
  opaSidecar:
    enabled: true
    image: openpolicyagent/opa:1.0.0-rootless
    logLevel: warn
    jwks:
      configMapName: kacho-iam-jwks
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  openfgaBootstrap:
    modelIdSecretName: openfga-model-id

# ─── VPC sub-chart prod overrides ──────────────────────────────────────
# В prod включаем admin networkpolicy (запрет любого pod→:9091 кроме admin-pods).
vpc:
  networkPolicy:
    enabled: true
    # Override per-cluster — labels admin-pods, которым разрешён доступ к :9091.
    adminPodsSelector:
      matchLabels:
        kacho.cloud/role: admin

# ─── Dev-only компоненты — disabled в prod ─────────────────────────────
mailhog:
  enabled: false
zitadel:
  enabled: false        # KAC-115: Zitadel заменён на Ory stack (Kratos + Hydra).

# ─── KAC-127 Phase 3: AuthZ core (OpenFGA + OPA) — required on prod ────
# Decision history:
#   - KAC-119 originally proposed Keto as the FGA replacement on prod.
#   - KAC-127 sub-phase-3.3 acceptance (frozen 2026-05-19) reverses that:
#     OpenFGA + Conditions (CEL) is the production engine; OPA sidecar is the
#     guardrail overlay. Keto retained only as Hydra-attached store (no FGA-style
#     usage on prod).
# Both engines run with HA replicas + NetworkPolicy + signed bundles. See
# acceptance §5.1–§5.7 for the full deployment topology.
openfga:
  enabled: true
  datastore:
    engine: postgres
    # Real connection string injected via external-secrets-operator at deploy
    # time (`secret-ref: pg-openfga-credentials`). The literal below is only a
    # placeholder for the umbrella template to render; the operator overrides
    # via `--set openfga.datastore.uri=$(vault kv get …)` in CI.
    uri: postgres://openfga@kacho-umbrella-pg-openfga:5432/kacho_openfga?sslmode=require
  # HA topology — 3 replicas. PodDisruptionBudget is emitted separately via
  # umbrella template `openfga-pdb.yaml` (upstream chart schema rejects
  # `podDisruptionBudget` as additional property — see networkpolicy-authz).
  replicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  # Playground DISABLED on prod (the in-browser tuple editor exposes Check
  # endpoint without RBAC — must never be reachable from public ingress).
  playground:
    enabled: false
  ingress:
    enabled: false
  # Telemetry: scrape /metrics endpoint via ServiceMonitor (Phase 11 deploys
  # Prometheus). Tracing — OTLP to kacho-otel-collector (Phase 11).
  telemetry:
    trace:
      enabled: true
      otlp:
        endpoint: http://kacho-otel-collector.kacho-system.svc.cluster.local:4317
    metrics:
      enabled: true

# KAC-127 Phase 3: PDB for OpenFGA engine (HA-mode reliability primitive).
openfgaPdb:
  enabled: true
  minAvailable: 2

zitadelOidcBootstrap:
  enabled: false
kratosSelfServiceUI:
  enabled: false        # Phase 2 — UI from kacho-ui repo, не selfservice-stock.

# ─── KAC-127 Phase 3: openfga-bootstrap-job — enabled on prod ──────────
openfgaBootstrap:
  enabled: true
  image: curlimages/curl:8.5.0
  cliImage: openfga/cli:0.6.5
  storeName: kacho-store
  authorizationModelConfigMap: openfga-model-stub
  modelIdSecretName: openfga-model-id
  clusterSingletonId: cluster_kacho_root
  # Prod: explicit DB bootstrap Job runs against shared Postgres operator
  # (CloudNativePG / RDS) that does NOT auto-create per-tenant databases.
  # If the cluster uses bitnami pg-openfga (auto-init), keep this disabled.
  initDatabase: true
  dbAdmin:
    image: postgres:16-alpine
    host: kacho-umbrella-pg-openfga
    port: "5432"
    user: postgres
    # External-secrets-operator populates this Secret at deploy time from
    # vault path `secret/kacho/prod/pg-openfga/admin`.
    passwordSecretName: pg-openfga-admin-credentials
    passwordSecretKey: password
    fgaUser: openfga
    fgaPasswordSecretName: pg-openfga-credentials
    fgaPasswordSecretKey: password
    fgaDatabase: kacho_openfga

# ─── KAC-127 Phase 3: OPA sidecar pipeline (production) ────────────────
# Enabled on prod with NetworkPolicy ON. OPA sidecars require the JWKS public
# key ConfigMap to be populated by the Phase 2 JWKS rotator before they can
# verify bundle signatures (fail-closed: unsigned/tampered bundle == OPA refuses
# to load, request denied).
opaSidecar:
  enabled: true
  image: openpolicyagent/opa:1.0.0-rootless
  logLevel: warn      # info on dev, warn on prod (decision-log noise reduction)
  iamInternalHost: kacho-umbrella-iam-internal
  iamInternalPort: 9091
  bundleResource: bundle.tar.gz
  bundlePollMinSec: 3000   # ~50min (prod: long jitter window)
  bundlePollMaxSec: 3900   # ~65min
  signingKeyId: kacho-iam-signing-key-current
  bundle:
    ttlSeconds: 3600
    signingAlgorithm: ES256
    signingKeyKid: kacho-iam-signing-key-current
    buildShaEnvVar: KACHO_BUILD_SHA
    cacheStaleAfterSeconds: 7200
    keyRotationGraceSeconds: 7200
  jwks:
    configMapName: kacho-iam-jwks
    bootstrapKeyPem: ""    # populated by JWKS rotator at runtime.
  # Defense-in-depth NetworkPolicy — REQUIRED on prod (acceptance §5.7).
  networkPolicy:
    enabled: true
    iamPodSelector:
      matchLabels:
        app.kubernetes.io/name: kacho-iam
    openfgaPodSelector:
      matchLabels:
        app.kubernetes.io/name: openfga
    apiGatewayPodSelector:
      matchLabels:
        app: api-gateway
    backendPodSelector:
      matchExpressions:
        - key: app
          operator: In
          values: [vpc, compute, loadbalancer]

# Sub-chart propagation note: opaSidecar + openfgaBootstrap.modelIdSecretName
# are propagated to kacho-iam sub-chart via the kacho-iam.opaSidecar / .openfgaBootstrap
# blocks above (inside the kacho-iam: top-level mapping). Duplicate top-level
# `kacho-iam:` block would last-wins-overwrite — see KAC-127 PR review.

# ─── KAC-127 Phase 9 — Audit pipeline (sub-phase 3.9) production overrides ─
#
# Production требует:
#   - audit.enabled=true + audit.siem.enabled=true
#   - kafka.enabled=true + clickhouse.enabled=true + kafka-connect.enabled=true
#   - hsm.provider != softhsm (compliance: SOC2 / FedRAMP / ISO 27001
#     требуют FIPS 140-2 Level 3+ HSM; SoftHSM приемлем ТОЛЬКО для dev/CI).
#   - s3.bucket configured per-environment (e.g. `kacho-audit-eu-central-1-prod`)
#   - networkPolicy.enabled=true с правильными hsmEndpoints CIDR'ами.
#
# Domain пробрасывается через CI/CD `--set kacho.domain=...` (см. line 36).
#
# ⚠ PROD CHECKLIST:
#   [ ] audit.s3.bucket — override per-region (НЕ хардкод в values.yaml)
#   [ ] audit.hsm.provider — НЕ softhsm; library + slot + token + key labels — корректны
#   [ ] audit.hsm.pinSecret — Secret создан externally (sealed-secrets / vault)
#   [ ] audit.networkPolicy.hsmEndpoints — CIDR'ы HSM cluster ENI
#   [ ] audit.siem.* providers — токены в Secret'ах (external-secrets)
#   [ ] kafka.cluster.brokers >= 3 + cluster.storage.size adequate for 7d retention
#   [ ] clickhouse.cluster.shards >= 2 + replicas >= 2 (HA)

kafka:
  enabled: true
# clickhouse subchart inherits umbrella audit.s3.* через explicit mirror
# (Helm не пропагирует top-level audit.* в subchart автоматически).
clickhouse:
  enabled: true
  backup:
    s3:
      bucket: "kacho-audit-cold-prod"
      endpoint: ""
      region: eu-central-1
# kafka-connect S3 sink — propagate umbrella audit.s3.*.
kafka-connect:
  enabled: true
  s3:
    bucket: "kacho-audit-cold-prod"
    endpoint: ""
    region: eu-central-1

audit:
  enabled: true
  # 5-min schedule per P9-D7 (рекомендуется не менять).
  merkleBatchSchedule: "*/5 * * * *"
  verifierSchedule: "0 2 * * *"
  s3:
    # Per-environment bucket — override via CI/CD --set.
    bucket: "kacho-audit-cold-prod"
    endpoint: ""    # AWS S3 default (region-based endpoint)
    region: eu-central-1
  retention:
    hot: 90d
    warmStandard: 30d
    warmIA: 1y
    cold: 10y
  hsm:
    # PRODUCTION: change to awscloudhsm / gcpcloudhsm / azurekv / thalesluna
    # per-environment.
    provider: awscloudhsm
    libraryPath: /opt/cloudhsm/lib/libcloudhsm_pkcs11.so
    slot: 0
    tokenLabel: kacho-audit-signing
    keyLabel: kacho-audit-merkle-2026
    signingAlgorithm: ECDSA-P384-SHA384
    pinSecret: kacho-iam-hsm-pin  # ExternalSecret → vault
  siem:
    enabled: true
    replicas: 3   # HA — survives single-pod failure
    autoDisableThreshold: 5
    rateLimitEventsPerSec: 100
    datadog:
      enabled: true
    splunk:
      enabled: true
    elastic:
      enabled: true
    genericWebhook:
      enabled: true
  networkPolicy:
    enabled: true
    # CIDR'ы HSM cluster ENI — override per-region.
    hsmEndpoints:
      - cidr: "10.100.0.0/24"   # пример AWS CloudHSM CIDR
        port: 2223
      - cidr: "10.100.0.0/24"
        port: 2224
      - cidr: "10.100.0.0/24"
        port: 2225
  prometheusRules:
    enabled: true

# Propagate audit overrides into kacho-iam sub-chart.
kacho-iam:
  audit:
    enabled: true
    merkleBatchSchedule: "*/5 * * * *"
    verifierSchedule: "0 2 * * *"
    s3:
      bucket: "kacho-audit-cold-prod"
      endpoint: ""
      region: eu-central-1
    retention:
      hot: 90d
      warmStandard: 30d
      warmIA: 1y
      cold: 10y
    hsm:
      provider: awscloudhsm
      libraryPath: /opt/cloudhsm/lib/libcloudhsm_pkcs11.so
      slot: 0
      tokenLabel: kacho-audit-signing
      keyLabel: kacho-audit-merkle-2026
      signingAlgorithm: ECDSA-P384-SHA384
      pinSecret: kacho-iam-hsm-pin
    siem:
      enabled: true
      replicas: 3
    networkPolicy:
      enabled: true
      hsmEndpoints:
        - cidr: "10.100.0.0/24"
          port: 2223
        - cidr: "10.100.0.0/24"
          port: 2224
        - cidr: "10.100.0.0/24"
          port: 2225
    prometheusRules:
      enabled: true

# ─── KAC-127 Phase 10 — SPIFFE/SPIRE + Cilium mesh + cosign ─────────────
# PROD enabled: full SPIRE HA + Cilium eBPF mesh + cosign enforce.
# Trust domain — prod-eu-central uses `kacho.cloud`.

spiffe:
  trustDomain: kacho.cloud
  clusterName: kacho-prod-eu-central

pg-spire:
  enabled: true
  global:
    postgresql:
      auth:
        username: spire
        database: kacho_spire
  primary:
    persistence:
      size: 50Gi
  # anti-affinity per node (HA).
  primary:
    podAntiAffinityPreset: hard

spire-server:
  enabled: true
  trustDomain: kacho.cloud
  replicaCount: 3
  ca:
    plugin: pkcs11
    ttlHours: 168
    defaultSvidTtlSeconds: 3600
    pkcs11:
      # AWS CloudHSM library в production.
      libraryPath: "/opt/cloudhsm/lib/libcloudhsm_pkcs11.so"
      slot: 0
      tokenLabel: "kacho-spire-root"
      keyLabel: "kacho-spire-ca-2026"
      pinSecretName: "spire-server-hsm-pin"
      pinSecretKey: "pin"
  dataStore:
    connectionString: "host=kacho-umbrella-pg-spire port=5432 user=spire dbname=kacho_spire sslmode=require"
    initDatabase: true
  federation:
    bundleEndpoint:
      profile: "https_spiffe"
    ingress:
      enabled: true
      host: "spire.kacho.cloud"
      certIssuer: "letsencrypt-prod"
  podAntiAffinity:
    enabled: true
    type: required
    topologyKey: "topology.kubernetes.io/zone"  # per-AZ anti-affinity
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  networkPolicy:
    enabled: true
    hsmEndpoints:
      - cidr: "10.100.0.0/24"
        port: 2223
      - cidr: "10.100.0.0/24"
        port: 2224
      - cidr: "10.100.0.0/24"
        port: 2225
  serviceMonitor:
    enabled: true

spire-agent:
  enabled: true
  trustDomain: kacho.cloud
  serverAddress: "kacho-umbrella-spire-server-headless.spire-system.svc.cluster.local"
  attestors:
    k8s:
      enabled: true
      audience: "spire-server"
    unix:
      enabled: true
    cosign:
      enabled: true
      # Production: kacho-platform team key fingerprint.
      # Override via ExternalSecrets in real prod.
      trustedSigners:
        - "kacho-platform-team-2026"
  serviceMonitor:
    enabled: true

cilium:
  enabled: true
  spiffe:
    trustDomain: kacho.cloud
    spireServerAddress: "kacho-umbrella-spire-server.spire-system.svc.cluster.local:8081"
  serviceMesh:
    enabled: true
    authenticationMode: "required"   # enforce — drop traffic without SPIFFE auth
  encryption:
    enabled: true
    type: "wireguard"
    nodeEncryption: true
  kubeProxyReplacement: "strict"
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
      ingress:
        enabled: true
        host: "hubble.kacho.cloud"
        certIssuer: "letsencrypt-prod"
        annotations:
          # OIDC через Hydra — admin-only.
          nginx.ingress.kubernetes.io/auth-url: "https://hydra.kacho.cloud/oauth2/sessions/whoami"
          nginx.ingress.kubernetes.io/auth-signin: "https://hydra.kacho.cloud/oauth2/auth"
    exporter:
      enabled: true
      otlpEndpoint: "otel-collector.observability.svc.cluster.local:4317"
  cosign:
    enabled: true
    secretName: "cilium-cosign-public-key"
    secretKey: "cosign.pub"
  mtlsEnforcePolicy:
    enabled: true
  grafanaDashboards:
    enabled: true

cosign-policy-controller:
  enabled: true
  enforcedNamespaces:
    - kacho-system
  warnNamespaces:
    - kube-system
  cosign:
