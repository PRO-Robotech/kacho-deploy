# Kachō umbrella — production overrides (KAC-127 Phase 2).
#
# Этот файл задаёт production defaults поверх values.yaml/values.dev.yaml.
# Применяется через:
#   helm upgrade kacho ./helm/umbrella \
#       -f values.yaml -f values.prod.yaml \
#       --set kacho.domain=api.kacho.cloud
#
# Per-cluster (multi-tenant) overrides — отдельные overrides.yaml под
# clusters/<cluster>/, которые override'ят `kacho.domain` под конкретный tenant.
#
# ─── KAC-127 IMPORTANT — domain interpolation ──────────────────────────
#
# Helm sub-chart values (как hydra.hydra.config.urls.*) НЕ проходят через
# template-evaluation pass перед передачей в sub-chart — поэтому строки вида
# `{{ .Values.kacho.domain }}` тут работать НЕ будут (sub-chart их получит
# verbatim).
#
# Решение: для каждого URL'а указываем явное значение, **которое CI/CD генерирует
# через envsubst / yq из template-source-файла** перед `helm install`. Либо —
# Phase 2 production deploy использует свой собственный ConfigMap вместо
# sub-chart-провайденного (см. charts/kacho-iam/templates/kratos-config-configmap.yaml
# — он рендерится через template и поэтому может использовать `{{ .Values.kacho.domain }}`).
#
# Sub-chart-провайденный Hydra config мы заменяем на standalone ConfigMap-mount
# в Phase 2 production (см. README раздел deployment). Этот файл задаёт **только
# `enabled`-флаги + DSN-paths**; полная config-структура — в standalone
# ConfigMap'ах под `templates/`.
#
# Для prod-only / customer-managed deploy domain нужно подставлять CD-pipeline'у;
# на этапе KAC-127 в values.prod.yaml выписаны эталонные prod-defaults для
# `api.kacho.cloud`, но любой downstream может их override'нуть через `--set`.

# ─── Domain (default = api.kacho.cloud; override через --set kacho.domain=…) ─
kacho:
  domain: api.kacho.cloud

# ─── Hydra production block ────────────────────────────────────────────
# Включаем Hydra в prod; остальной config приходит из standalone ConfigMap
# (см. charts/kacho-iam/templates/ — Phase 2 controls Hydra config через
# kacho-iam-managed mount, не через sub-chart-defaults).
hydra:
  enabled: true
  hydra:
    automigration:
      enabled: true
      type: job
    dev: false
    # Hydra-pod env переопределяется через раздел `deployment.environment`
    # sub-chart'а — там подсасываем `secretKeyRef` для DSN, system secret,
    # KACHO_IAM_HOOK_TOKEN из external-secrets-managed Secret.
    # `config.*` URLs — выставляются CD-pipeline через `--set hydra.hydra.config.urls.*`.
    config:
      # DSN — из external-secrets `kacho-hydra-db`.
      dsn: "${HYDRA_DSN}"
      serve:
        public:
          cors:
            enabled: true
            # Allowed origins — UI subdomain под текущим kacho.domain.
            # CD pipeline override'ит через --set:
            #   --set "hydra.hydra.config.serve.public.cors.allowed_origins[0]=https://app.api.kacho.cloud"
            allowed_origins:
              - "https://app.api.kacho.cloud"
      urls:
        self:
          # Prod issuer — должен быть HTTPS + matchнутый с TLS-cert для разъёма
          # `iss` claim. CD-pipeline override'ит:
          #   --set "hydra.hydra.config.urls.self.issuer=https://hydra.${KACHO_DOMAIN}"
          public: "https://hydra.api.kacho.cloud"
          issuer: "https://hydra.api.kacho.cloud"
        consent: "https://app.api.kacho.cloud/oauth/consent"
        login: "https://app.api.kacho.cloud/oauth/login"
        logout: "https://app.api.kacho.cloud/oauth/logout"
        error: "https://app.api.kacho.cloud/auth/error"
        post_logout_redirect: "https://app.api.kacho.cloud/"
        # KAC-127 (deploy#37): `identity_provider.publicly_writable` удалён —
        # ключ не существует в Hydra v26.2.0 config-schema.
      secrets:
        system: ["${HYDRA_SYSTEM_SECRET}"]
        cookie: ["${HYDRA_COOKIE_SECRET}"]
      strategies:
        access_token: jwt
        jwt:
          scope_claim: list
      ttl:
        access_token: 15m
        refresh_token: 720h
        id_token: 15m
        auth_code: 1m
      oauth2:
        expose_internal_errors: false   # prod — НЕ leak'ить internal errors.
        pkce:
          enforced: true
          enforced_for_public_clients: true
        # KAC-127 (deploy#37): v26.2.0 — `grant` принимает только jwt/refresh_token;
        # PKCE через `oauth2.pkce`, auth_code-TTL через `ttl.auth_code`.
        grant:
          jwt:
            iat_optional: false
            jti_optional: false
            max_ttl: 720h
          # Refresh rotation в v26.2.0 всегда вкл.; настраивается grace-window.
          refresh_token:
            rotation_grace_period: 1s
        exclude_not_before_claim: false
        allowed_top_level_claims:
          - ext_claims
        client_credentials:
          default_grant_allowed_scope: false
        # KAC-127 (deploy#37): глобальные `oauth2.dpop` / `oauth2.mtls` удалены —
        # в Hydra v26.2.0 sender-constrained tokens (DPoP RFC 9449 / mTLS RFC 8705)
        # конфигурируются per-client (client-metadata `dpop_bound_access_tokens` /
        # `tls_client_certificate_bound_access_tokens`), не глобальным config.
        # KAC-127 (deploy#39): webhook'и на HTTP-listener :9092 Service'а
        # `kacho-iam-internal` (НЕ gRPC :9091 на `kacho-iam`).
        token_hook:
          url: "http://kacho-iam-internal.kacho.svc.cluster.local:9092/iam/v1/hooks/token"
          auth:
            type: api_key
            config:
              in: header
              name: X-Kacho-Hook-Token
              value: ${KACHO_IAM_HOOK_TOKEN}
        refresh_token_hook:
          url: "http://kacho-iam-internal.kacho.svc.cluster.local:9092/iam/v1/hooks/refresh"
          auth:
            type: api_key
            config:
              in: header
              name: X-Kacho-Hook-Token
              value: ${KACHO_IAM_HOOK_TOKEN}
      webfinger:
        jwks:
          broadcast_keys:
            - hydra.openid.id-token
      log:
        level: info
        format: json
        leak_sensitive_values: false   # prod — обязательно false (security).
      tracing:
        provider: otel
        providers:
          # KAC-127 (deploy#37): `endpoint` → `server_url` (Hydra v26.2.0 otelx).
          otlp:
            server_url: otel-collector.observability.svc.cluster.local:4317
            insecure: false

# ─── Kratos production block ───────────────────────────────────────────
# Включаем Kratos в prod. Config-source — standalone ConfigMap
# (kratos-config-configmap.yaml) с template-interpolated `kacho.domain`.
# Sub-chart `kratos.kratos.config.*` оставляем минимальным — только DSN
# и automigration; полный config приходит из mounted ConfigMap.
kratos:
  enabled: true
  kratos:
    development: false
    automigration:
      enabled: true
    config:
      dsn: "${KRATOS_DSN}"
      # Остальные ключи (selfservice / methods / hooks / RP-id) — в standalone
      # ConfigMap charts/kacho-iam/templates/kratos-config-configmap.yaml, который
      # mount'ится в pod на /etc/config/kratos/kratos.yaml. Kratos sub-chart
      # `extraVolumeMounts` указывает на этот ConfigMap.
      log:
        level: info
        format: json
        leak_sensitive_values: false

# ─── Keto production block ──────────────────────────────────────────────
keto:
  enabled: true
  keto:
    config:
      dsn: "${KETO_DSN}"
      log:
        level: info
        format: json
    automigration:
      enabled: true
      type: initContainer

# ─── Postgres sub-charts: prod-режим (persistence enabled) ─────────────
# В prod нужны PV / production-grade-resource-limits. Здесь — overlay для
# pg-iam / pg-hydra / pg-kratos / pg-keto; остальные (pg-vpc / pg-compute /
# pg-openfga) — отдельный values.prod.yaml блок (вне scope KAC-127).
pg-iam:
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""        # CD-pipeline override'ит per-cluster.
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: 4, memory: 4Gi }

pg-hydra:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: 4, memory: 4Gi }

pg-kratos:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: ""
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits:   { cpu: 2, memory: 2Gi }

pg-keto:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: ""
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits:   { cpu: 2, memory: 2Gi }

# KAC-NLB — production backing Postgres for kacho-nlb. Same persistence /
# resource shape as pg-vpc; CD-pipeline supplies storageClass per cluster.
# Real password injected via external-secrets-operator before helm upgrade —
# bitnami's `auth.existingSecret` is the override hook (omitted here so the
# dev `auth.password` default is the visible fallback; CD overlay sets it).
pg-nlb:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: 4, memory: 4Gi }

# ─── kacho-iam production block ────────────────────────────────────────
kacho-iam:
  replicas: 3
  # KAC-127 — production образ из DockerHub (multi-arch, собран docker-build.yml).
  # CD-pipeline инжектит конкретный тег `<branch>-<sha8>` через ${KACHO_IMAGE_TAG}
  # (envsubst перед `helm upgrade`) либо через `--set kacho-iam.image.tag=…`.
  image:
    repository: docker.io/prorobotech/kacho-iam
    tag: "${KACHO_IMAGE_TAG}"   # CD-pipeline injectit конкретный SHA-тег.
    pullPolicy: IfNotPresent
  config:
    logger:
      level: INFO
    repository:
      postgres:
        maxConns: 200
        sslMode: require
    authn:
      mode: prod
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 2Gi
  # KAC-127 Phase 3: OPA sidecar — REQUIRED on prod (acceptance §5.6 + §5.7).
  # Pod gets OPA injected; sidecar pulls signed bundle from kacho-iam :9091.
  opaSidecar:
    enabled: true
    image: openpolicyagent/opa:1.0.0-rootless
    logLevel: warn
    jwks:
      configMapName: kacho-iam-jwks
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  openfgaBootstrap:
    modelIdSecretName: openfga-model-id

# ─── VPC sub-chart prod overrides ──────────────────────────────────────
# В prod включаем admin networkpolicy (запрет любого pod→:9091 кроме admin-pods).
# KAC-127 — production образы из DockerHub (multi-arch, собраны docker-build.yml).
# CD-pipeline инжектит конкретный тег через ${KACHO_IMAGE_TAG} (envsubst) либо
# `--set <svc>.image=docker.io/<user>/<svc>:<tag>`. pullPolicy Always — prod
# тянет свежий образ при каждом rollout.
vpc:
  image: "docker.io/prorobotech/kacho-vpc:${KACHO_IMAGE_TAG}"
  imagePullPolicy: Always
  networkPolicy:
    enabled: true
    # Override per-cluster — labels admin-pods, которым разрешён доступ к :9091.
    adminPodsSelector:
      matchLabels:
        kacho.cloud/role: admin

compute:
  image: "docker.io/prorobotech/kacho-compute:${KACHO_IMAGE_TAG}"
  imagePullPolicy: Always

api-gateway:
  image: "docker.io/prorobotech/kacho-api-gateway:${KACHO_IMAGE_TAG}"
  imagePullPolicy: Always
  # KAC-139 (W1.3): production must fail-closed on IAM-Check error / OpenFGA
  # unreachable. Chart default `authz: {}` would render env-vars defaulted to
  # `false` (see api-gateway/templates/deployment.yaml:95-112) — middleware
  # mounts as no-op pass-through (silent disable). Make explicit.
  authz:
    enabled: true
    failOpen: false
  # KAC-139 (W1.3): production-strict authn mode — Bearer mandatory, anonymous
  # path forbidden on the public surface. (Mode was documented in
  # api-gateway/internal/config/config.go since KAC-127; never wired into prod
  # overlay until now.)
  authn:
    mode: production-strict
  # KAC-139 (W1.3): startup-validation in cmd/api-gateway/main.go refuses to
  # boot in production when authz.enabled=false OR failOpen=true. The signal
  # is KACHO_APP_ENV; emitted here via the chart's extraEnv escape-hatch
  # (no chart bump needed).
  extraEnv:
    KACHO_APP_ENV: "prod"
  # KAC-NLB: production backends map — adds nlb / nlbInternal alongside the
  # existing vpc / compute / iam entries. The api-gateway sub-chart
  # deployment template renders KACHO_API_GATEWAY_NLB_GRPC /
  # KACHO_API_GATEWAY_NLB_INTERNAL_GRPC conditionally on these keys (see
  # comment in values.dev.yaml api-gateway.backends).
  backends:
    vpc: vpc.kacho.svc.cluster.local:9090
    vpcInternal: vpc.kacho.svc.cluster.local:9091
    compute: compute.kacho.svc.cluster.local:9090
    computeInternal: compute.kacho.svc.cluster.local:9091
    iam: kacho-iam.kacho.svc.cluster.local:9090
    iamInternal: kacho-iam-internal.kacho.svc.cluster.local:9091
    nlb: kacho-nlb.kacho.svc.cluster.local:9090
    nlbInternal: kacho-nlb-internal.kacho.svc.cluster.local:9091

ui:
  image: "docker.io/prorobotech/kacho-ui:${KACHO_IMAGE_TAG}"
  imagePullPolicy: Always

# ─── Dev-only компоненты — disabled в prod ─────────────────────────────
mailhog:
  enabled: false
# KAC-127: zitadel chart удалён из umbrella — auth-tier на Ory Kratos + Hydra.

# ─── KAC-127 Phase 3: AuthZ core (OpenFGA + OPA) — required on prod ────
# Decision history:
#   - KAC-119 originally proposed Keto as the FGA replacement on prod.
#   - KAC-127 sub-phase-3.3 acceptance (frozen 2026-05-19) reverses that:
#     OpenFGA + Conditions (CEL) is the production engine; OPA sidecar is the
#     guardrail overlay. Keto retained only as Hydra-attached store (no FGA-style
#     usage on prod).
# Both engines run with HA replicas + NetworkPolicy + signed bundles. See
# acceptance §5.1–§5.7 for the full deployment topology.
openfga:
  enabled: true
  datastore:
    engine: postgres
    # Real connection string injected via external-secrets-operator at deploy
    # time (`secret-ref: pg-openfga-credentials`). The literal below is only a
    # placeholder for the umbrella template to render; the operator overrides
    # via `--set openfga.datastore.uri=$(vault kv get …)` in CI.
    uri: postgres://openfga@kacho-umbrella-pg-openfga:5432/kacho_openfga?sslmode=require
  # HA topology — 3 replicas. PodDisruptionBudget is emitted separately via
  # umbrella template `openfga-pdb.yaml` (upstream chart schema rejects
  # `podDisruptionBudget` as additional property — see networkpolicy-authz).
  replicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  # Playground DISABLED on prod (the in-browser tuple editor exposes Check
  # endpoint without RBAC — must never be reachable from public ingress).
  playground:
    enabled: false
  ingress:
    enabled: false
  # Telemetry: scrape /metrics endpoint via ServiceMonitor (Phase 11 deploys
  # Prometheus). Tracing — OTLP to kacho-otel-collector (Phase 11).
  telemetry:
    trace:
      enabled: true
      otlp:
        endpoint: http://kacho-otel-collector.kacho-system.svc.cluster.local:4317
    metrics:
      enabled: true

# KAC-127 Phase 3: PDB for OpenFGA engine (HA-mode reliability primitive).
openfgaPdb:
  enabled: true
  minAvailable: 2

# KAC-127: zitadelOidcBootstrap удалён — OIDC через Ory Hydra.
kratosSelfServiceUI:
  enabled: false        # Phase 2 — UI from kacho-ui repo, не selfservice-stock.

# ─── KAC-127 Phase 3: openfga-bootstrap-job — enabled on prod ──────────
openfgaBootstrap:
  enabled: true
  # KAC-127 (deploy#38): alpine/k8s несёт kubectl+jq+curl+coreutils,
  # бежит root → bootstrap-скрипту не нужен runtime apk add.
  image: alpine/k8s:1.29.2
  # cliImage больше не используется — KAC-127 (deploy#38): init-container
  # `dsl-transform` удалён, DSL→JSON transform на commit-time.
  cliImage: ""
  storeName: kacho-store
  authorizationModelConfigMap: openfga-model-stub
  modelIdSecretName: openfga-model-id
  clusterSingletonId: cluster_kacho_root
  # Prod: explicit DB bootstrap Job runs against shared Postgres operator
  # (CloudNativePG / RDS) that does NOT auto-create per-tenant databases.
  # If the cluster uses bitnami pg-openfga (auto-init), keep this disabled.
  initDatabase: true
  dbAdmin:
    image: postgres:16-alpine
    host: kacho-umbrella-pg-openfga
    port: "5432"
    user: postgres
    # External-secrets-operator populates this Secret at deploy time from
    # vault path `secret/kacho/prod/pg-openfga/admin`.
    passwordSecretName: pg-openfga-admin-credentials
    passwordSecretKey: password
    fgaUser: openfga
    fgaPasswordSecretName: pg-openfga-credentials
    fgaPasswordSecretKey: password
    fgaDatabase: kacho_openfga

# ─── KAC-127 Phase 3: OPA sidecar pipeline (production) ────────────────
# Enabled on prod with NetworkPolicy ON. OPA sidecars require the JWKS public
# key ConfigMap to be populated by the Phase 2 JWKS rotator before they can
# verify bundle signatures (fail-closed: unsigned/tampered bundle == OPA refuses
# to load, request denied).
opaSidecar:
  enabled: true
  image: openpolicyagent/opa:1.0.0-rootless
  logLevel: warn      # info on dev, warn on prod (decision-log noise reduction)
  iamInternalHost: kacho-umbrella-iam-internal
  iamInternalPort: 9091
  bundleResource: bundle.tar.gz
  bundlePollMinSec: 3000   # ~50min (prod: long jitter window)
  bundlePollMaxSec: 3900   # ~65min
  signingKeyId: kacho-iam-signing-key-current
  bundle:
    ttlSeconds: 3600
    signingAlgorithm: ES256
    signingKeyKid: kacho-iam-signing-key-current
    buildShaEnvVar: KACHO_BUILD_SHA
    cacheStaleAfterSeconds: 7200
    keyRotationGraceSeconds: 7200
  jwks:
    configMapName: kacho-iam-jwks
    bootstrapKeyPem: ""    # populated by JWKS rotator at runtime.
  # Defense-in-depth NetworkPolicy — REQUIRED on prod (acceptance §5.7).
  networkPolicy:
    enabled: true
    iamPodSelector:
      matchLabels:
        app.kubernetes.io/name: kacho-iam
    openfgaPodSelector:
      matchLabels:
        app.kubernetes.io/name: openfga
    apiGatewayPodSelector:
      matchLabels:
        app: api-gateway
    backendPodSelector:
      matchExpressions:
        - key: app
          operator: In
          values: [vpc, compute, loadbalancer]

# Sub-chart propagation note: opaSidecar + openfgaBootstrap.modelIdSecretName
# are propagated to kacho-iam sub-chart via the kacho-iam.opaSidecar / .openfgaBootstrap
# blocks above (inside the kacho-iam: top-level mapping). Duplicate top-level
# `kacho-iam:` block would last-wins-overwrite — see KAC-127 PR review.

# ─── KAC-127 Phase 9 — Audit pipeline (sub-phase 3.9) production overrides ─
#
# Production требует:
#   - audit.enabled=true + audit.siem.enabled=true
#   - kafka.enabled=true + clickhouse.enabled=true + kafka-connect.enabled=true
#   - hsm.provider != softhsm (compliance: SOC2 / FedRAMP / ISO 27001
#     требуют FIPS 140-2 Level 3+ HSM; SoftHSM приемлем ТОЛЬКО для dev/CI).
#   - s3.bucket configured per-environment (e.g. `kacho-audit-eu-central-1-prod`)
#   - networkPolicy.enabled=true с правильными hsmEndpoints CIDR'ами.
#
# Domain пробрасывается через CI/CD `--set kacho.domain=...` (см. line 36).
#
# ⚠ PROD CHECKLIST:
#   [ ] audit.s3.bucket — override per-region (НЕ хардкод в values.yaml)
#   [ ] audit.hsm.provider — НЕ softhsm; library + slot + token + key labels — корректны
#   [ ] audit.hsm.pinSecret — Secret создан externally (sealed-secrets / vault)
#   [ ] audit.networkPolicy.hsmEndpoints — CIDR'ы HSM cluster ENI
#   [ ] audit.siem.* providers — токены в Secret'ах (external-secrets)
#   [ ] kafka.cluster.brokers >= 3 + cluster.storage.size adequate for 7d retention
#   [ ] clickhouse.cluster.shards >= 2 + replicas >= 2 (HA)

kafka:
  enabled: true
# clickhouse subchart inherits umbrella audit.s3.* через explicit mirror
# (Helm не пропагирует top-level audit.* в subchart автоматически).
clickhouse:
  enabled: true
  backup:
    s3:
      bucket: "kacho-audit-cold-prod"
      endpoint: ""
      region: eu-central-1
# kafka-connect S3 sink — propagate umbrella audit.s3.*.
kafka-connect:
  enabled: true
  s3:
    bucket: "kacho-audit-cold-prod"
    endpoint: ""
    region: eu-central-1

audit:
  enabled: true
  # 5-min schedule per P9-D7 (рекомендуется не менять).
  merkleBatchSchedule: "*/5 * * * *"
  verifierSchedule: "0 2 * * *"
  s3:
    # Per-environment bucket — override via CI/CD --set.
    bucket: "kacho-audit-cold-prod"
    endpoint: ""    # AWS S3 default (region-based endpoint)
    region: eu-central-1
  retention:
    hot: 90d
    warmStandard: 30d
    warmIA: 1y
    cold: 10y
  hsm:
    # PRODUCTION: change to awscloudhsm / gcpcloudhsm / azurekv / thalesluna
    # per-environment.
    provider: awscloudhsm
    libraryPath: /opt/cloudhsm/lib/libcloudhsm_pkcs11.so
    slot: 0
    tokenLabel: kacho-audit-signing
    keyLabel: kacho-audit-merkle-2026
    signingAlgorithm: ECDSA-P384-SHA384
    pinSecret: kacho-iam-hsm-pin  # ExternalSecret → vault
  siem:
    enabled: true
    replicas: 3   # HA — survives single-pod failure
    autoDisableThreshold: 5
    rateLimitEventsPerSec: 100
    datadog:
      enabled: true
    splunk:
      enabled: true
    elastic:
      enabled: true
    genericWebhook:
      enabled: true
  networkPolicy:
    enabled: true
    # CIDR'ы HSM cluster ENI — override per-region.
    hsmEndpoints:
      - cidr: "10.100.0.0/24"   # пример AWS CloudHSM CIDR
        port: 2223
      - cidr: "10.100.0.0/24"
        port: 2224
      - cidr: "10.100.0.0/24"
        port: 2225
  prometheusRules:
    enabled: true

# Propagate audit overrides into kacho-iam sub-chart.
kacho-iam:
  audit:
    enabled: true
    merkleBatchSchedule: "*/5 * * * *"
    verifierSchedule: "0 2 * * *"
    s3:
      bucket: "kacho-audit-cold-prod"
      endpoint: ""
      region: eu-central-1
    retention:
      hot: 90d
      warmStandard: 30d
      warmIA: 1y
      cold: 10y
    hsm:
      provider: awscloudhsm
      libraryPath: /opt/cloudhsm/lib/libcloudhsm_pkcs11.so
      slot: 0
      tokenLabel: kacho-audit-signing
      keyLabel: kacho-audit-merkle-2026
      signingAlgorithm: ECDSA-P384-SHA384
      pinSecret: kacho-iam-hsm-pin
    siem:
      enabled: true
      replicas: 3
    networkPolicy:
      enabled: true
      hsmEndpoints:
        - cidr: "10.100.0.0/24"
          port: 2223
        - cidr: "10.100.0.0/24"
          port: 2224
        - cidr: "10.100.0.0/24"
          port: 2225
    prometheusRules:
      enabled: true

# ─── KAC-127 Phase 10 — SPIFFE/SPIRE + Cilium mesh + cosign ─────────────
# PROD enabled: full SPIRE HA + Cilium eBPF mesh + cosign enforce.
# Trust domain — prod-eu-central uses `kacho.cloud`.

spiffe:
  trustDomain: kacho.cloud
  clusterName: kacho-prod-eu-central

pg-spire:
  enabled: true
  global:
    postgresql:
      auth:
        username: spire
        database: kacho_spire
  primary:
    persistence:
      size: 50Gi
  # anti-affinity per node (HA).
  primary:
    podAntiAffinityPreset: hard

spire-server:
  enabled: true
  trustDomain: kacho.cloud
  replicaCount: 3
  ca:
    plugin: pkcs11
    ttlHours: 168
    defaultSvidTtlSeconds: 3600
    pkcs11:
      # AWS CloudHSM library в production.
      libraryPath: "/opt/cloudhsm/lib/libcloudhsm_pkcs11.so"
      slot: 0
      tokenLabel: "kacho-spire-root"
      keyLabel: "kacho-spire-ca-2026"
      pinSecretName: "spire-server-hsm-pin"
      pinSecretKey: "pin"
  dataStore:
    connectionString: "host=kacho-umbrella-pg-spire port=5432 user=spire dbname=kacho_spire sslmode=require"
    initDatabase: true
  federation:
    bundleEndpoint:
      profile: "https_spiffe"
    ingress:
      enabled: true
      host: "spire.kacho.cloud"
      certIssuer: "letsencrypt-prod"
  podAntiAffinity:
    enabled: true
    type: required
    topologyKey: "topology.kubernetes.io/zone"  # per-AZ anti-affinity
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  networkPolicy:
    enabled: true
    hsmEndpoints:
      - cidr: "10.100.0.0/24"
        port: 2223
      - cidr: "10.100.0.0/24"
        port: 2224
      - cidr: "10.100.0.0/24"
        port: 2225
  serviceMonitor:
    enabled: true

spire-agent:
  enabled: true
  trustDomain: kacho.cloud
  serverAddress: "kacho-umbrella-spire-server-headless.spire-system.svc.cluster.local"
  attestors:
    k8s:
      enabled: true
      audience: "spire-server"
    unix:
      enabled: true
    cosign:
      enabled: true
      # Production: kacho-platform team key fingerprint.
      # Override via ExternalSecrets in real prod.
      trustedSigners:
        - "kacho-platform-team-2026"
  serviceMonitor:
    enabled: true

cilium:
  enabled: true
  spiffe:
    trustDomain: kacho.cloud
    spireServerAddress: "kacho-umbrella-spire-server.spire-system.svc.cluster.local:8081"
  serviceMesh:
    enabled: true
    authenticationMode: "required"   # enforce — drop traffic without SPIFFE auth
  encryption:
    enabled: true
    type: "wireguard"
    nodeEncryption: true
  kubeProxyReplacement: "strict"
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
      ingress:
        enabled: true
        host: "hubble.kacho.cloud"
        certIssuer: "letsencrypt-prod"
        annotations:
          # OIDC через Hydra — admin-only.
          nginx.ingress.kubernetes.io/auth-url: "https://hydra.kacho.cloud/oauth2/sessions/whoami"
          nginx.ingress.kubernetes.io/auth-signin: "https://hydra.kacho.cloud/oauth2/auth"
    exporter:
      enabled: true
      otlpEndpoint: "otel-collector.observability.svc.cluster.local:4317"
  cosign:
    enabled: true
    secretName: "cilium-cosign-public-key"
    secretKey: "cosign.pub"
  mtlsEnforcePolicy:
    enabled: true
  grafanaDashboards:
    enabled: true

cosign-policy-controller:
  enabled: true
  enforcedNamespaces:
    - kacho-system
  warnNamespaces:
    - kube-system
  cosign:
    secretName: "cosign-trusted-key"
    secretKey: "cosign.pub"
  fulcio:
    enabled: false  # offline-key signing required in prod (P10-D10)
  # KAC-127 Phase 11 — SBOM + SLSA L3 verification extensions.
  sbom:
    required: true
    acceptedFormats:
      - "spdx-json"
      - "cyclonedx-json"
  slsa:
    required: true
    predicateType: "https://slsa.dev/provenance/v1"
    minimumLevel: 3
    builderId: "https://github.com/actions/runner"

spiffe-csi-driver:
  enabled: true

# ─── KAC-127 Phase 11 — Production deploy + Observability ──────────────
# All Phase 11 charts enabled in prod. Tenant-specific overrides
# (cloudflare.zone / cloudflare.accountId / region IPs / etc.) come via
# clusters/<cluster>/overrides.yaml — see docs/deploy-production.md §1.

# Phase 11: Sealed-Secrets for GitOps-safe secret commits.
sealedSecrets:
  enabled: true
  replicas: 2
  keyRenewPeriod: "720h"                  # 30d key rotation

# Phase 11: Cloudflare edge configuration (WAF + DDoS + rate-limit + Access).
cloudflare-config:
  enabled: true
  kacho:
    domain: "api.kacho.cloud"              # pass-through; CI/CD overrides per-tenant
  cloudflare:
    # zone + accountId — REQUIRES per-tenant override via clusters/<cluster>/overrides.yaml.
    zone: "kacho.cloud"
    accountId: ""                          # set via --set or overrides file
    crossplane:
      enabled: true
    waf:
      managed:
        owaspCrs:
          enabled: true
          sensitivity: medium
          action: block                    # promoted from simulate after 24h soak
        cloudflareSpecials:
          enabled: true
          action: block
    rateLimit:
      enabled: true
    botManagement:
      enabled: true
    ddos:
      enabled: true
    access:
      enabled: true

# Phase 11: cert-manager Let's Encrypt configuration.
cert-manager-config:
  enabled: true
  kacho:
    domain: "api.kacho.cloud"
  certManager:
    acmeEmail: "platform@kacho.cloud"
    issuers:
      prod:
        enabled: true
      staging:
        enabled: false                     # prod env doesn't use staging issuer

# Phase 11: Argo CD HA GitOps.
argo-cd:
  enabled: true
  kacho:
    domain: "api.kacho.cloud"
  argoCd:
    ha:
      enabled: true
      replicas: 3
    oidc:
      issuer: "https://hydra.kacho.cloud"
      clientId: "argocd"
    notifications:
      enabled: true
      slack:
        enabled: true
        defaultChannel: "kacho-deploy"
      pagerduty:
        enabled: true
    rollouts:
      enabled: true

# Phase 11: Multi-region active-active.
multi-region-router:
  enabled: true
  kacho:
    domain: "api.kacho.cloud"
  multiRegion:
    regions:
      - name: prod-eu-central
        enabled: true
        priority: 1
        weight: 50
        originIP: ""                       # set via CI/CD at install time
        healthCheck: { path: "/healthz", port: 443, intervalSeconds: 30, retries: 2, timeoutSeconds: 10 }
        cloudProvider: "aws"
        region: "eu-central-1"
      - name: prod-eu-west
        enabled: true
        priority: 2
        weight: 50
        originIP: ""
        healthCheck: { path: "/healthz", port: 443, intervalSeconds: 30, retries: 2, timeoutSeconds: 10 }
        cloudProvider: "aws"
        region: "eu-west-1"
    failover:
      rtoMinutes: 15
      rpoMinutes: 1
      automatic: true
    loadBalancer:
      name: "kacho-api-lb"
      zone: "kacho.cloud"
      proxied: true

# Phase 11: Observability stack (OTel + Tempo + Mimir + Loki + Grafana +
# Sloth + AlertManager). Full multi-region routing via cross-region S3.
observability:
  enabled: true
  kacho:
    domain: "api.kacho.cloud"
  observability:
    namespace: "observability-system"
    otelCollector:
      daemonSet: { enabled: true }
      deployment: { enabled: true, replicas: 3 }
      sampling:
        controlPlane: 1.0
        dataPlane: 0.05
        errorRate: 1.0
    tempo:
      replicas: 2
    mimir:
      replicas:
        ingester: 3
        querier: 3
        storeGateway: 3
        compactor: 1
        ruler: 2
    loki:
      replicas:
        ingester: 3
        querier: 3
        distributor: 3
    grafana:
      replicas: 2
      oidc:
        enabled: true
        issuer: "https://hydra.kacho.cloud"
        clientId: "grafana"
        allowedDomains: "kacho.cloud"
    alertmanager:
      replicas: 3
      pagerduty:
        enabled: true
        severityRouting:
          P1: critical
          P2: error
          P3: warning
          P4: info
      slack:
        enabled: true
    sloth:
      enabled: true

# ─── KAC-NLB: kacho-nlb production block ────────────────────────────────
#
# Multi-region HA — 3 replicas; image from DockerHub, tag injected by CD
# pipeline (${KACHO_IMAGE_TAG}). `config.mode=production` activates the
# strict config-validation in kacho-nlb (forbids breakglass=true, requires
# listenInvalidator.iamDsn when enabled, etc.). networkPolicy enabled to
# match vpc/compute prod posture. FGA endpoint pre-populated for the same
# OpenFGA store the rest of the stack writes into; storeId / modelId are
# loaded by the openfga-bootstrap-job into the `openfga-model-id` Secret
# (Phase 3 contract — kacho-nlb consumes them via env-substitution).
kacho-nlb:
  enabled: true
  replicas: 3
  image:
    repository: docker.io/prorobotech/kacho-nlb
    tag: "${KACHO_IMAGE_TAG}"
    pullPolicy: Always
  db:
    host: kacho-umbrella-pg-nlb
    port: 5432
    user: kacho_nlb
    name: kacho_nlb
    sslmode: require
    # CD-pipeline supplies the externally-managed Secret name (external-secrets
    # -operator → vault path `secret/kacho/prod/pg-nlb/credentials`). bitnami
    # pg-nlb defaults its own Secret to `<release>-pg-nlb`; keep the same name
    # so the chart's `existingSecret` short-circuits the internal Secret render
    # (helm/umbrella/charts/kacho-nlb/templates/secret.yaml has
    # `{{- if not .Values.db.existingSecret -}}` guard).
    existingSecret: kacho-umbrella-pg-nlb
    existingSecretKey: password
  peers:
    iam:
      addr: ""
      internalAddr: kacho-iam-internal.kacho.svc.cluster.local:9091
      tls: false
      dialDuration: 10s
    vpc:
      addr: vpc.kacho.svc.cluster.local:9090
      internalAddr: vpc.kacho.svc.cluster.local:9091
      tls: false
      dialDuration: 10s
    compute:
      addr: compute.kacho.svc.cluster.local:9090
      internalAddr: ""
      tls: false
      dialDuration: 10s
  authz:
    iam:
      addr: kacho-iam-internal.kacho.svc.cluster.local:9091
      dialDeadline: 3s
      requestTimeout: 500ms
  config:
    mode: production
    logger:
      level: INFO
    apiServer:
      gracefulShutdown: 10s
      grpcGwEnable: false
    authn:
      type: none
    authz:
      cache:
        enable: true
        ttl: 5s
        size: 10000
      listenInvalidator:
        enable: true
        channel: kacho_iam_subjects
        # CD-pipeline overrides per cluster via --set or external-secrets.
        iamDsn: ""
      breakglass: false
    fga:
      endpoint: kacho-umbrella-openfga:8080
      storeId: ""
      modelId: ""
      tupleWrite:
        timeout: 2s
        maxRetries: 3
    jobs:
      targetDrain:
        interval: 10s
  migrator:
    enable: true
  networkPolicy:
    enable: true
  serviceMonitor:
    enable: true
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 2Gi

# Phase 11: Postgres HA via CloudNativePG / Patroni.
postgres-ha:
  enabled: true
  postgresHa:
    defaults:
      replicas: 3
      syncStandbyCount: 1
      storageSize: "50Gi"
      backup:
        enabled: true
        schedule: "0 2 * * *"
        retentionDays: 30
      tls:
        enabled: true
        issuer: "letsencrypt-prod"
