# Kachō umbrella — production overrides (KAC-127 Phase 2).
#
# Этот файл задаёт production defaults поверх values.yaml/values.dev.yaml.
# Применяется через:
#   helm upgrade kacho ./helm/umbrella \
#       -f values.yaml -f values.prod.yaml \
#       --set kacho.domain=api.kacho.cloud
#
# Per-cluster (multi-tenant) overrides — отдельные overrides.yaml под
# clusters/<cluster>/, которые override'ят `kacho.domain` под конкретный tenant.
#
# ─── KAC-127 IMPORTANT — domain interpolation ──────────────────────────
#
# Helm sub-chart values (как hydra.hydra.config.urls.*) НЕ проходят через
# template-evaluation pass перед передачей в sub-chart — поэтому строки вида
# `{{ .Values.kacho.domain }}` тут работать НЕ будут (sub-chart их получит
# verbatim).
#
# Решение: для каждого URL'а указываем явное значение, **которое CI/CD генерирует
# через envsubst / yq из template-source-файла** перед `helm install`. Либо —
# Phase 2 production deploy использует свой собственный ConfigMap вместо
# sub-chart-провайденного (см. charts/kacho-iam/templates/kratos-config-configmap.yaml
# — он рендерится через template и поэтому может использовать `{{ .Values.kacho.domain }}`).
#
# Sub-chart-провайденный Hydra config мы заменяем на standalone ConfigMap-mount
# в Phase 2 production (см. README раздел deployment). Этот файл задаёт **только
# `enabled`-флаги + DSN-paths**; полная config-структура — в standalone
# ConfigMap'ах под `templates/`.
#
# Для prod-only / customer-managed deploy domain нужно подставлять CD-pipeline'у;
# на этапе KAC-127 в values.prod.yaml выписаны эталонные prod-defaults для
# `api.kacho.cloud`, но любой downstream может их override'нуть через `--set`.

# ─── Domain (default = api.kacho.cloud; override через --set kacho.domain=…) ─
kacho:
  domain: api.kacho.cloud

# ─── Hydra production block ────────────────────────────────────────────
# Включаем Hydra в prod; остальной config приходит из standalone ConfigMap
# (см. charts/kacho-iam/templates/ — Phase 2 controls Hydra config через
# kacho-iam-managed mount, не через sub-chart-defaults).
hydra:
  enabled: true
  hydra:
    automigration:
      enabled: true
      type: job
    dev: false
    # Hydra-pod env переопределяется через раздел `deployment.environment`
    # sub-chart'а — там подсасываем `secretKeyRef` для DSN, system secret,
    # KACHO_IAM_HOOK_TOKEN из external-secrets-managed Secret.
    # `config.*` URLs — выставляются CD-pipeline через `--set hydra.hydra.config.urls.*`.
    config:
      # DSN — из external-secrets `kacho-hydra-db`.
      dsn: "${HYDRA_DSN}"
      serve:
        public:
          cors:
            enabled: true
            # Allowed origins — UI subdomain под текущим kacho.domain.
            # CD pipeline override'ит через --set:
            #   --set "hydra.hydra.config.serve.public.cors.allowed_origins[0]=https://app.api.kacho.cloud"
            allowed_origins:
              - "https://app.api.kacho.cloud"
      urls:
        self:
          # Prod issuer — должен быть HTTPS + matchнутый с TLS-cert для разъёма
          # `iss` claim. CD-pipeline override'ит:
          #   --set "hydra.hydra.config.urls.self.issuer=https://hydra.${KACHO_DOMAIN}"
          public: "https://hydra.api.kacho.cloud"
          issuer: "https://hydra.api.kacho.cloud"
        consent: "https://app.api.kacho.cloud/oauth/consent"
        login: "https://app.api.kacho.cloud/oauth/login"
        logout: "https://app.api.kacho.cloud/oauth/logout"
        error: "https://app.api.kacho.cloud/auth/error"
        post_logout_redirect: "https://app.api.kacho.cloud/"
        identity_provider:
          publicly_writable: false
      secrets:
        system: ["${HYDRA_SYSTEM_SECRET}"]
        cookie: ["${HYDRA_COOKIE_SECRET}"]
      strategies:
        access_token: jwt
        jwt:
          scope_claim: list
      ttl:
        access_token: 15m
        refresh_token: 720h
        id_token: 15m
        auth_code: 1m
      oauth2:
        expose_internal_errors: false   # prod — НЕ leak'ить internal errors.
        pkce:
          enforced: true
          enforced_for_public_clients: true
        grant:
          jwt:
            iat_optional: false
            jti_optional: false
            max_ttl: 720h
          authorization_code:
            require_pkce: true
            ttl: 1m
        refresh_token_rotation: true
        refresh_token_rotation_grace_period: 1s
        refresh_token_grant_skip_token_binding_validation: false
        exclude_not_before_claim: false
        allowed_top_level_claims:
          - ext_claims
        client_credentials:
          default_grant_allowed_scope: false
        dpop:
          enabled: true
          signing_algorithms: [ES256, EdDSA]
          iat_skew_tolerance: 60s
        mtls:
          enabled: true
          cnf_thumbprint_algorithm: SHA-256
        token_hook:
          url: "http://kacho-iam.kacho.svc.cluster.local:9091/iam/v1/hooks/token"
          auth:
            type: api_key
            config:
              in: header
              name: X-Kacho-Hook-Token
              value: ${KACHO_IAM_HOOK_TOKEN}
        refresh_token_hook:
          url: "http://kacho-iam.kacho.svc.cluster.local:9091/iam/v1/hooks/refresh"
          auth:
            type: api_key
            config:
              in: header
              name: X-Kacho-Hook-Token
              value: ${KACHO_IAM_HOOK_TOKEN}
      webfinger:
        jwks:
          broadcast_keys:
            - hydra.openid.id-token
      log:
        level: info
        format: json
        leak_sensitive_values: false   # prod — обязательно false (security).
      tracing:
        provider: otel
        providers:
          otlp:
            endpoint: otel-collector.observability.svc.cluster.local:4317
            insecure: false

# ─── Kratos production block ───────────────────────────────────────────
# Включаем Kratos в prod. Config-source — standalone ConfigMap
# (kratos-config-configmap.yaml) с template-interpolated `kacho.domain`.
# Sub-chart `kratos.kratos.config.*` оставляем минимальным — только DSN
# и automigration; полный config приходит из mounted ConfigMap.
kratos:
  enabled: true
  kratos:
    development: false
    automigration:
      enabled: true
    config:
      dsn: "${KRATOS_DSN}"
      # Остальные ключи (selfservice / methods / hooks / RP-id) — в standalone
      # ConfigMap charts/kacho-iam/templates/kratos-config-configmap.yaml, который
      # mount'ится в pod на /etc/config/kratos/kratos.yaml. Kratos sub-chart
      # `extraVolumeMounts` указывает на этот ConfigMap.
      log:
        level: info
        format: json
        leak_sensitive_values: false

# ─── Keto production block ──────────────────────────────────────────────
keto:
  enabled: true
  keto:
    config:
      dsn: "${KETO_DSN}"
      log:
        level: info
        format: json
    automigration:
      enabled: true
      type: initContainer

# ─── Postgres sub-charts: prod-режим (persistence enabled) ─────────────
# В prod нужны PV / production-grade-resource-limits. Здесь — overlay для
# pg-iam / pg-hydra / pg-kratos / pg-keto; остальные (pg-vpc / pg-compute /
# pg-zitadel / pg-openfga) — отдельный values.prod.yaml блок (вне scope KAC-127).
pg-iam:
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""        # CD-pipeline override'ит per-cluster.
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: 4, memory: 4Gi }

pg-hydra:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: 4, memory: 4Gi }

pg-kratos:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: ""
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits:   { cpu: 2, memory: 2Gi }

pg-keto:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: ""
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits:   { cpu: 2, memory: 2Gi }

# ─── kacho-iam production block ────────────────────────────────────────
kacho-iam:
  replicas: 3
  image:
    repository: kacho-iam
    tag: "${KACHO_IAM_TAG}"     # CD-pipeline injectit конкретный SHA.
    pullPolicy: IfNotPresent
  config:
    logger:
      level: INFO
    repository:
      postgres:
        maxConns: 200
        sslMode: require
    authn:
      mode: prod
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 2Gi

# ─── VPC sub-chart prod overrides ──────────────────────────────────────
# В prod включаем admin networkpolicy (запрет любого pod→:9091 кроме admin-pods).
vpc:
  networkPolicy:
    enabled: true
    # Override per-cluster — labels admin-pods, которым разрешён доступ к :9091.
    adminPodsSelector:
      matchLabels:
        kacho.cloud/role: admin

# ─── Dev-only компоненты — disabled в prod ─────────────────────────────
mailhog:
  enabled: false
zitadel:
  enabled: false        # KAC-115: Zitadel заменён на Ory stack (Kratos + Hydra).
openfga:
  enabled: false        # KAC-119: OpenFGA заменён на Keto в prod.
zitadelOidcBootstrap:
  enabled: false
kratosSelfServiceUI:
  enabled: false        # Phase 2 — UI from kacho-ui repo, не selfservice-stock.
openfgaBootstrap:
  enabled: false
