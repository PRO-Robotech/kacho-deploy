{{- if .Values.argoCd.notifications.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "argocd-notifications-cm"
  namespace: {{ .Values.argoCd.namespace | quote }}
  labels:
    kacho.cloud/component: argocd-notifications
data:
  context: |
    argocdUrl: https://argocd.{{ .Values.kacho.domain }}
  service.slack: |
    token: $slack-token
  service.pagerduty: |
    serviceKeys:
      kacho-iam: $pagerduty-key
  trigger.on-sync-failed: |
    - description: "Sync operation failed"
      send:
        - slack-message
        - pagerduty-notify
      when: app.status.operationState.phase in ['Error', 'Failed']
  trigger.on-sync-succeeded: |
    - description: "Sync operation succeeded"
      send:
        - slack-message
      when: app.status.operationState.phase in ['Succeeded']
  trigger.on-health-degraded: |
    - description: "Application became degraded"
      send:
        - slack-message
        - pagerduty-notify
      when: app.status.health.status == 'Degraded'
  template.slack-message: |
    message: |
      Application *{{ "{{.app.metadata.name}}" }}* ({{ "{{.app.spec.destination.namespace}}" }}/{{ "{{.app.spec.destination.server}}" }})
      is now {{ "{{.app.status.sync.status}}" }}/{{ "{{.app.status.health.status}}" }}.
      See https://argocd.{{ .Values.kacho.domain }}/applications/{{ "{{.app.metadata.name}}" }} for details.
    slack:
      attachments: |
        [{
          "title": "{{ "{{.app.metadata.name}}" }}",
          "title_link": "https://argocd.{{ .Values.kacho.domain }}/applications/{{ "{{.app.metadata.name}}" }}",
          "color": "#7B68EE",
          "fields": [
            {"title": "Sync", "value": "{{ "{{.app.status.sync.status}}" }}", "short": true},
            {"title": "Health", "value": "{{ "{{.app.status.health.status}}" }}", "short": true}
          ]
        }]
  template.pagerduty-notify: |
    pagerduty:
      serviceKey: $pagerduty-key
      summary: "ArgoCD: Application {{ "{{.app.metadata.name}}" }} is degraded"
      severity: "error"
      source: "kacho-argocd"
      customDetails: |
        {
          "service":     "{{ "{{.app.metadata.name}}" }}",
          "namespace":   "{{ "{{.app.spec.destination.namespace}}" }}",
          "cluster":     "{{ "{{.app.spec.destination.server}}" }}",
          "sync_status": "{{ "{{.app.status.sync.status}}" }}",
          "health":      "{{ "{{.app.status.health.status}}" }}"
        }
  subscriptions: |
    - recipients:
        - slack:{{ .Values.argoCd.notifications.slack.defaultChannel }}
      triggers:
        - on-sync-failed
        - on-sync-succeeded
        - on-health-degraded
    - recipients:
        - pagerduty:kacho-iam
      triggers:
        - on-sync-failed
        - on-health-degraded
      selector: kacho.cloud/environment in (prod-eu-central, prod-eu-west)
{{- end }}
