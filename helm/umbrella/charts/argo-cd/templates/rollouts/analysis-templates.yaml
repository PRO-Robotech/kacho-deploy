{{- if .Values.argoCd.rollouts.enabled }}
{{- range .Values.argoCd.rollouts.canary.analysis.templates }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .name | quote }}
  namespace: "kacho-system"
  labels:
    kacho.cloud/component: argo-rollouts-analysis
spec:
  args:
    - name: "service-name"
  metrics:
    - name: {{ .name | quote }}
      interval: "30s"
      count: 10
      successCondition: {{ .successCondition | quote }}
      failureLimit: {{ .failureLimit }}
      provider:
        prometheus:
          address: "http://mimir.observability-system.svc.cluster.local:9090"
          query: |
            {{- if eq .name "slo-burn-rate-5m" }}
            (
              1 - (
                sum(rate(grpc_server_handled_total{
                  service="{{ "{{" }}args.service-name{{ "}}" }}",
                  code!~"OK|Canceled|InvalidArgument|NotFound"
                }[5m]))
                /
                sum(rate(grpc_server_handled_total{service="{{ "{{" }}args.service-name{{ "}}" }}"}[5m]))
              )
            ) / 0.0005
            {{- else if eq .name "error-rate-canary-vs-stable" }}
            (
              sum(rate(grpc_server_handled_total{
                service="{{ "{{" }}args.service-name{{ "}}" }}",
                kacho_cloud_canary="true",
                code!~"OK|Canceled|InvalidArgument|NotFound"
              }[5m]))
              /
              sum(rate(grpc_server_handled_total{
                service="{{ "{{" }}args.service-name{{ "}}" }}",
                kacho_cloud_canary="true"
              }[5m]))
            ) / (
              sum(rate(grpc_server_handled_total{
                service="{{ "{{" }}args.service-name{{ "}}" }}",
                kacho_cloud_canary="false",
                code!~"OK|Canceled|InvalidArgument|NotFound"
              }[5m]))
              /
              sum(rate(grpc_server_handled_total{
                service="{{ "{{" }}args.service-name{{ "}}" }}",
                kacho_cloud_canary="false"
              }[5m]))
            )
            {{- else if eq .name "latency-canary-vs-stable" }}
            histogram_quantile(0.95,
              sum(rate(grpc_server_handling_seconds_bucket{
                service="{{ "{{" }}args.service-name{{ "}}" }}",
                kacho_cloud_canary="true"
              }[5m])) by (le)
            )
            /
            histogram_quantile(0.95,
              sum(rate(grpc_server_handling_seconds_bucket{
                service="{{ "{{" }}args.service-name{{ "}}" }}",
                kacho_cloud_canary="false"
              }[5m])) by (le)
            )
            {{- end }}
{{- end }}
{{- end }}
