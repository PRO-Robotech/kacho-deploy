{{- if .Values.argoCd.rollouts.enabled }}
{{- range .Values.argoCd.rollouts.services }}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ printf "%s-canary" .name | quote }}
  namespace: "kacho-system"
  labels:
    kacho.cloud/component: argo-rollouts
    kacho.cloud/service: {{ .name | quote }}
spec:
  replicas: 3
  strategy:
    canary:
      maxSurge: "25%"
      maxUnavailable: 0
      stableService: {{ printf "%s-stable" .name | quote }}
      canaryService: {{ printf "%s-canary" .name | quote }}
      trafficRouting:
        nginx:
          stableIngress: {{ printf "%s-ingress" .name | quote }}
      steps:
        {{- range $.Values.argoCd.rollouts.canary.steps }}
        - setWeight: {{ .setWeight }}
        {{- if .pauseDuration }}
        - pause:
            duration: {{ .pauseDuration | quote }}
        {{- end }}
        {{- end }}
      analysis:
        templates:
          {{- range $.Values.argoCd.rollouts.canary.analysis.templates }}
          - templateName: {{ .name | quote }}
          {{- end }}
        startingStep: 1                    # start analysis at 25% step
        args:
          - name: "service-name"
            value: {{ .name | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name | quote }}
        kacho.cloud/canary: "rolloutable"
    spec:
      containers:
        - name: {{ .name | quote }}
          image: "kacho/{{ .name }}:placeholder"   # overridden by app sync
          ports:
            - containerPort: 9090
              name: grpc
            - containerPort: 8080
              name: http
{{- end }}
{{- end }}
