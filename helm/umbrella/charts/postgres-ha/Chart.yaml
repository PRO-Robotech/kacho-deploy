apiVersion: v2
name: postgres-ha
version: 0.1.0
description: |
  KAC-127 Phase 11 — Patroni-managed Postgres HA per service. 3 nodes per cluster
  (primary + sync standby + DR replica), WAL archival to S3 with PITR 30d,
  pgbouncer in front, pgBackRest weekly full + daily incremental backup.
  Configurable: clusters[].{name, replicas, storage, backup.s3.bucket, region}.
  RTO ≤ 15min via patroni auto-failover.
type: application
