# Kafka KRaft subchart — defaults (KAC-127 Phase 9).
# Override per-cluster через umbrella values.yaml `kafka: { ... }`.
#
# Дизайн по acceptance §2.5 — таблица "Producer config":
#   acks=all, enable.idempotence=true, compression=zstd, linger=20ms,
#   batch.size=131072, max.in.flight=5, transactional.id pattern.
# Broker side: min.insync.replicas=2, unclean.leader.election.enable=false,
#              auto.create.topics.enable=false (topics создаются init-job'ом),
#              retention.ms=604800000 (7d, P9-D4).

# Включает весь Kafka stack. На dev-стенде (kind) можно выключить — drainer
# деградирует в pg_notify-only mode (Phase 8 fallback).
enabled: false

# Operator deployment style:
#   - bitnami:  StatefulSet через bitnami/kafka helm-chart (HEAD-ONLY, vanilla)
#   - strimzi:  Strimzi Kafka CRD (требует Strimzi Operator install в namespace)
#   - vanilla:  raw StatefulSet (без operator) — full DIY, не рекомендуем
# Default — bitnami (broadest compatibility, no CRD dep).
operator: bitnami

# Container image — pin to FIPS-approved digest на prod через external-secrets.
image:
  repository: bitnami/kafka
  tag: 3.7.0-debian-12-r0
  pullPolicy: IfNotPresent

# Cluster topology.
cluster:
  # Mode: combined (KRaft controller+broker в одном pod, dev/staging) или
  # dedicated (controllers и brokers — разные pod'ы, production).
  mode: combined
  # Количество broker'ов. Production: 3 (RF=3, isr=2). Dev: 1 допустим.
  brokers: 3
  # Количество KRaft controller'ов. Production: 3 (consensus quorum).
  # При mode=combined — controllers совпадают с brokers (3 = 3).
  controllers: 3
  # PVC размер per broker. 100Gi per broker → 300Gi total. 7d retention при
  # ~10k events/sec × 2KB avg = 20MB/sec × 86400 × 7 = 12TB raw; zstd ~3x →
  # 4TB compressed cluster → 1.3TB per broker. На dev — 20Gi достаточно.
  storage:
    size: 100Gi
    storageClass: ""  # use default

# Resources per broker (production sizing).
resources:
  requests:
    cpu: 2000m
    memory: 8Gi
  limits:
    cpu: 4000m
    memory: 16Gi

# Anti-affinity: каждый broker на разной k8s ноде. На dev (single-node kind)
# отключить.
affinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

# PodDisruptionBudget — minAvailable=2 (одна нода может уйти в drain без
# потери writes; isr=2 продолжает работать).
pdb:
  enabled: true
  minAvailable: 2

# ─── Listeners / Auth (acceptance §2.5) ───────────────────────────────────
listeners:
  # Internal listener — между broker'ами + между controller'ами.
  internal:
    name: INTERNAL
    port: 9094
    protocol: SSL  # mTLS internal
  # Client listener — для kacho-iam producer / consumer'ов.
  client:
    name: CLIENT
    port: 9092
    protocol: SASL_SSL
    sasl:
      mechanism: SCRAM-SHA-512
  # External listener — opt-in для cross-cluster MirrorMaker.
  external:
    enabled: false
    name: EXTERNAL
    port: 9093
    protocol: SASL_SSL

# TLS configuration. Внешне-управляемые сертификаты через cert-manager или
# external-secrets. Для dev — auto-generate self-signed (внутри chart).
tls:
  # Mode: cert-manager | external-secrets | self-signed
  mode: self-signed
  # Issuer ref для cert-manager mode.
  issuerRef:
    name: kacho-internal-ca
    kind: ClusterIssuer
  # Secret name под external-secrets mode (должен содержать tls.crt, tls.key,
  # ca.crt).
  externalSecretName: kafka-tls-cert

# SCRAM-SHA-512 credentials для producer clients. Создаются init-job'ом
# из Secret'ов (sealed-secrets / external-secrets).
auth:
  # SCRAM users — список (username, passwordSecretRef).
  users:
    - username: kacho-iam-audit-producer
      passwordSecretName: kafka-scram-kacho-iam-audit
      passwordSecretKey: password
    - username: kacho-iam-audit-s3-writer
      passwordSecretName: kafka-scram-kacho-iam-s3-writer
      passwordSecretKey: password
    - username: kacho-iam-audit-siem-forwarder
      passwordSecretName: kafka-scram-kacho-iam-siem-forwarder
      passwordSecretKey: password
    - username: clickhouse-audit-consumer
      passwordSecretName: kafka-scram-clickhouse-audit
      passwordSecretKey: password

# ─── Broker-side topic defaults (acceptance §2.5) ─────────────────────────
brokerConfig:
  defaultReplicationFactor: 3
  minInsyncReplicas: 2
  uncleanLeaderElectionEnable: "false"
  autoCreateTopicsEnable: "false"
  # Compression at broker level (producers могут override).
  compressionType: zstd
  # Quotas (per-client throughput limits).
  quotas:
    producerByteRate: 100000000  # 100MB/sec per client
    consumerByteRate: 200000000  # 200MB/sec per client

# ─── Topics (создаются init-job'ом kafka-topic-init) ──────────────────────
# Соответствует acceptance §2.5 нормативная таблица + P9-D18 per-tenant
# opt-in (shared topic default).
topics:
  - name: kacho-audit-events.shared
    partitions: 64
    replicationFactor: 3
    configs:
      retention.ms: "604800000"        # 7d (P9-D4)
      compression.type: zstd
      min.insync.replicas: "2"
      cleanup.policy: delete
      segment.ms: "3600000"            # 1h segments → faster S3 archive boundary
  - name: kacho-audit-dlq
    partitions: 12
    replicationFactor: 3
    configs:
      retention.ms: "2592000000"       # 30d (forensic on poison messages)
      compression.type: zstd
      min.insync.replicas: "2"
      cleanup.policy: delete
  - name: kacho-caep-events
    partitions: 12
    replicationFactor: 3
    configs:
      retention.ms: "604800000"        # 7d
      compression.type: zstd
      min.insync.replicas: "2"
      cleanup.policy: delete

# ─── MirrorMaker 2.0 — cross-region active-active replication ────────────
# Opt-in через `mirrorMaker.enabled: true`. Используется на Phase 11 (out of
# scope для 9, но values declared заранее для smooth rollout).
mirrorMaker:
  enabled: false
  # Список remote clusters (для каждого создаётся MM2 connect cluster).
  remotes: []
  # Пример:
  #   - name: eu-west-1
  #     bootstrapServers: kafka.eu-west-1.kacho.internal:9092
  #     authSecretRef: kafka-mm2-eu-west-1

# ─── Monitoring ─────────────────────────────────────────────────────────
metrics:
  enabled: true
  # JMX exporter sidecar — Bitnami chart-pattern.
  jmx:
    enabled: true
    port: 5556
  # Kafka Exporter (Prometheus) — отдельный pod, читает __consumer_offsets.
  kafkaExporter:
    enabled: true
    image:
      repository: bitnami/kafka-exporter
      tag: 1.7.0-debian-12-r0
