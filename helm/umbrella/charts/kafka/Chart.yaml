apiVersion: v2
name: kafka
version: 0.1.0
appVersion: "3.7.0"
description: |
  KAC-127 Phase 9 (sub-phase 3.9 IAM Audit Pipeline) — Kafka KRaft cluster
  для kacho-iam audit pipeline.

  Конфигурация по acceptance §2.5, §4.1, D-18 / P9-D2 / P9-D3 / P9-D4:
    - KRaft mode (Kafka 3.7+), без ZooKeeper.
    - 3 brokers + 3 controllers (combined nodes допустимы в dev; prod —
      разделить через `kafka.mode: dedicated`).
    - Anti-affinity per node (HA), PodDisruptionBudget min-available=2.
    - acks=all + min.insync.replicas=2 + idempotent producer →
      exactly-once delivery semantics для audit drainer (P9-D21).
    - TLS internal cluster + SASL/SCRAM-SHA-512 для kacho-iam producer client.
    - Cross-region MirrorMaker 2.0 (active-active) — opt-in via
      `kafka.mirrorMaker.enabled`.

  Topics создаются init-job'ом (kafka-topic-init), не CRD'ями, чтобы umbrella
  оставался vanilla-Helm без Strimzi CRD dependency. Strimzi-deploy эквивалент
  возможен — выбирается через `kafka.operator: strimzi|bitnami|vanilla`
  (default bitnami chart pattern).
type: application
keywords:
  - kafka
  - audit
  - streaming
home: https://github.com/PRO-Robotech/kacho-deploy
maintainers:
  - name: Kacho Cloud
    email: platform@kacho.cloud
