{{- if and .Values.enabled (eq .Values.tls.mode "self-signed") }}
{{/*
KAC-127 Phase 9 — Self-signed TLS Secret для dev/staging Kafka.

PROD MUST use cert-manager (`tls.mode=cert-manager`) либо external-secrets
(`tls.mode=external-secrets`). Self-signed — НЕ для production использования.

Helm `genCA` / `genSignedCert` функции — детерминированные only при стабильном
seed; при upgrade сертификаты могут перегенериться. На prod использовать
cert-manager Certificate resource.
*/}}
{{- $ca := genCA "kafka-ca" 3650 -}}
{{- $cn := printf "%s.%s.svc.cluster.local" (include "kafka.fullname" .) .Release.Namespace -}}
{{- $altNames := list $cn (printf "*.%s-headless.%s.svc.cluster.local" (include "kafka.fullname" .) .Release.Namespace) (include "kafka.bootstrapServers" .) -}}
{{- $cert := genSignedCert $cn nil $altNames 365 $ca -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  ca.crt: {{ $ca.Cert | quote }}
  tls.crt: {{ $cert.Cert | quote }}
  tls.key: {{ $cert.Key | quote }}
{{- else if and .Values.enabled (eq .Values.tls.mode "cert-manager") }}
{{/*
cert-manager Certificate resource — выдаёт TLS-Secret через configured Issuer
(usually ClusterIssuer pointing на in-cluster CA или Vault PKI).
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "kafka.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  secretName: {{ include "kafka.fullname" . }}-tls
  duration: 8760h    # 1y
  renewBefore: 720h  # 30d
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind }}
  commonName: {{ printf "%s.%s.svc.cluster.local" (include "kafka.fullname" .) .Release.Namespace | quote }}
  dnsNames:
    - {{ printf "%s.%s.svc.cluster.local" (include "kafka.fullname" .) .Release.Namespace | quote }}
    - {{ printf "*.%s-headless.%s.svc.cluster.local" (include "kafka.fullname" .) .Release.Namespace | quote }}
{{- end }}
