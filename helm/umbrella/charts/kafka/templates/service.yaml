{{- if .Values.enabled }}
{{/*
KAC-127 Phase 9 — Kafka Services.

Два Service'а:
  1. headless (для StatefulSet DNS — pod-N.headless.namespace.svc)
  2. bootstrap (LB поверх broker'ов — клиенты дисковерят кластер через него)
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: client
      port: {{ .Values.listeners.client.port }}
      targetPort: client
    - name: internal
      port: {{ .Values.listeners.internal.port }}
      targetPort: internal
    - name: controller
      port: 9095
      targetPort: controller
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: client
      port: {{ .Values.listeners.client.port }}
      targetPort: client
    {{- if .Values.metrics.jmx.enabled }}
    - name: jmx
      port: {{ .Values.metrics.jmx.port }}
      targetPort: jmx
    {{- end }}
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}
{{- end }}
