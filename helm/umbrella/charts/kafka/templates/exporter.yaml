{{- if and .Values.enabled .Values.metrics.kafkaExporter.enabled }}
{{/*
KAC-127 Phase 9 — Kafka Exporter (Prometheus) для consumer-group lag metrics
+ ServiceMonitor (если Prometheus Operator установлен в кластере).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafka.fullname" . }}-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    kacho.cloud/component: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
        kacho.cloud/component: kafka-exporter
    spec:
      containers:
        - name: exporter
          image: "{{ .Values.metrics.kafkaExporter.image.repository }}:{{ .Values.metrics.kafkaExporter.image.tag }}"
          args:
            - "--kafka.server={{ include "kafka.bootstrapServers" . }}"
            - "--web.listen-address=:9308"
            - "--sasl.enabled"
            - "--sasl.mechanism=scram-sha512"
            - "--sasl.username=$(KAFKA_USERNAME)"
            - "--sasl.password=$(KAFKA_PASSWORD)"
            - "--tls.enabled"
            - "--tls.ca-file=/opt/kafka/tls/ca.crt"
          env:
            - name: KAFKA_USERNAME
              value: kacho-iam-audit-producer
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-scram-kacho-iam-audit
                  key: password
          ports:
            - name: metrics
              containerPort: 9308
          volumeMounts:
            - name: tls
              mountPath: /opt/kafka/tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: tls
          secret:
            secretName: {{ include "kafka.fullname" . }}-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    kacho.cloud/component: kafka-exporter
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9308
      targetPort: metrics
  selector:
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
