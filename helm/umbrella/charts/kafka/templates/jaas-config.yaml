{{- if .Values.enabled }}
{{/*
KAC-127 Phase 9 — JAAS config Secret for Kafka SCRAM auth.

KafkaServer { ... } блок описывает broker-side acceptable mechanisms
(SCRAM-SHA-512). Client credentials (passwords) НЕ хранятся здесь — broker
читает SCRAM credentials из __consumer_offsets-эквивалента (Kafka users API
via init-job, см. topic-init-job.yaml).

Этот Secret сгенерирован Helm'ом, но real-life prod должен management через
external-secrets-operator / sealed-secrets / KMS.

  apiVersion: external-secrets.io/v1beta1
  kind: ExternalSecret
  metadata:
    name: kafka-jaas
  spec:
    secretStoreRef:
      name: kacho-vault-store
      kind: ClusterSecretStore
    target:
      name: <kafka.fullname>-jaas
    data:
      - secretKey: kafka_server_jaas.conf
        remoteRef:
          key: kacho/kafka/jaas
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka.fullname" . }}-jaas
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
type: Opaque
stringData:
  kafka_server_jaas.conf: |
    KafkaServer {
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="admin"
        password="{{ randAlphaNum 32 }}";
    };
    Client {
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="admin"
        password="{{ randAlphaNum 32 }}";
    };
{{- end }}
