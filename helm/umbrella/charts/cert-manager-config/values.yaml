certManager:
  # Email for ACME registration + renewal-failure alerts.
  acmeEmail: "platform@kacho.cloud"

  # Namespace where ClusterIssuer Secret lives.
  namespace: "cert-manager"

  # Cloudflare API token Secret (created via ExternalSecrets-operator from
  # Vault path `secret/kacho/prod/cert-manager-cloudflare-token`).
  cloudflare:
    apiTokenSecret:
      name: "cert-manager-cloudflare-token"
      key: "token"

  # ClusterIssuer ACME endpoints.
  issuers:
    prod:
      enabled: true
      name: "letsencrypt-prod"
      server: "https://acme-v02.api.letsencrypt.org/directory"
    staging:
      enabled: true
      name: "letsencrypt-staging"
      server: "https://acme-staging-v02.api.letsencrypt.org/directory"

  # DNS zones managed by Cloudflare (one per configured domain).
  dnsZones:
    - "{{ .Values.kacho.domain }}"

  # ─── SEC-F: internal CA PKI for cluster-internal mTLS ────────────────────
  # Separate from the public ACME (letsencrypt-*) issuers above: a CA-type
  # ClusterIssuer for service→service mTLS. Bootstrap chain:
  #   selfSigned root ClusterIssuer (kacho-selfsigned, REUSED — already
  #   referenced by values.dev.yaml but previously undefined; SEC-F §4.1.6
  #   closes that gap, does NOT breed a second overlapping self-signed issuer)
  #     → CA-root Certificate (isCA:true) in a secret
  #       → CA-type ClusterIssuer (kacho-internal-ca) that signs per-service
  #         server + client leaf certs.
  # Disabled by default (dev = insecure service→service, zero regression).
  # Enabled by the values.mtls.yaml overlay / prod mTLS profile.
  internalCA:
    enabled: false
    # Reused bootstrap self-signed root (SEC-F-01) — must be exactly one.
    rootIssuerName: "kacho-selfsigned"
    # Target CA-type issuer that signs all internal leaf certs.
    clusterIssuerName: "kacho-internal-ca"
    # Secret holding the self-signed CA root cert+key (consumed by the CA issuer).
    caSecretName: "kacho-internal-ca-root"
    # CA root cert lifetime.
    caDuration: "87600h"                   # 10y root
    caRenewBefore: "720h"                  # 30d
    # Leaf (per-service) cert lifetime — short, rotation-friendly.
    leafDuration: "2160h"                  # 90d
    leafRenewBefore: "720h"                # 30d
    leafPrivateKey:
      algorithm: "ECDSA"
      size: 256
    # Internal components issued a server+client cert pair. Canonical service
    # names (kacho-nlb, NOT legacy kacho-loadbalancer; vpc-operator → SEC-G).
    # `spiffeId` is the single source of truth (also consumed by IAM cert→SA
    # mapping SEC-C and spire-registration) — SPIRE format
    # `spiffe://<trustDomain>/ns/<spiffe.namespace>/sa/<svc>`; templated from
    # `.Values.spiffe.{trustDomain,namespace}` so it is never hardcoded.
    services:
      # api-gateway's pod SA is `kacho-api-gateway` (server DNS is the service
      # name `api-gateway`; client identity is the SA) — matches spire-registration.
      api-gateway:
        saName: "kacho-api-gateway"
      kacho-iam: {}
      kacho-vpc: {}
      kacho-compute: {}
      kacho-nlb: {}

  # Wildcard certificates issued per domain.
  certificates:
    - name: "kacho-wildcard-tls"
      namespace: "kacho-system"
      secretName: "kacho-wildcard-tls"
      issuerRef: "letsencrypt-prod"
      dnsNames:
        - "{{ .Values.kacho.domain }}"
        - "*.{{ .Values.kacho.domain }}"
        - "api.{{ .Values.kacho.domain }}"
        - "spire.{{ .Values.kacho.domain }}"
        - "grafana.{{ .Values.kacho.domain }}"
        - "hubble.{{ .Values.kacho.domain }}"
        - "argocd.{{ .Values.kacho.domain }}"
        - "hydra.{{ .Values.kacho.domain }}"
        - "kratos.{{ .Values.kacho.domain }}"
      duration: "2160h"                    # 90d (Let's Encrypt cap)
      renewBefore: "720h"                  # 30d before expiry — start renewal
      privateKey:
        algorithm: "ECDSA"
        size: 256

kacho:
  domain: "api.kacho.local"
global:
  kacho:
    domain: ""

# SEC-F: SPIFFE identity contract — single source of truth for internal-CA
# client-cert URI-SANs (must match spire-registration + IAM cert→SA mapping).
# Propagated from the umbrella top-level `spiffe.*` via explicit pass-through.
spiffe:
  trustDomain: "kacho.cloud"
  # Namespace where service pods actually run (single-source — snaps the
  # `kacho` vs `kacho-system` collision, SEC-F §«Разрешение SPIFFE-коллизии»).
  namespace: "kacho"
