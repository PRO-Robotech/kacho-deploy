certManager:
  # Email for ACME registration + renewal-failure alerts.
  acmeEmail: "platform@kacho.cloud"

  # Namespace where ClusterIssuer Secret lives.
  namespace: "cert-manager"

  # Cloudflare API token Secret (created via ExternalSecrets-operator from
  # Vault path `secret/kacho/prod/cert-manager-cloudflare-token`).
  cloudflare:
    apiTokenSecret:
      name: "cert-manager-cloudflare-token"
      key: "token"

  # ClusterIssuer ACME endpoints.
  issuers:
    prod:
      enabled: true
      name: "letsencrypt-prod"
      server: "https://acme-v02.api.letsencrypt.org/directory"
    staging:
      enabled: true
      name: "letsencrypt-staging"
      server: "https://acme-staging-v02.api.letsencrypt.org/directory"

  # DNS zones managed by Cloudflare (one per configured domain).
  dnsZones:
    - "{{ .Values.kacho.domain }}"

  # ─── SEC-F: internal CA PKI for cluster-internal mTLS ────────────────────
  # Separate from the public ACME (letsencrypt-*) issuers above: a CA-type
  # ClusterIssuer for service→service mTLS. Bootstrap chain:
  #   selfSigned root ClusterIssuer (kacho-selfsigned, REUSED — already
  #   referenced by values.dev.yaml but previously undefined; SEC-F §4.1.6
  #   closes that gap, does NOT breed a second overlapping self-signed issuer)
  #     → CA-root Certificate (isCA:true) in a secret
  #       → CA-type ClusterIssuer (kacho-internal-ca) that signs per-service
  #         server + client leaf certs.
  # Disabled by default (dev = insecure service→service, zero regression).
  # Enabled by the values.mtls.yaml overlay / prod mTLS profile.
  internalCA:
    enabled: false
    # Reused bootstrap self-signed root (SEC-F-01) — must be exactly one.
    rootIssuerName: "kacho-selfsigned"
    # Target CA-type issuer that signs all internal leaf certs.
    clusterIssuerName: "kacho-internal-ca"
    # Secret holding the self-signed CA root cert+key (consumed by the CA issuer).
    caSecretName: "kacho-internal-ca-root"
    # CA root cert lifetime.
    caDuration: "87600h"                   # 10y root
    caRenewBefore: "720h"                  # 30d
    # Leaf (per-service) cert lifetime — short, rotation-friendly.
    leafDuration: "2160h"                  # 90d
    leafRenewBefore: "720h"                # 30d
    leafPrivateKey:
      algorithm: "ECDSA"
      size: 256
    # Internal components issued a server+client cert pair. Canonical service
    # names (kacho-nlb, NOT legacy kacho-loadbalancer; vpc-operator → SEC-G).
    # `spiffeId` is the single source of truth (also consumed by IAM cert→SA
    # mapping SEC-C and spire-registration) — SPIRE format
    # `spiffe://<trustDomain>/ns/<spiffe.namespace>/sa/<svc>`; templated from
    # `.Values.spiffe.{trustDomain,namespace}` so it is never hardcoded.
    #
    # SEC-F КРИТ#1 — `serverHosts` is the SINGLE SOURCE of the server-cert
    # DNS-SAN. The map key (`kacho-vpc`, …) names the cert/secret/SA, but the
    # actual Service DNS a peer DIALS may differ (the kacho-vpc deployment's
    # Service is `vpc`; kacho-iam answers on both `kacho-iam` AND
    # `kacho-iam-internal`). The TLS client verifies its dial-host ServerName
    # against the server-cert SAN, so the SAN MUST list every dial-host of every
    # edge terminating at this server — NOT the cert key. `serverHosts` lists the
    # bare Service hostnames (no namespace/suffix); the template expands each to
    # `<host>.<ns>.svc.cluster.local`, `<host>.<ns>.svc`, `<host>.<ns>`. Source
    # of truth for dial-hosts: api-gateway backends + each service's peer config
    # (umbrella values.dev.yaml). Empty/absent → falls back to the cert key.
    services:
      # api-gateway's pod SA is `kacho-api-gateway` (client identity); its
      # Service DNS is `api-gateway`. No inbound mTLS edge dials it today, but
      # the server-cert is issued for completeness/SEC-G.
      api-gateway:
        saName: "kacho-api-gateway"
        serverHosts: ["api-gateway"]
      # kacho-iam answers on the public Service `kacho-iam` (9090,
      # ProjectService/AuthorizeService) AND the cluster-internal Service
      # `kacho-iam-internal` (9091, InternalIAMService.{Check,RegisterResource}).
      # Every *→iam edge dials the latter; gateway/nlb→iam also dial the former.
      kacho-iam:
        serverHosts: ["kacho-iam", "kacho-iam-internal"]
      # The kacho-vpc deployment's Service is literally `vpc` (NOT `kacho-vpc`).
      # gateway/compute/nlb dial `vpc:9090` (+ `vpc:9091` internal) — same host,
      # the SAN is host-only so one entry covers both ports.
      kacho-vpc:
        serverHosts: ["vpc"]
      # The kacho-compute deployment's Service is literally `compute`.
      kacho-compute:
        serverHosts: ["compute"]
      # kacho-nlb answers on the public Service `kacho-nlb` (9090) AND the
      # cluster-internal Service `kacho-nlb-internal` (9091).
      kacho-nlb:
        serverHosts: ["kacho-nlb", "kacho-nlb-internal"]
      # SEC-G — kacho-vpc-operator is a CLIENT only: it DIALS kacho-vpc/kacho-iam
      # over mTLS but exposes no inbound gRPC server (its admission webhook is a
      # SEPARATE channel — kube-apiserver→webhook — with its own server-cert, #5).
      #   * clientOnly  → emit ONLY the client-cert leaf (no server-cert).
      #   * namespace   → the cert/secret live in the operator's OWN namespace
      #                   (it consumes the secret there), NOT the core cert ns.
      #   * spiffeNamespace → the SAN ns-segment MUST be the operator's actual
      #                   namespace (§4.1.4) so identity matches the SPIRE entry
      #                   and the IAM cert→SA mapping resolves `vpc-operator`.
      vpc-operator:
        clientOnly: true
        namespace: "kacho-vpc-operator"
        spiffeNamespace: "kacho-vpc-operator"

  # Wildcard certificates issued per domain.
  certificates:
    - name: "kacho-wildcard-tls"
      namespace: "kacho-system"
      secretName: "kacho-wildcard-tls"
      issuerRef: "letsencrypt-prod"
      dnsNames:
        - "{{ .Values.kacho.domain }}"
        - "*.{{ .Values.kacho.domain }}"
        - "api.{{ .Values.kacho.domain }}"
        - "spire.{{ .Values.kacho.domain }}"
        - "grafana.{{ .Values.kacho.domain }}"
        - "hubble.{{ .Values.kacho.domain }}"
        - "argocd.{{ .Values.kacho.domain }}"
        - "hydra.{{ .Values.kacho.domain }}"
        - "kratos.{{ .Values.kacho.domain }}"
      duration: "2160h"                    # 90d (Let's Encrypt cap)
      renewBefore: "720h"                  # 30d before expiry — start renewal
      privateKey:
        algorithm: "ECDSA"
        size: 256

kacho:
  domain: "api.kacho.local"
global:
  kacho:
    domain: ""

# SEC-F: SPIFFE identity contract — single source of truth for internal-CA
# client-cert URI-SANs (must match spire-registration + IAM cert→SA mapping).
# Propagated from the umbrella top-level `spiffe.*` via explicit pass-through.
spiffe:
  trustDomain: "kacho.cloud"
  # Namespace where service pods actually run (single-source — snaps the
  # `kacho` vs `kacho-system` collision, SEC-F §«Разрешение SPIFFE-коллизии»).
  namespace: "kacho"
