apiVersion: v2
name: cert-manager-config
version: 0.1.0
description: |
  KAC-127 Phase 11 — cert-manager v1.15+ configuration: ClusterIssuer for
  Let's Encrypt prod+staging, Certificate resources for wildcard *.kacho.domain,
  DNS-01 challenge solver via Cloudflare API token.
  Configurable: kacho.domain, email, cloudflare.apiTokenSecret, dnsZones[].
  Assumes cert-manager controller already installed in `cert-manager` namespace
  (chart at https://charts.jetstack.io/ — declared as external dep).
type: application
