{{- if .Values.certManager.internalCA.enabled }}
{{- $ica := .Values.certManager.internalCA }}
{{- $podNs := .Values.spiffe.namespace }}
{{/*
$caNs — namespace of the CA-root Certificate (and thus the secret a CA-type
ClusterIssuer consumes). cert-manager reads a ClusterIssuer's `ca.secretName`
from its cluster-resource-namespace (`--cluster-resource-namespace`, default
`cert-manager`), so the CA-root MUST land there — NOT in the wildcard cert's
`kacho-system` (which need not exist on a stand and broke `dev-up MTLS=on`).
*/}}
{{- $caNs := $ica.caNamespace | default "cert-manager" }}
{{- $trust := .Values.spiffe.trustDomain }}
{{/*
SEC-F — internal CA PKI for cluster-internal mTLS (separate from public ACME).

Bootstrap chain:
  (1) ClusterIssuer/kacho-selfsigned (selfSigned) — REUSED root. It was already
      referenced by values.dev.yaml (cert-manager.io/cluster-issuer annotation)
      but never defined; SEC-F §4.1.6 closes that gap here. Exactly ONE
      self-signed issuer — we do not breed a second overlapping one.
  (2) Certificate/kacho-internal-ca-root (isCA:true), signed by (1), stored in a
      secret.
  (3) ClusterIssuer/kacho-internal-ca (type `ca`, NOT acme) consuming that
      secret — signs all per-service leaf certs.
Then per-service server+client leaf Certificates in SEPARATE secrets.
*/}}
# ─── (1) Reused self-signed bootstrap root ────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $ica.rootIssuerName | quote }}
  labels:
    kacho.cloud/component: cert-manager-internal-ca
    app.kubernetes.io/managed-by: helm
spec:
  selfSigned: {}
---
# ─── (2) CA root certificate (isCA) ──────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $ica.caSecretName | quote }}
  namespace: {{ $caNs | quote }}
  labels:
    kacho.cloud/component: cert-manager-internal-ca
    app.kubernetes.io/managed-by: helm
spec:
  isCA: true
  commonName: "kacho-internal-ca"
  secretName: {{ $ica.caSecretName | quote }}
  duration: {{ $ica.caDuration | quote }}
  renewBefore: {{ $ica.caRenewBefore | quote }}
  privateKey:
    algorithm: "ECDSA"
    size: 256
    rotationPolicy: "Always"
  issuerRef:
    name: {{ $ica.rootIssuerName | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - cert sign
    - crl sign
---
# ─── (3) CA-type ClusterIssuer (signs leaf certs) ────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $ica.clusterIssuerName | quote }}
  labels:
    kacho.cloud/component: cert-manager-internal-ca
    app.kubernetes.io/managed-by: helm
spec:
  ca:
    secretName: {{ $ica.caSecretName | quote }}
{{- range $svc, $cfg := $ica.services }}
{{/*
  $svc        — cert/secret/SA name key (NOT necessarily the dialed Service DNS).
  $saName     — the ServiceAccount the pod runs as (client-cert URI-SAN identity);
                MUST equal the spire-registration spiffeId sa-part. Defaults to
                `kacho-<svc>` unless the key already starts with `kacho-` (then the
                key is also the SA), overridable via `saName`.
  $serverHosts — SEC-F КРИТ#1: the bare Service hostnames a peer DIALS to reach
                this server (may differ from $svc, and may be several: a service
                with a public + a cluster-internal Service answers on both). The
                server-cert SAN MUST cover every dial-host of every edge that
                terminates here, else the client's ServerName verify fails the
                handshake. Empty/absent → fall back to [$svc] (back-compat).
*/}}
{{- $saName := default (ternary $svc (printf "kacho-%s" $svc) (hasPrefix "kacho-" $svc)) $cfg.saName }}
{{/*
SEC-G — per-service overrides (default to the global values for back-compat):
  $svcNs       — namespace the cert/secret live in (a client-only component such
                 as the operator consumes its secret in its OWN namespace).
  $spiffeNs    — the SAN ns-segment; MUST equal the pod's actual namespace so the
                 identity matches the SPIRE entry + IAM cert→SA mapping (§4.1.4).
  $clientOnly  — emit only the client-cert leaf (no inbound server-cert).
*/}}
{{- $svcNs := default $podNs $cfg.namespace }}
{{- $spiffeNs := default $podNs $cfg.spiffeNamespace }}
{{- $spiffeId := default (printf "spiffe://%s/ns/%s/sa/%s" $trust $spiffeNs $saName) $cfg.spiffeId }}
{{- $serverHosts := $cfg.serverHosts | default (list $svc) }}
{{- if not $cfg.clientOnly }}
---
# ─── leaf: {{ $svc }} server cert (SAN = service DNS) ─────────────────────────
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-server-tls" $svc | quote }}
  namespace: {{ $svcNs | quote }}
  labels:
    kacho.cloud/component: cert-manager-internal-ca
    app.kubernetes.io/name: {{ $svc | quote }}
    app.kubernetes.io/managed-by: helm
spec:
  secretName: {{ printf "%s-server-tls" $svc | quote }}
  duration: {{ $ica.leafDuration | quote }}
  renewBefore: {{ $ica.leafRenewBefore | quote }}
  privateKey:
    algorithm: {{ $ica.leafPrivateKey.algorithm | quote }}
    size: {{ $ica.leafPrivateKey.size }}
    rotationPolicy: "Always"
  issuerRef:
    name: {{ $ica.clusterIssuerName | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    {{- range $host := $serverHosts }}
    - {{ printf "%s.%s.svc.cluster.local" $host $podNs | quote }}
    - {{ printf "%s.%s.svc" $host $podNs | quote }}
    - {{ printf "%s.%s" $host $podNs | quote }}
    {{- end }}
  usages:
    - server auth
    - client auth                          # backstop for the listen side
{{- end }}
---
# ─── leaf: {{ $svc }} client cert (URI-SAN = SPIRE-format identity) ───────────
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-client-tls" $svc | quote }}
  namespace: {{ $svcNs | quote }}
  labels:
    kacho.cloud/component: cert-manager-internal-ca
    app.kubernetes.io/name: {{ $svc | quote }}
    app.kubernetes.io/managed-by: helm
spec:
  secretName: {{ printf "%s-client-tls" $svc | quote }}
  duration: {{ $ica.leafDuration | quote }}
  renewBefore: {{ $ica.leafRenewBefore | quote }}
  privateKey:
    algorithm: {{ $ica.leafPrivateKey.algorithm | quote }}
    size: {{ $ica.leafPrivateKey.size }}
    rotationPolicy: "Always"
  issuerRef:
    name: {{ $ica.clusterIssuerName | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
  uris:
    - {{ $spiffeId | quote }}
  usages:
    - client auth
{{- end }}
{{- end }}
