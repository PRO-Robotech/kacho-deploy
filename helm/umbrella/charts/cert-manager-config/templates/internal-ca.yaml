{{- if .Values.certManager.internalCA.enabled }}
{{- $ica := .Values.certManager.internalCA }}
{{- $ns := .Values.certManager.certificates | first | dig "namespace" "kacho-system" }}
{{- $podNs := .Values.spiffe.namespace }}
{{- $trust := .Values.spiffe.trustDomain }}
{{/*
SEC-F — internal CA PKI for cluster-internal mTLS (separate from public ACME).

Bootstrap chain:
  (1) ClusterIssuer/kacho-selfsigned (selfSigned) — REUSED root. It was already
      referenced by values.dev.yaml (cert-manager.io/cluster-issuer annotation)
      but never defined; SEC-F §4.1.6 closes that gap here. Exactly ONE
      self-signed issuer — we do not breed a second overlapping one.
  (2) Certificate/kacho-internal-ca-root (isCA:true), signed by (1), stored in a
      secret.
  (3) ClusterIssuer/kacho-internal-ca (type `ca`, NOT acme) consuming that
      secret — signs all per-service leaf certs.
Then per-service server+client leaf Certificates in SEPARATE secrets.
*/}}
# ─── (1) Reused self-signed bootstrap root ────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $ica.rootIssuerName | quote }}
  labels:
    kacho.cloud/component: cert-manager-internal-ca
    app.kubernetes.io/managed-by: helm
spec:
  selfSigned: {}
---
# ─── (2) CA root certificate (isCA) ──────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $ica.caSecretName | quote }}
  namespace: {{ $ns | quote }}
  labels:
    kacho.cloud/component: cert-manager-internal-ca
    app.kubernetes.io/managed-by: helm
spec:
  isCA: true
  commonName: "kacho-internal-ca"
  secretName: {{ $ica.caSecretName | quote }}
  duration: {{ $ica.caDuration | quote }}
  renewBefore: {{ $ica.caRenewBefore | quote }}
  privateKey:
    algorithm: "ECDSA"
    size: 256
    rotationPolicy: "Always"
  issuerRef:
    name: {{ $ica.rootIssuerName | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - cert sign
    - crl sign
---
# ─── (3) CA-type ClusterIssuer (signs leaf certs) ────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $ica.clusterIssuerName | quote }}
  labels:
    kacho.cloud/component: cert-manager-internal-ca
    app.kubernetes.io/managed-by: helm
spec:
  ca:
    secretName: {{ $ica.caSecretName | quote }}
{{- range $svc, $cfg := $ica.services }}
{{/*
  $svc      — service/deployment DNS name (server-cert DNS-SAN host).
  $saName   — the ServiceAccount the pod runs as (client-cert URI-SAN identity);
              MUST equal the spire-registration spiffeId sa-part. Defaults to
              `kacho-<svc>` unless the service name already starts with `kacho-`
              (then the svc name is also the SA), overridable via `saName`.
*/}}
{{- $saName := default (ternary $svc (printf "kacho-%s" $svc) (hasPrefix "kacho-" $svc)) $cfg.saName }}
{{- $spiffeId := default (printf "spiffe://%s/ns/%s/sa/%s" $trust $podNs $saName) $cfg.spiffeId }}
---
# ─── leaf: {{ $svc }} server cert (SAN = service DNS) ─────────────────────────
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-server-tls" $svc | quote }}
  namespace: {{ $ns | quote }}
  labels:
    kacho.cloud/component: cert-manager-internal-ca
    app.kubernetes.io/name: {{ $svc | quote }}
    app.kubernetes.io/managed-by: helm
spec:
  secretName: {{ printf "%s-server-tls" $svc | quote }}
  duration: {{ $ica.leafDuration | quote }}
  renewBefore: {{ $ica.leafRenewBefore | quote }}
  privateKey:
    algorithm: {{ $ica.leafPrivateKey.algorithm | quote }}
    size: {{ $ica.leafPrivateKey.size }}
    rotationPolicy: "Always"
  issuerRef:
    name: {{ $ica.clusterIssuerName | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - {{ printf "%s.%s.svc.cluster.local" $svc $podNs | quote }}
    - {{ printf "%s.%s.svc" $svc $podNs | quote }}
    - {{ printf "%s.%s" $svc $podNs | quote }}
  usages:
    - server auth
    - client auth                          # backstop for the listen side
---
# ─── leaf: {{ $svc }} client cert (URI-SAN = SPIRE-format identity) ───────────
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-client-tls" $svc | quote }}
  namespace: {{ $ns | quote }}
  labels:
    kacho.cloud/component: cert-manager-internal-ca
    app.kubernetes.io/name: {{ $svc | quote }}
    app.kubernetes.io/managed-by: helm
spec:
  secretName: {{ printf "%s-client-tls" $svc | quote }}
  duration: {{ $ica.leafDuration | quote }}
  renewBefore: {{ $ica.leafRenewBefore | quote }}
  privateKey:
    algorithm: {{ $ica.leafPrivateKey.algorithm | quote }}
    size: {{ $ica.leafPrivateKey.size }}
    rotationPolicy: "Always"
  issuerRef:
    name: {{ $ica.clusterIssuerName | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
  uris:
    - {{ $spiffeId | quote }}
  usages:
    - client auth
{{- end }}
{{- end }}
