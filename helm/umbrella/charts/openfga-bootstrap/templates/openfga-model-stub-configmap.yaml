        define g_editor_lb_listener: editor from sg_lb_listener
        define g_admin_lb_listener: admin from sg_lb_listener
        define g_vget_lb_listener: v_get from sg_lb_listener
        define g_vlist_lb_listener: v_list from sg_lb_listener
        define g_vcreate_lb_listener: v_create from sg_lb_listener
        define g_vupdate_lb_listener: v_update from sg_lb_listener
        define g_vdelete_lb_listener: v_delete from sg_lb_listener
        define sg_iam_user: [scope_grant]
        define g_viewer_iam_user: viewer from sg_iam_user
        define g_editor_iam_user: editor from sg_iam_user
        define g_admin_iam_user: admin from sg_iam_user
        define g_vget_iam_user: v_get from sg_iam_user
