        define g_editor_vpc_security_group: editor from sg_vpc_security_group
        define g_admin_vpc_security_group: admin from sg_vpc_security_group
        define g_vget_vpc_security_group: v_get from sg_vpc_security_group
        define g_vlist_vpc_security_group: v_list from sg_vpc_security_group
        define g_vcreate_vpc_security_group: v_create from sg_vpc_security_group
        define g_vupdate_vpc_security_group: v_update from sg_vpc_security_group
        define g_vdelete_vpc_security_group: v_delete from sg_vpc_security_group
        define sg_vpc_route_table: [scope_grant]
        define g_viewer_vpc_route_table: viewer from sg_vpc_route_table
        define g_editor_vpc_route_table: editor from sg_vpc_route_table
        define g_admin_vpc_route_table: admin from sg_vpc_route_table
        define g_vget_vpc_route_table: v_get from sg_vpc_route_table
        define g_vlist_vpc_route_table: v_list from sg_vpc_route_table
        define g_vcreate_vpc_route_table: v_create from sg_vpc_route_table
        define g_vupdate_vpc_route_table: v_update from sg_vpc_route_table
        define g_vdelete_vpc_route_table: v_delete from sg_vpc_route_table
        define sg_vpc_gateway: [scope_grant]
        define g_viewer_vpc_gateway: viewer from sg_vpc_gateway
        define g_editor_vpc_gateway: editor from sg_vpc_gateway
        define g_admin_vpc_gateway: admin from sg_vpc_gateway
        define g_vget_vpc_gateway: v_get from sg_vpc_gateway
        define g_vlist_vpc_gateway: v_list from sg_vpc_gateway
        define g_vcreate_vpc_gateway: v_create from sg_vpc_gateway
        define g_vupdate_vpc_gateway: v_update from sg_vpc_gateway
        define g_vdelete_vpc_gateway: v_delete from sg_vpc_gateway
        define sg_vpc_network_interface: [scope_grant]
        define g_viewer_vpc_network_interface: viewer from sg_vpc_network_interface
        define g_editor_vpc_network_interface: editor from sg_vpc_network_interface
        define g_admin_vpc_network_interface: admin from sg_vpc_network_interface
        define g_vget_vpc_network_interface: v_get from sg_vpc_network_interface
        define g_vlist_vpc_network_interface: v_list from sg_vpc_network_interface
        define g_vcreate_vpc_network_interface: v_create from sg_vpc_network_interface
        define g_vupdate_vpc_network_interface: v_update from sg_vpc_network_interface
        define g_vdelete_vpc_network_interface: v_delete from sg_vpc_network_interface
        define sg_vpc_address_pool: [scope_grant]
        define g_viewer_vpc_address_pool: viewer from sg_vpc_address_pool
        define g_editor_vpc_address_pool: editor from sg_vpc_address_pool
        define g_admin_vpc_address_pool: admin from sg_vpc_address_pool
        define g_vget_vpc_address_pool: v_get from sg_vpc_address_pool
        define g_vlist_vpc_address_pool: v_list from sg_vpc_address_pool
        define g_vcreate_vpc_address_pool: v_create from sg_vpc_address_pool
        define g_vupdate_vpc_address_pool: v_update from sg_vpc_address_pool
        define g_vdelete_vpc_address_pool: v_delete from sg_vpc_address_pool
        define sg_lb_network_load_balancer: [scope_grant]
        define g_viewer_lb_network_load_balancer: viewer from sg_lb_network_load_balancer
        define g_editor_lb_network_load_balancer: editor from sg_lb_network_load_balancer
        define g_admin_lb_network_load_balancer: admin from sg_lb_network_load_balancer
        define g_vget_lb_network_load_balancer: v_get from sg_lb_network_load_balancer
        define g_vlist_lb_network_load_balancer: v_list from sg_lb_network_load_balancer
