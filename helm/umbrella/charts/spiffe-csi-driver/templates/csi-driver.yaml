{{- if .Values.enabled }}
# KAC-127 Phase 10 — CSIDriver registration.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.spiffe.io
  labels:
    {{- include "spiffe-csi.labels" . | nindent 4 }}
spec:
  attachRequired: false
  podInfoOnMount: true
  volumeLifecycleModes:
    - Ephemeral
{{- end }}
