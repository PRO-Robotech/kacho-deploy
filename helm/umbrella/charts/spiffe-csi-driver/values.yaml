# KAC-127 Phase 10 — SPIFFE CSI Driver values.

enabled: true

# CSI driver image.
image:
  repository: ghcr.io/spiffe/spiffe-csi-driver
  tag: "0.2.6"
  pullPolicy: IfNotPresent

# node-driver-registrar sidecar.
nodeDriverRegistrarImage:
  repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
  tag: "v2.10.1"
  pullPolicy: IfNotPresent

# SPIFFE Workload API socket — must match spire-agent.socket.hostPath.
spire:
  agentSocketPath: "/run/spire/sockets/agent.sock"
  agentSocketDir: "/run/spire/sockets"

# Mount path inside container (visible to pod).
containerSocketDir: "/run/spiffe/sockets"
containerSocketName: "spiffe.sock"

# DaemonSet tolerations — must run on every node.
tolerations:
  - operator: Exists

# Resources.
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"
