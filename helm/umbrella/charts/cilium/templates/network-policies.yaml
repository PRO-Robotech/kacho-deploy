{{- /*
  KAC-127 Phase 10 — Per-service CiliumNetworkPolicy (P10-D11/D12/D13).

  Iterates over .Values.networkPolicies.services map; emits one CNP per service
  with:
    - default-deny (implicit via spec: endpointSelector + empty ingress/egress
      means deny-all);
    - allow ingress from listed peers (matched by io.cilium.k8s.policy.spiffe-id);
    - allow egress to listed peers;
    - L7 path-based allowlist for sensitive endpoints.

  Все SPIFFE-ID configurable через `cilium.spiffe.trustDomain` (per-env);
  никаких хардкодов.
*/ -}}
{{- if and .Values.enabled .Values.networkPolicies.enabled }}
{{- $trustDomain := include "cilium.trustDomain" . }}
{{- $namespace := .Values.networkPolicies.namespace }}
{{- $labels := include "cilium.labels" . }}
{{- range $svcName, $svc := .Values.networkPolicies.services }}
{{- if $svc.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $svcName }}-mesh-policy
  namespace: {{ $namespace }}
  labels:
    {{- $labels | nindent 4 }}
    kacho.cloud/policy-target: {{ $svcName }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $svcName }}
  {{- if or $svc.ingressFrom $svc.ingressFromExternal }}
  ingress:
    {{- range $peer := $svc.ingressFrom }}
    - fromEndpoints:
        - matchExpressions:
            - key: io.cilium.k8s.policy.spiffe-id
              operator: In
              values:
                - "spiffe://{{ $trustDomain }}/ns/{{ $namespace }}/sa/kacho-{{ $peer }}"
      authentication:
        mode: "required"
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9091"
              protocol: TCP
    {{- end }}
    {{- if $svc.ingressFromExternal }}
    # External ingress — from ingress-nginx namespace (public API).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ingress-nginx
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- /* L7 path-based rules — only emit if l7Rules is non-empty list */ -}}
    {{- range $rule := $svc.l7Rules }}
    - fromEndpoints:
        {{- range $allowed := $rule.allowedPeers }}
        - matchExpressions:
            - key: io.cilium.k8s.policy.spiffe-id
              operator: In
              values:
                - "spiffe://{{ $trustDomain }}/ns/{{ $namespace }}/sa/kacho-{{ $allowed }}"
        {{- end }}
      authentication:
        mode: "required"
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9091"
              protocol: TCP
          rules:
            http:
              - method: ".*"
                path: {{ $rule.pathRegex | quote }}
                {{- if $rule.requireHeader }}
                headers:
                  - {{ printf "%s: .+" $rule.requireHeader | quote }}
                {{- end }}
    {{- end }}
  {{- end }}
  egress:
    # DNS always allowed.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Observability (OpenTelemetry collector + Prometheus metrics scrape).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
            - port: "4318"
              protocol: TCP
    {{- range $peer := $svc.egressTo }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kacho-{{ $peer }}
      authentication:
        mode: "required"
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9091"
              protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
