{{- if and .Values.enabled .Values.hubble.enabled .Values.hubble.ui.enabled .Values.hubble.ui.ingress.enabled }}
# KAC-127 Phase 10 — Hubble UI Ingress (P10-D16).
#
# Доступен админам через OIDC через Hydra (annotations выше).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cilium.fullname" . }}-hubble-ui
  namespace: kube-system
  labels:
    {{- include "cilium.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.hubble.ui.ingress.certIssuer | quote }}
    {{- with .Values.hubble.ui.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.hubble.ui.ingress.className | quote }}
  tls:
    - hosts:
        - {{ .Values.hubble.ui.ingress.host | quote }}
      secretName: {{ include "cilium.fullname" . }}-hubble-ui-tls
  rules:
    - host: {{ .Values.hubble.ui.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
{{- end }}
