{{- if and .Values.enabled .Values.cosign.enabled .Values.cosign.publicKey }}
# KAC-127 Phase 10 — cosign trusted-signer public key (P10-D10).
#
# Secret референсится SPIRE Agent cosign attestor для верификации image
# signature перед issuance SVID (P10-D23). При empty `cosign.publicKey`
# Secret не создаётся (предполагается ExternalSecrets reconciler).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cosign.secretName }}
  namespace: kube-system
  labels:
    {{- include "cilium.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.cosign.secretKey }}: {{ .Values.cosign.publicKey | b64enc | quote }}
{{- end }}
