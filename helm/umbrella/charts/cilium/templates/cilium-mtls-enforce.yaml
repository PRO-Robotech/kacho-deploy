{{- if and .Values.enabled .Values.mtlsEnforcePolicy.enabled }}
# KAC-127 Phase 10 — Global mTLS enforce policy.
#
# CiliumClusterwideNetworkPolicy enforce mode: drop traffic between kacho-*
# pods if no valid SPIFFE auth (acceptance §3.6, P10-D11).
#
# Применяется ко всем pods с label `kacho.cloud/mesh-enabled: "true"` (которой
# мы аннотируем все kacho-* Deployments).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: {{ include "cilium.fullname" . }}-mtls-enforce
  labels:
    {{- include "cilium.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      kacho.cloud/mesh-enabled: "true"
  # Egress: must use SPIFFE-authenticated mTLS for east-west traffic.
  egress:
    - toEndpoints:
        - matchLabels:
            kacho.cloud/mesh-enabled: "true"
      authentication:
        mode: "required"
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9091"
              protocol: TCP
    # DNS — always allowed without mTLS (kube-dns).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # SPIRE Agent socket — file-level, not network (Workload API на hostPath).
    # Egress to spire-server для bundle fetch (Cilium agent only — not kacho-*).
{{- end }}
