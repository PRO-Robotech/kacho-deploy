{{- if and .Values.enabled .Values.grafanaDashboards.enabled }}
# KAC-127 Phase 10 — Grafana dashboard: SPIFFE mesh.
#
# ConfigMap discovered by Grafana sidecar (label-selector based).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cilium.fullname" . }}-spiffe-mesh-dashboard
  namespace: monitoring
  labels:
    {{- include "cilium.labels" . | nindent 4 }}
    {{ .Values.grafanaDashboards.labelKey }}: {{ .Values.grafanaDashboards.labelValue | quote }}
data:
  spiffe-mesh.json: |-
    {
      "annotations": {"list": []},
      "title": "Kachō — SPIFFE Mesh (Phase 10)",
      "uid": "kacho-spiffe-mesh",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "type": "graph",
          "title": "SVID issuance rate (per second)",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "sum(rate(spire_server_svid_x509_issued_total[5m])) by (spiffe_id)",
              "legendFormat": "{{`{{spiffe_id}}`}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "graph",
          "title": "mTLS connection success rate",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "sum(rate(cilium_policy_l7_verdict_total{verdict=\"forwarded\"}[5m])) / sum(rate(cilium_policy_l7_verdict_total[5m]))",
              "legendFormat": "mTLS success ratio"
            }
          ]
        },
        {
          "id": 3,
          "type": "graph",
          "title": "CiliumNetworkPolicy drops (per minute) — lateral movement detector",
          "gridPos": {"x": 0, "y": 8, "w": 24, "h": 8},
          "targets": [
            {
              "expr": "sum(rate(cilium_drop_count_total[1m])) by (reason, source_workload)",
              "legendFormat": "{{`{{reason}} from {{source_workload}}`}}"
            }
          ],
          "alert": {
            "name": "Excessive CNP drops",
            "conditions": [
              {
                "evaluator": {"type": "gt", "params": [50]},
                "type": "query",
                "operator": {"type": "and"},
                "query": {"params": ["A", "1m", "now"]},
                "reducer": {"type": "avg", "params": []}
              }
            ]
          }
        }
      ]
    }
{{- end }}
