{{- if .Values.enabled }}
# KAC-127 Phase 10 — Cilium ConfigMap for mesh + SPIFFE + WireGuard + Hubble.
#
# Этот ConfigMap аннотирует cluster-deployed Cilium (через upstream chart или
# cilium CLI) — Helm-template'ы здесь только генерируют декларативную
# конфигурацию, которую operator подхватит.
#
# Использовать вместе с upstream Cilium chart (cilium/cilium) — feed эти
# values через `helm upgrade cilium cilium/cilium -f cilium-values-generated.yaml`,
# либо аплаем через kustomize-overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cilium.fullname" . }}-mesh-config
  namespace: kube-system
  labels:
    {{- include "cilium.labels" . | nindent 4 }}
data:
  # SPIFFE integration.
  spiffe-trust-domain: {{ include "cilium.trustDomain" . | quote }}
  spire-server-address: {{ .Values.spiffe.spireServerAddress | quote }}
  spire-workload-api-socket: {{ .Values.spiffe.socketPath | quote }}

  # Service mesh.
  enable-cilium-service-mesh: {{ .Values.serviceMesh.enabled | quote }}
  mesh-auth-mode: {{ .Values.serviceMesh.authenticationMode | quote }}
  mesh-auth-mutual-spire-enabled: {{ .Values.serviceMesh.enabled | quote }}
  mesh-auth-mutual-spire-server-address: {{ .Values.spiffe.spireServerAddress | quote }}

  # Encryption.
  enable-wireguard: {{ .Values.encryption.enabled | quote }}
  encryption-type: {{ .Values.encryption.type | quote }}
  enable-node-encryption: {{ .Values.encryption.nodeEncryption | quote }}

  # kube-proxy replacement.
  kube-proxy-replacement: {{ .Values.kubeProxyReplacement | quote }}

  # IPAM.
  ipam: {{ .Values.ipam.mode | quote }}
  cluster-pool-ipv4-pod-cidr-list: {{ .Values.ipam.clusterPoolIPv4PodCIDR | quote }}
  cluster-pool-ipv4-mask-size: {{ .Values.ipam.clusterPoolIPv4MaskSize | quote }}

  # Hubble.
  enable-hubble: {{ .Values.hubble.enabled | quote }}
  enable-hubble-relay: {{ .Values.hubble.relay.enabled | quote }}
  enable-hubble-ui: {{ .Values.hubble.ui.enabled | quote }}
  hubble-metrics-server: ":9965"
  hubble-export-allowlist: ""

  # eBPF policy (default-deny).
  enable-policy: "always"
  policy-enforcement-mode: "default"
{{- end }}
