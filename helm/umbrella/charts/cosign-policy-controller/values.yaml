# KAC-127 Phase 10 — cosign policy-controller values.
#
# Configurable parameters:
#   - cosign.publicKey — kacho-platform team PEM-encoded cosign public key
#     (P10-D10). Override per-env via External Secrets.
#   - enforcedNamespaces — list of namespaces где enforced cosign signature.
#   - warnNamespaces — list of namespaces где soft-warn (audit-only).

enabled: true

cosign:
  # PEM-encoded public key. Override через External Secrets in prod.
  publicKey: ""
  # Reference Secret containing public key.
  secretName: "cosign-trusted-key"
  secretKey: "cosign.pub"

# Fulcio root для keyless OIDC.
fulcio:
  enabled: false
  url: "https://fulcio.sigstore.dev"
  # OIDC issuer for keyless signing.
  identity:
    issuer: "https://token.actions.githubusercontent.com"
    subject: "https://github.com/PRO-Robotech/.*"

# Namespaces где enforced cosign signature (deny unsigned).
enforcedNamespaces:
  - kacho-system

# Namespaces где soft-warn (audit-only).
warnNamespaces:
  - kube-system

# Image glob patterns (по умолчанию все images в kacho-system).
imagePatterns:
  - "ghcr.io/pro-robotech/**"
  - "ttl.sh/**"
  - "docker.io/**"

# KAC-127 Phase 11 — SBOM + SLSA verification extensions.
# When sbom.required=true, the policy-controller also verifies that every
# image has an attached SBOM (SPDX/CycloneDX via cosign attach sbom) AND a
# SLSA L3 build-provenance attestation (in-toto Statement, predicate type
# https://slsa.dev/provenance/v1). Verification keys are cosign.publicKey
# (above) for offline-signed prod releases.
sbom:
  required: true
  acceptedFormats:
    - "spdx-json"
    - "cyclonedx-json"

slsa:
  required: true
  predicateType: "https://slsa.dev/provenance/v1"
  minimumLevel: 3
  builderId: "https://github.com/actions/runner"

# KAC-127 Phase 12 — Strict mode enforcement.
# When strict.enabled=true, the additional clusterimagepolicy-strict.yaml
# policy is rendered, REQUIRING signature + SLSA L3 attestation + SBOM
# attestation for every image in enforcedNamespaces. Enable for production
# only (after Phase 11 audit-only soak period).
strict:
  enabled: false

# Banned base-image registries (block any image not from trusted registries).
trustedRegistries:
  - "ghcr.io/pro-robotech"
  - "ghcr.io/cloudnative-pg"
  - "docker.io/grafana"
  - "docker.io/otel"
  - "docker.io/prom"
  - "docker.io/bitnami"
  - "quay.io/cilium"
  - "ghcr.io/spiffe"
