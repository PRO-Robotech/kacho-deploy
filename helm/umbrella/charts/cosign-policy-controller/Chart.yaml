apiVersion: v2
name: cosign-policy-controller
version: 0.1.0
appVersion: "0.10.0"
description: |
  KAC-127 Phase 10 — Sigstore policy-controller для admission control.

  Конфигурация по acceptance §3 (point 4) + Decision Log P10-D10 / P10-D23:
    - Allow только images signed by `{{ .Values.cosign.publicKey }}`
      (kacho-platform team key).
    - Block unsigned images в namespace `kacho-system`.
    - Soft-warn mode для namespace `kube-system` (системные образы могут
      быть не подписаны kacho-team).
    - Optional Fulcio root для keyless OIDC (build-time signing via GitHub
      Actions OIDC token).

  Этот chart создаёт CRD `ClusterImagePolicy` (Sigstore policy-controller).
  Сам policy-controller предполагается установленным upstream chart'ом
  (sigstore/policy-controller); этот chart только конфигурирует CRDs.
type: application
keywords:
  - cosign
  - sigstore
  - supply-chain
  - admission
home: https://github.com/PRO-Robotech/kacho-deploy
maintainers:
  - name: Kacho Cloud
    email: platform@kacho.cloud
