{{- if .Values.enabled }}
{{- /*
  Sigstore policy-controller activates on namespaces with label:
    policy.sigstore.dev/include: "true"

  Enforced namespaces are listed in `.Values.enforcedNamespaces`.
  Helm sets these labels via a one-shot Job (because namespaces may already exist).
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cosign-policy.fullname" . }}-label-namespaces
  labels:
    {{- include "cosign-policy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "cosign-policy.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "cosign-policy.fullname" . }}-labeler
      containers:
        - name: kubectl
          image: bitnami/kubectl:1.30
          command:
            - /bin/sh
            - -c
            - |
              set -e
              {{- range .Values.enforcedNamespaces }}
              kubectl label namespace {{ . }} policy.sigstore.dev/include=true --overwrite
              {{- end }}
              {{- range .Values.warnNamespaces }}
              kubectl label namespace {{ . }} policy.sigstore.dev/include=true --overwrite
              {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cosign-policy.fullname" . }}-labeler
  labels:
    {{- include "cosign-policy.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cosign-policy.fullname" . }}-labeler
  labels:
    {{- include "cosign-policy.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "patch", "update", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cosign-policy.fullname" . }}-labeler
  labels:
    {{- include "cosign-policy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cosign-policy.fullname" . }}-labeler
subjects:
  - kind: ServiceAccount
    name: {{ include "cosign-policy.fullname" . }}-labeler
    namespace: {{ .Release.Namespace }}
{{- end }}
