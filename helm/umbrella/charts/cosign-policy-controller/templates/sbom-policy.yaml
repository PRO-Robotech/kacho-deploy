{{- if and .Values.enabled .Values.sbom.required }}
---
# KAC-127 Phase 11 — SBOM attestation requirement.
# Rejects any image in enforcedNamespaces that does not have an attached SBOM
# attestation (SPDX or CycloneDX) signed by the trusted cosign key.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: "kacho-sbom-required"
  labels:
    kacho.cloud/component: cosign-sbom-policy
    app.kubernetes.io/managed-by: helm
spec:
  images:
    {{- range .Values.imagePatterns }}
    - glob: {{ . | quote }}
    {{- end }}
  authorities:
    - name: "kacho-platform-sbom"
      key:
        secretRef:
          name: {{ .Values.cosign.secretName | quote }}
          namespace: "cosign-system"
      attestations:
        - name: "sbom-spdx-required"
          predicateType: "https://spdx.dev/Document"
          policy:
            type: "cue"
            data: |
              import "time"
              predicateType: "https://spdx.dev/Document"
              predicate: {
                creationInfo: {
                  // SBOM must be no older than 30 days (renewed on every release).
                  created: =~ "^\\d{4}-\\d{2}-\\d{2}T"
                }
                packages: [
                  // Must list at least one package — empty SBOMs are rejected.
                  ...
                ]
              }
        - name: "sbom-cyclonedx-allowed"
          predicateType: "https://cyclonedx.org/bom"
          policy:
            type: "cue"
            data: |
              predicateType: "https://cyclonedx.org/bom"
              predicate: bomFormat: "CycloneDX"
{{- end }}
