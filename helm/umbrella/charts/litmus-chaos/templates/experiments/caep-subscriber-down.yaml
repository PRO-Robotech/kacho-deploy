{{- if .Values.enabled }}
# KAC-127 Phase 12 — ChaosExperiment: caep-subscriber-down.
# Kills the CAEP SET subscriber pod. Verifies that:
#   - SET events accumulate in DLQ topic (no loss);
#   - alert fires when DLQ-lag > threshold;
#   - subscriber restart drains DLQ in order.
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: caep-subscriber-down
  namespace: litmus-chaos
  labels:
    {{- include "litmus-chaos.labels" . | nindent 4 }}
    kacho.cloud/chaos-severity: {{ (index .Values.severity "caep-subscriber") | quote }}
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["get", "list", "patch", "update"]
    image: "{{ .Values.imageRegistry }}/go-runner:3.10.0"
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name pod-delete
    command:
      - /bin/bash
    env:
      - name: TOTAL_CHAOS_DURATION
        value: "240"
      - name: CHAOS_INTERVAL
        value: "60"
      - name: FORCE
        value: "true"
      - name: PODS_AFFECTED_PERC
        value: "100"
      - name: APP_NAMESPACE
        value: "kacho-system"
      - name: APP_LABEL
        value: "app.kubernetes.io/name=caep-subscriber"
      - name: APP_KIND
        value: "deployment"
    labels:
      name: pod-delete
      app.kubernetes.io/part-of: litmus
{{- end }}
