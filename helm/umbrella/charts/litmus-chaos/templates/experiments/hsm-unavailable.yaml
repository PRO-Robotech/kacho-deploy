{{- if .Values.enabled }}
# KAC-127 Phase 12 — ChaosExperiment: hsm-unavailable.
# Blocks HSM PKCS#11 endpoint from kacho-iam / hydra. Verifies that:
#   - JWKS rotation pauses (does not partial-rotate);
#   - existing signed tokens remain valid via cached JWKS;
#   - signing-in-progress requests fail-closed with Unavailable;
#   - alert fires within 30s.
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: hsm-unavailable
  namespace: litmus-chaos
  labels:
    {{- include "litmus-chaos.labels" . | nindent 4 }}
    kacho.cloud/chaos-severity: {{ (index .Values.severity "hsm-unavailable") | quote }}
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events", "services"]
        verbs: ["get", "list", "create", "patch"]
      - apiGroups: ["networking.k8s.io"]
        resources: ["networkpolicies"]
        verbs: ["get", "list", "create", "delete"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["get", "list", "patch", "update"]
    image: "{{ .Values.imageRegistry }}/go-runner:3.10.0"
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name pod-network-corruption
    command:
      - /bin/bash
    env:
      - name: TOTAL_CHAOS_DURATION
        value: "180"
      - name: DESTINATION_HOSTS
        value: "cloudhsm.us-east-1.amazonaws.com"
      - name: APP_NAMESPACE
        value: "kacho-system"
      - name: APP_LABEL
        value: "app.kubernetes.io/name in (hydra,kacho-iam,kratos)"
      - name: POLICY_TYPES
        value: "egress"
    labels:
      name: pod-network-corruption
      app.kubernetes.io/part-of: litmus
{{- end }}
