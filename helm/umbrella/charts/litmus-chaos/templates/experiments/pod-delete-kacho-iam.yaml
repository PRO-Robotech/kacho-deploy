{{- if .Values.enabled }}
# KAC-127 Phase 12 — ChaosExperiment: pod-delete-kacho-iam.
# Kills a random kacho-iam pod; verifies that traffic continues to flow
# (k6 background probe stays under p95<500ms / error<1%) and HPA/k8s
# replaces the pod within 60s. Severity: low.
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: pod-delete-kacho-iam
  namespace: litmus-chaos
  labels:
    {{- include "litmus-chaos.labels" . | nindent 4 }}
    kacho.cloud/chaos-severity: {{ (index .Values.severity "pod-kill") | quote }}
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events", "configmaps"]
        verbs: ["get", "list", "delete", "create"]
      - apiGroups: ["apps"]
        resources: ["deployments", "replicasets"]
        verbs: ["get", "list"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["get", "list", "patch", "update"]
    image: "{{ .Values.imageRegistry }}/go-runner:3.10.0"
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name pod-delete
    command:
      - /bin/bash
    env:
      - name: TOTAL_CHAOS_DURATION
        value: "30"
      - name: CHAOS_INTERVAL
        value: "10"
      - name: FORCE
        value: "false"
      - name: PODS_AFFECTED_PERC
        value: "33"     # kill 1 of 3 replicas
      - name: TARGET_NAMESPACE
        value: "kacho-system"
      - name: APP_NAMESPACE
        value: "kacho-system"
      - name: APP_LABEL
        value: "app.kubernetes.io/name=kacho-iam"
      - name: APP_KIND
        value: "deployment"
    labels:
      name: pod-delete
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: "3.10.0"
{{- end }}
