{{- if .Values.enabled }}
# KAC-127 Phase 12 — ChaosExperiment: disk-fill-postgres.
# Fills the Postgres PV to 95%. Verifies WAL-G backup catch-up,
# AlertManager fires, and graceful read-only failover.
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: disk-fill-postgres
  namespace: litmus-chaos
  labels:
    {{- include "litmus-chaos.labels" . | nindent 4 }}
    kacho.cloud/chaos-severity: {{ (index .Values.severity "slow-postgres") | quote }}
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events", "configmaps"]
        verbs: ["get", "list", "create", "patch", "exec"]
      - apiGroups: ["apps"]
        resources: ["statefulsets"]
        verbs: ["get", "list"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["get", "list", "patch", "update"]
    image: "{{ .Values.imageRegistry }}/go-runner:3.10.0"
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name disk-fill
    command:
      - /bin/bash
    env:
      - name: TOTAL_CHAOS_DURATION
        value: "120"
      - name: FILL_PERCENTAGE
        value: "95"
      - name: APP_NAMESPACE
        value: "kacho-system"
      - name: APP_LABEL
        value: "app.kubernetes.io/name=postgresql,app.kubernetes.io/component=primary"
      - name: TARGET_CONTAINER
        value: "postgresql"
    labels:
      name: disk-fill
      app.kubernetes.io/part-of: litmus
{{- end }}
