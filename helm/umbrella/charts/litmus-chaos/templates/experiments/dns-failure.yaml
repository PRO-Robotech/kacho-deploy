{{- if .Values.enabled }}
# KAC-127 Phase 12 — ChaosExperiment: dns-failure.
# Blocks DNS resolution from kacho-system to external IdP / KMS endpoints.
# Verifies that platform continues to operate on cached config + bootstrap creds.
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: dns-failure
  namespace: litmus-chaos
  labels:
    {{- include "litmus-chaos.labels" . | nindent 4 }}
    kacho.cloud/chaos-severity: {{ (index .Values.severity "dns-failure") | quote }}
spec:
  definition:
    scope: Cluster
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events", "configmaps", "services"]
        verbs: ["get", "list", "create", "patch", "exec"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["get", "list", "patch", "update"]
    image: "{{ .Values.imageRegistry }}/go-runner:3.10.0"
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name pod-dns-error
    command:
      - /bin/bash
    env:
      - name: TOTAL_CHAOS_DURATION
        value: "120"
      - name: TARGET_HOSTNAMES
        value: '["accounts.google.com","login.microsoftonline.com","kms.us-east-1.amazonaws.com"]'
      - name: APP_NAMESPACE
        value: "kacho-system"
      - name: APP_LABEL
        value: "app.kubernetes.io/component=control-plane"
    labels:
      name: pod-dns-error
      app.kubernetes.io/part-of: litmus
{{- end }}
