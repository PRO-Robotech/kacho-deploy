{{- if and .Values.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: litmus-chaos
  labels:
    {{- include "litmus-chaos.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: litmus-chaos
  labels:
    {{- include "litmus-chaos.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged   # chaos-runner needs elevated for network/IO injection
    pod-security.kubernetes.io/audit: restricted
{{- end }}
