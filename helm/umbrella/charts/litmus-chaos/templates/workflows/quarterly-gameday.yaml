{{- if and .Values.enabled .Values.gameDay.enabled }}
# KAC-127 Phase 12 — Quarterly Chaos Game-Day Workflow.
#
# Argo Workflow that runs all 12 ChaosExperiments in sequence with
# k6 background-load probe + Grafana annotations. Game-day is OPERATOR-DRIVEN
# (P12-D24): runbook + 1-click trigger; this CronWorkflow is scaffold for the
# trigger but does NOT auto-execute in production by default.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: chaos-quarterly-gameday
  namespace: litmus-chaos
  labels:
    {{- include "litmus-chaos.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.gameDay.schedule | quote }}
  timezone: {{ .Values.gameDay.timezone | quote }}
  concurrencyPolicy: "Forbid"          # never run two game-days concurrently
  startingDeadlineSeconds: 0
  workflowSpec:
    entrypoint: gameday
    serviceAccountName: {{ .Values.serviceAccount.name }}
    templates:
      - name: gameday
        steps:
          # Sequential execution of 12 chaos experiments + k6 probe in parallel.
          - - name: start-k6-probe
              template: k6-background-probe
            - name: notify-start
              template: notify-pagerduty
              arguments:
                parameters:
                  - name: event
                    value: "gameday-start"
          - - name: chaos-pod-kill-iam
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "pod-delete-kacho-iam"
          - - name: chaos-pod-kill-fga
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "pod-delete-openfga"
          - - name: chaos-net-latency
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "network-latency-spike"
          - - name: chaos-net-partition-kafka
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "network-partition-kafka"
          - - name: chaos-disk-fill-postgres
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "disk-fill-postgres"
          - - name: chaos-cpu-clickhouse
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "cpu-stress-clickhouse"
          - - name: chaos-dns
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "dns-failure"
          - - name: chaos-hsm
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "hsm-unavailable"
          - - name: chaos-cert-expiry
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "cert-expiry"
          - - name: chaos-argo-drift
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "argocd-out-of-sync"
          - - name: chaos-caep
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "caep-subscriber-down"
          - - name: chaos-node-drain
              template: run-experiment
              arguments:
                parameters:
                  - name: experiment
                    value: "node-drain-region"
          - - name: generate-report
              template: report-generator
            - name: notify-end
              template: notify-pagerduty
              arguments:
                parameters:
                  - name: event
                    value: "gameday-complete"

      - name: run-experiment
        inputs:
          parameters:
            - name: experiment
        resource:
          action: create
          successCondition: status.experimentStatus.verdict == "Pass"
          failureCondition: status.experimentStatus.verdict == "Fail"
          manifest: |
            apiVersion: litmuschaos.io/v1alpha1
            kind: ChaosEngine
            metadata:
              generateName: chaos-{{`{{inputs.parameters.experiment}}`}}-
              namespace: litmus-chaos
            spec:
              appinfo:
                appns: kacho-system
              annotationCheck: 'false'
              engineState: 'active'
              chaosServiceAccount: {{ .Values.serviceAccount.name }}
              experiments:
                - name: {{`{{inputs.parameters.experiment}}`}}

      - name: k6-background-probe
        container:
          image: "{{ .Values.k6Probe.image.repository }}:{{ .Values.k6Probe.image.tag }}"
          command: [k6, run, /scripts/probe.js]
          env:
            - name: K6_DURATION
              value: {{ .Values.k6Probe.duration | quote }}
            - name: K6_VUS
              value: {{ .Values.k6Probe.vus | quote }}
            - name: TARGET_URL
              value: {{ .Values.k6Probe.target | quote }}
            - name: P95_THRESHOLD_MS
              value: {{ .Values.k6Probe.thresholds.p95_latency_ms | quote }}
            - name: ERROR_RATE_THRESHOLD
              value: {{ .Values.k6Probe.thresholds.error_rate | quote }}
          volumeMounts:
            - name: k6-script
              mountPath: /scripts
        volumes:
          - name: k6-script
            configMap:
              name: chaos-k6-probe-script

      - name: notify-pagerduty
        inputs:
          parameters:
            - name: event
        container:
          image: alpine:3.19
          command: [sh, -c]
          args:
            - |
              echo "Gameday event: {{`{{inputs.parameters.event}}`}}"
              # PagerDuty notification — only fires when notification.enabled.
              {{- if .Values.gameDay.notification.pagerDuty.enabled }}
              # Send to PagerDuty Events v2 API.
              # (Use external-secret bound PAGERDUTY_ROUTING_KEY env.)
              {{- end }}

      - name: report-generator
        container:
          image: "{{ .Values.imageRegistry }}/litmus-go-runner-kubectl:3.10.0"
          command: [sh, -c]
          args:
            - |
              # Collect chaos-result CRDs, generate HTML report, upload to S3/Grafana.
              mkdir -p /tmp/report
              kubectl -n litmus-chaos get chaosresults -o json > /tmp/report/results.json
              echo "Report at /tmp/report/results.json"
{{- end }}
