# KAC-127 Phase 12 — Litmus 3.x chaos engineering subchart.
#
# Disabled by default; opt-in via umbrella values.prod.yaml (or per-cluster
# overrides). Run quarterly game-days against staging environments first;
# limited production game-days only after passing staging.

enabled: false

# Chaos-center HA deployment (3 replicas — KAC-127 Phase 12 P12-D23).
chaosCenter:
  enabled: true
  replicas: 3
  image:
    repository: litmuschaos/litmusportal-frontend
    tag: "3.10.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  service:
    type: ClusterIP
    port: 80
  podAntiAffinity:
    # Spread across nodes (production); soft for dev / kind.
    enabled: true
    topologyKey: kubernetes.io/hostname

# Database — separate Postgres instance kacho_litmus (запрет #8: database-per-service).
# This is wired to top-level umbrella pg-litmus instance (added if Phase 12 enabled);
# fall back to chaos-center-bundled mongo if pg-litmus.enabled=false.
database:
  type: mongodb
  external: false
  # When external=true, Litmus expects MongoDB; not Postgres. For Kachō we
  # currently use the bundled MongoDB and isolate it via NetworkPolicy.
  # Postgres alternative is future work (Litmus upstream PR pending).
  mongo:
    storageClass: ""
    size: 20Gi
    secretName: litmus-mongo-credentials

# OIDC auth via Hydra (replaces default local auth).
auth:
  oidc:
    enabled: true
    # All endpoints are runtime-configurable via the umbrella `kacho.domain`
    # value. The template renders these from .Values.global.kacho.domain
    # (propagated via umbrella). Override per-cluster via `--set
    # litmus-chaos.auth.oidc.issuerUrl=…`.
    issuerUrlTemplate: "https://hydra.{{ .Values.global.kacho.domain }}"
    clientId: "litmus-chaos-center"
    # Secret resolved from secretRef (external-secrets in prod, plaintext
    # only for dev / kind).
    clientSecretRef:
      name: litmus-oidc-client-secret
      key: client_secret
    redirectUriPath: "/auth/callback"
    scopes:
      - openid
      - profile
      - email
      - offline_access
    # ACR step-up required for chaos-center login (admin operation).
    acrValues: "aaguid_certified_l2"

# Image registry (configurable for air-gapped / private registry).
imageRegistry: "litmuschaos"
imagePullSecrets: []

# Service-account RBAC for chaos-runner.
serviceAccount:
  create: true
  name: litmus-chaos-runner
  annotations: {}

# RBAC scope — explicitly limited to `kacho-system` and audit namespace.
# Override per environment via list. Default deny-all outside listed NS.
allowedNamespaces:
  - kacho-system
  - kacho-audit
  - litmus-chaos

# Severity classifications for ChaosExperiments → AlertManager routing.
severity:
  pod-kill:           "low"          # routine resilience verification
  network-partition:  "high"         # control-plane availability
  slow-postgres:      "high"         # data-plane availability
  kafka-broker-down:  "critical"     # audit pipeline impact
  openfga-replica:    "high"         # authorization plane
  dpop-cert-rotation: "medium"       # transient verification
  hsm-unavailable:    "critical"     # signing plane
  cert-expiry:        "high"         # ingress availability
  argocd-out-of-sync: "medium"       # GitOps drift detection
  caep-subscriber:    "medium"       # SET event delivery
  dns-failure:        "high"         # external dependencies
  node-drain:         "high"         # capacity / failover

# k6 background-load probe — sustained load during chaos to detect
# silent failures (latency spike, error-rate increase).
k6Probe:
  enabled: true
  image:
    repository: grafana/k6
    tag: "0.49.0"
  duration: "30m"
  vus: 100               # virtual users
  target: "http://api-gateway.kacho-system:8080/healthz"
  # SLO thresholds — break experiment if exceeded.
  thresholds:
    p95_latency_ms: 500
    error_rate: 0.01     # 1%

# Quarterly game-day Argo Workflow schedule (cron). UTC.
gameDay:
  enabled: false
  schedule: "0 14 1 */3 *"   # 14:00 UTC, 1st of every 3rd month (Q1 / Q2 / Q3 / Q4)
  timezone: "UTC"
  # Notify before running (PagerDuty + Slack + email).
  notification:
    pagerDuty:
      enabled: false
      severity: "info"
    slack:
      enabled: false
      channel: "#chaos-engineering"
    emailRecipients: []

# Reporting — auto-generate HTML report and upload to S3 + Grafana annotations.
reporting:
  s3:
    enabled: false
    bucket: ""
    region: "us-east-1"
    accessKeySecretRef:
      name: litmus-reporting-s3-creds
      key: AWS_ACCESS_KEY_ID
    secretKeySecretRef:
      name: litmus-reporting-s3-creds
      key: AWS_SECRET_ACCESS_KEY
  grafana:
    enabled: true
    annotationsUrl: "http://mimir-query.observability:9090/api/v1/annotations"
