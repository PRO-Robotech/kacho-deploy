apiVersion: v2
name: multi-region-router
version: 0.1.0
description: |
  KAC-127 Phase 11 — Multi-region active-active routing. Manages:
    * Cloudflare LoadBalancer (geo-routing + health checks per region)
    * Per-region origin pools
    * Failover priority (primary/secondary)
    * Region-aware deployment manifests (anti-affinity per node within region)
  Configurable: regions[] (name, weight, originIP, healthCheck), routing.strategy,
  failover.{rto,rpo}.
  Default ships with stub configuration suitable for `helm template`; real
  deployment requires Cloudflare API token + per-region origin IPs.
type: application
