multiRegion:
  # Total list of regions — each becomes an origin pool entry in Cloudflare LB.
  # Override per environment in values.{env}.yaml.
  regions:
    - name: prod-eu-central
      enabled: true
      priority: 1                          # primary
      weight: 50                           # geo + health weighted
      originIP: "203.0.113.10"             # REPLACED at install via --set
      healthCheck:
        path: "/healthz"
        port: 443
        intervalSeconds: 30
        retries: 2
        timeoutSeconds: 10
      cloudProvider: "aws"
      region: "eu-central-1"
    - name: prod-eu-west
      enabled: true
      priority: 2                          # secondary
      weight: 50
      originIP: "203.0.113.11"
      healthCheck:
        path: "/healthz"
        port: 443
        intervalSeconds: 30
        retries: 2
        timeoutSeconds: 10
      cloudProvider: "aws"
      region: "eu-west-1"

  # Routing strategy.
  routing:
    strategy: "geo"                        # geo|random|round-robin|least-conn
    steeringPolicy: "dynamic_latency"      # dynamic_latency|geo|random|least_outstanding_requests
    # Per-country region preferences (geo override). Used by Cloudflare Steering.
    geoPreferences:
      EU:
        - prod-eu-central
        - prod-eu-west
      US:                                  # follow-up: add prod-us-east + prod-us-west
        - prod-eu-west
        - prod-eu-central
      ASIA:
        - prod-eu-central
        - prod-eu-west

  # Failover behaviour.
  failover:
    rtoMinutes: 15                         # Recovery Time Objective
    rpoMinutes: 1                          # Recovery Point Objective
    automatic: true                        # Cloudflare LB auto-failover on health-check fail
    minHealthyOrigins: 1                   # if 0 healthy → full outage page

  # LB name & zone.
  loadBalancer:
    name: "kacho-api-lb"
    zone: "{{ .Values.kacho.domain }}"
    proxied: true                          # orange-cloud
    sessionAffinity: "none"                # none|cookie|ip
    sessionAffinityTtl: 1800

  # Region-aware deployment hint (read by per-service Helm charts).
  deploymentLabels:
    enabled: true
    labelKey: "kacho.cloud/region"

kacho:
  domain: "api.kacho.local"
global:
  kacho:
    domain: ""
