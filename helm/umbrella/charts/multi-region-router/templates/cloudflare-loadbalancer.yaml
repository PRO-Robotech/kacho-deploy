---
apiVersion: cloudflare.crossplane.io/v1alpha1
kind: LoadBalancer
metadata:
  name: {{ .Values.multiRegion.loadBalancer.name | quote }}
  labels:
    kacho.cloud/component: cloudflare-lb
    app.kubernetes.io/managed-by: helm
spec:
  forProvider:
    zone: {{ tpl .Values.multiRegion.loadBalancer.zone . | quote }}
    name: {{ printf "lb.%s" (tpl .Values.multiRegion.loadBalancer.zone .) | quote }}
    description: "Multi-region geo-routing LB for kacho-api control plane"
    proxied: {{ .Values.multiRegion.loadBalancer.proxied }}
    sessionAffinity: {{ .Values.multiRegion.loadBalancer.sessionAffinity | quote }}
    sessionAffinityTtl: {{ .Values.multiRegion.loadBalancer.sessionAffinityTtl }}
    steeringPolicy: {{ .Values.multiRegion.routing.steeringPolicy | quote }}
    defaultPools:
      {{- range .Values.multiRegion.regions }}
      {{- if .enabled }}
      - {{ printf "%s-origin-pool" .name | quote }}
      {{- end }}
      {{- end }}
    fallbackPool: {{ printf "%s-origin-pool" (index .Values.multiRegion.regions 0).name | quote }}
    regionPools:
      {{- range $region, $pools := .Values.multiRegion.routing.geoPreferences }}
      {{ $region | quote }}:
        {{- range $pools }}
        - {{ printf "%s-origin-pool" . | quote }}
        {{- end }}
      {{- end }}
  providerConfigRef:
    name: cloudflare-default
{{- range .Values.multiRegion.regions }}
{{- if .enabled }}
---
apiVersion: cloudflare.crossplane.io/v1alpha1
kind: LoadBalancerPool
metadata:
  name: {{ printf "%s-origin-pool" .name | quote }}
  labels:
    kacho.cloud/component: cloudflare-lb-pool
    kacho.cloud/region: {{ .name | quote }}
spec:
  forProvider:
    name: {{ printf "%s-origin-pool" .name | quote }}
    description: {{ printf "Origin pool for region %s (priority %d)" .name (int .priority) | quote }}
    enabled: true
    minimumOrigins: 1
    monitor: {{ printf "%s-health-monitor" .name | quote }}
    origins:
      - name: {{ printf "%s-primary" .name | quote }}
        address: {{ .originIP | quote }}
        enabled: true
        weight: {{ div .weight 100 }}
    notificationEmail: "platform-oncall@kacho.cloud"
  providerConfigRef:
    name: cloudflare-default
---
apiVersion: cloudflare.crossplane.io/v1alpha1
kind: LoadBalancerMonitor
metadata:
  name: {{ printf "%s-health-monitor" .name | quote }}
  labels:
    kacho.cloud/component: cloudflare-lb-monitor
spec:
  forProvider:
    type: "https"
    description: {{ printf "Health monitor for region %s" .name | quote }}
    method: "GET"
    path: {{ .healthCheck.path | quote }}
    port: {{ .healthCheck.port }}
    interval: {{ .healthCheck.intervalSeconds }}
    retries: {{ .healthCheck.retries }}
    timeout: {{ .healthCheck.timeoutSeconds }}
    expectedCodes: "2xx"
    followRedirects: false
    allowInsecure: false
  providerConfigRef:
    name: cloudflare-default
{{- end }}
{{- end }}
