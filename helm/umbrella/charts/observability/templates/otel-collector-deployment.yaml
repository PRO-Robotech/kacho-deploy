{{- if .Values.observability.otelCollector.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "otel-collector"
  namespace: {{ .Values.observability.namespace | quote }}
  labels:
    kacho.cloud/component: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: kacho-iam-platform
spec:
  replicas: {{ .Values.observability.otelCollector.deployment.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: kacho-iam-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      serviceAccountName: "otel-collector"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: otel-collector
                topologyKey: "topology.kubernetes.io/zone"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: "ScheduleAnyway"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      containers:
        - name: otel-collector
          image: {{ .Values.observability.otelCollector.image | quote }}
          args:
            - "--config=/etc/otel/config.yaml"
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics
          env:
            - name: KACHO_REGION
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.labels['kacho.cloud/region']"
            - name: KACHO_CLUSTER
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.labels['kacho.cloud/cluster']"
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: {{ .Values.observability.otelCollector.deployment.resources.requests.cpu | quote }}
              memory: {{ .Values.observability.otelCollector.deployment.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.observability.otelCollector.deployment.resources.limits.cpu | quote }}
              memory: {{ .Values.observability.otelCollector.deployment.resources.limits.memory | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: "otel-collector-config"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "otel-collector"
  namespace: {{ .Values.observability.namespace | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: "otel-collector"
  namespace: {{ .Values.observability.namespace | quote }}
  labels:
    kacho.cloud/component: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8888
      targetPort: 8888
{{- end }}
