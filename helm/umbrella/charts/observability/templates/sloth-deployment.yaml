{{- if .Values.observability.sloth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "sloth"
  namespace: {{ .Values.observability.namespace | quote }}
  labels:
    kacho.cloud/component: sloth
    app.kubernetes.io/name: sloth
    app.kubernetes.io/part-of: kacho-iam-platform
spec:
  replicas: {{ .Values.observability.sloth.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sloth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sloth
        app.kubernetes.io/part-of: kacho-iam-platform
    spec:
      serviceAccountName: "sloth"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sloth
                topologyKey: "topology.kubernetes.io/zone"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: "ScheduleAnyway"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sloth
      containers:
        - name: sloth
          image: {{ .Values.observability.sloth.image | quote }}
          args:
            - "kubernetes-controller"
            - "--namespace"
            - {{ .Values.observability.namespace | quote }}
            - "--metrics-listen-address=:8081"
          ports:
            - containerPort: 8081
              name: metrics
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "sloth"
  namespace: {{ .Values.observability.namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "sloth"
rules:
  - apiGroups: ["sloth.slok.dev"]
    resources: ["prometheusservicelevels"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "sloth"
subjects:
  - kind: ServiceAccount
    name: "sloth"
    namespace: {{ .Values.observability.namespace | quote }}
roleRef:
  kind: ClusterRole
  name: "sloth"
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "sloth-slo-definitions"
  namespace: {{ .Values.observability.namespace | quote }}
  labels:
    kacho.cloud/component: sloth-slos
data:
  slos.yaml: |
{{ .Files.Get "files/slos.yaml" | indent 4 }}
{{- end }}
