apiVersion: v1
kind: ConfigMap
metadata:
  name: "alertmanager-config"
  namespace: {{ .Values.observability.namespace | quote }}
  labels:
    kacho.cloud/component: alertmanager-config
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: "smtp.{{ .Values.kacho.domain }}:587"
      smtp_from: "alertmanager@kacho.cloud"
    templates:
      - "/etc/alertmanager/templates/*.tmpl"
    route:
      receiver: default
      group_by: ["alertname", "kacho_cloud_region", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity = "P1"
          receiver: pagerduty-p1
          continue: true
        - matchers:
            - severity = "P2"
          receiver: pagerduty-p2
          continue: true
        - matchers:
            - severity = "P3"
          receiver: slack-p3
        - matchers:
            - severity = "P4"
          receiver: slack-p4
    receivers:
      - name: default
        slack_configs:
          - api_url_file: "/etc/alertmanager/secrets/slack-token"
            channel: "#kacho-iam-alerts"
            send_resolved: true
            text: |
              {{`{{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              Dashboard: {{ .Annotations.dashboard_url }}
              {{ end }}`}}
      - name: pagerduty-p1
        pagerduty_configs:
          - service_key_file: "/etc/alertmanager/secrets/pagerduty-p1-key"
            send_resolved: true
            severity: "critical"
            client: "Kachō Alertmanager"
            client_url: "https://alertmanager.{{ .Values.kacho.domain }}"
            details:
              service: "{{`{{ .CommonLabels.service }}`}}"
              region: "{{`{{ .CommonLabels.kacho_cloud_region }}`}}"
              runbook: "{{`{{ .CommonAnnotations.runbook_url }}`}}"
      - name: pagerduty-p2
        pagerduty_configs:
          - service_key_file: "/etc/alertmanager/secrets/pagerduty-p2-key"
            send_resolved: true
            severity: "error"
            client: "Kachō Alertmanager"
            client_url: "https://alertmanager.{{ .Values.kacho.domain }}"
      - name: slack-p3
        slack_configs:
          - api_url_file: "/etc/alertmanager/secrets/slack-token"
            channel: "#kacho-iam-alerts"
            send_resolved: true
      - name: slack-p4
        slack_configs:
          - api_url_file: "/etc/alertmanager/secrets/slack-token"
            channel: "#kacho-iam-info"
            send_resolved: false
    inhibit_rules:
      - source_matchers:
          - severity = "P1"
        target_matchers:
          - severity = "P2"
        equal: ["alertname", "service", "kacho_cloud_region"]
