apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "alertmanager"
  namespace: {{ .Values.observability.namespace | quote }}
  labels:
    kacho.cloud/component: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kacho-iam-platform
spec:
  serviceName: "alertmanager"
  replicas: {{ .Values.observability.alertmanager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: kacho-iam-platform
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: alertmanager
              topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: "DoNotSchedule"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      containers:
        - name: alertmanager
          image: {{ .Values.observability.alertmanager.image | quote }}
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yaml"
            - "--storage.path=/data"
            - "--cluster.listen-address=0.0.0.0:9094"
            - "--cluster.peer=alertmanager-0.alertmanager:9094"
            - "--cluster.peer=alertmanager-1.alertmanager:9094"
            - "--cluster.peer=alertmanager-2.alertmanager:9094"
            - "--web.external-url=https://alertmanager.{{ .Values.kacho.domain }}"
          ports:
            - containerPort: 9093
              name: http
            - containerPort: 9094
              name: cluster-tcp
            - containerPort: 9094
              name: cluster-udp
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: "alertmanager-config"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: "alertmanager"
  namespace: {{ .Values.observability.namespace | quote }}
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
    - name: cluster-tcp
      port: 9094
    - name: cluster-udp
      port: 9094
      protocol: UDP
  clusterIP: None
