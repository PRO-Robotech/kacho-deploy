{{- range $role, $replicas := .Values.observability.mimir.replicas }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ printf "mimir-%s" $role | quote }}
  namespace: {{ $.Values.observability.namespace | quote }}
  labels:
    kacho.cloud/component: mimir
    kacho.cloud/role: {{ $role | quote }}
    app.kubernetes.io/name: mimir
    app.kubernetes.io/component: {{ $role | quote }}
    app.kubernetes.io/part-of: kacho-iam-platform
spec:
  serviceName: {{ printf "mimir-%s" $role | quote }}
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
      app.kubernetes.io/component: {{ $role | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
        app.kubernetes.io/component: {{ $role | quote }}
        app.kubernetes.io/part-of: kacho-iam-platform
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mimir
                  app.kubernetes.io/component: {{ $role | quote }}
              topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: "DoNotSchedule"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mimir
              app.kubernetes.io/component: {{ $role | quote }}
      containers:
        - name: mimir
          image: {{ $.Values.observability.mimir.image | quote }}
          args:
            - "--target={{ $role }}"
            - "--config.file=/etc/mimir/mimir.yaml"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9095
              name: grpc
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
          resources:
            {{- with index $.Values.observability.mimir.resources $role }}
            requests:
              cpu: {{ .requests.cpu | quote }}
              memory: {{ .requests.memory | quote }}
            limits:
              cpu: {{ .limits.cpu | quote }}
              memory: {{ .limits.memory | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $.Values.observability.mimir.storage.s3.accessKeySecret | quote }}
                optional: true
      volumes:
        - name: config
          configMap:
            name: "mimir-config"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "mimir-%s" $role | quote }}
  namespace: {{ $.Values.observability.namespace | quote }}
spec:
  selector:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/component: {{ $role | quote }}
  ports:
    - name: http
      port: 8080
    - name: grpc
      port: 9095
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "mimir-config"
  namespace: {{ .Values.observability.namespace | quote }}
data:
  mimir.yaml: |
    multitenancy_enabled: false
    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
    common:
      storage:
        backend: {{ .Values.observability.mimir.storage.backend | quote }}
        s3:
          bucket_name: {{ .Values.observability.mimir.storage.s3.bucket | quote }}
          endpoint: {{ .Values.observability.mimir.storage.s3.endpoint | default "s3.amazonaws.com" | quote }}
          region: {{ .Values.observability.mimir.storage.s3.region | quote }}
    blocks_storage:
      backend: {{ .Values.observability.mimir.storage.backend | quote }}
    compactor:
      data_dir: "/data/compactor"
    ingester:
      ring:
        replication_factor: 3
    limits:
      compactor_blocks_retention_period: {{ .Values.observability.mimir.retention | quote }}
    ruler:
      rule_path: "/data/ruler"
      alertmanager_url: "http://alertmanager.{{ .Values.observability.namespace }}.svc.cluster.local:9093"
