apiVersion: v1
kind: ConfigMap
metadata:
  name: "grafana-dashboards"
  namespace: {{ .Values.observability.namespace | quote }}
  labels:
    kacho.cloud/component: grafana-dashboards
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
data:
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
