apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "tempo"
  namespace: {{ .Values.observability.namespace | quote }}
  labels:
    kacho.cloud/component: tempo
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: kacho-iam-platform
spec:
  serviceName: "tempo"
  replicas: {{ .Values.observability.tempo.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/part-of: kacho-iam-platform
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: tempo
              topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: "DoNotSchedule"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      containers:
        - name: tempo
          image: {{ .Values.observability.tempo.image | quote }}
          args:
            - "-config.file=/etc/tempo/tempo.yaml"
          ports:
            - containerPort: 3200
              name: http
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 9095
              name: grpc
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: data
              mountPath: /var/tempo
          resources:
            requests:
              cpu: {{ .Values.observability.tempo.resources.requests.cpu | quote }}
              memory: {{ .Values.observability.tempo.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.observability.tempo.resources.limits.cpu | quote }}
              memory: {{ .Values.observability.tempo.resources.limits.memory | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.observability.tempo.storage.s3.accessKeySecret | quote }}
                optional: true
      volumes:
        - name: config
          configMap:
            name: "tempo-config"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "tempo-config"
  namespace: {{ .Values.observability.namespace | quote }}
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
    storage:
      trace:
        backend: {{ .Values.observability.tempo.storage.backend | quote }}
        s3:
          bucket: {{ .Values.observability.tempo.storage.s3.bucket | quote }}
          endpoint: {{ .Values.observability.tempo.storage.s3.endpoint | default "s3.amazonaws.com" | quote }}
          region: {{ .Values.observability.tempo.storage.s3.region | quote }}
          insecure: false
    compactor:
      compaction:
        block_retention: {{ .Values.observability.tempo.retention | quote }}
    metrics_generator:
      registry:
        external_labels:
          kacho_cloud_region: "${KACHO_REGION}"
---
apiVersion: v1
kind: Service
metadata:
  name: "tempo"
  namespace: {{ .Values.observability.namespace | quote }}
spec:
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - name: http
      port: 3200
    - name: otlp-grpc
      port: 4317
    - name: grpc
      port: 9095
