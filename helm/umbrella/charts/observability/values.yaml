observability:
  namespace: "observability-system"

  # OTel Collector configuration.
  otelCollector:
    image: "otel/opentelemetry-collector-contrib:0.103.0"
    daemonSet:
      enabled: true
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: 500m, memory: 1Gi }
    deployment:
      enabled: true
      replicas: 3
      resources:
        requests: { cpu: 500m, memory: 1Gi }
        limits:   { cpu: 2000m, memory: 4Gi }
    sampling:
      controlPlane: 1.0                    # 100% sample for kacho-iam / kacho-api-gateway
      dataPlane: 0.05                      # 5% sample for kacho-vpc / kacho-compute / kacho-loadbalancer
      errorRate: 1.0                       # 100% sample for ALL errors regardless of service
    piiScrubbing:
      enabled: true
      fields:
        - "email"
        - "password"
        - "token"
        - "secret"
        - "x-api-key"
        - "authorization"

  # Tempo (traces).
  tempo:
    image: "grafana/tempo:2.6.0"
    replicas: 2
    storage:
      backend: "s3"
      s3:
        bucket: "kacho-traces-prod"
        endpoint: ""                       # AWS default; override for GCP/Azure/on-prem
        region: "eu-central-1"
        accessKeySecret: "tempo-s3-credentials"
    retention: "168h"                      # 7d
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: 2000m, memory: 4Gi }

  # Mimir (metrics — Prometheus-compatible).
  mimir:
    image: "grafana/mimir:2.13.0"
    replicas:
      ingester: 3
      querier: 3
      storeGateway: 3
      compactor: 1
      ruler: 2
    storage:
      backend: "s3"
      s3:
        bucket: "kacho-metrics-prod"
        endpoint: ""
        region: "eu-central-1"
        accessKeySecret: "mimir-s3-credentials"
    retention: "720h"                      # 30d
    resources:
      ingester:
        requests: { cpu: 1000m, memory: 4Gi }
        limits:   { cpu: 4000m, memory: 16Gi }
      querier:
        requests: { cpu: 500m, memory: 1Gi }
        limits:   { cpu: 2000m, memory: 4Gi }

  # Loki (logs).
  loki:
    image: "grafana/loki:3.1.0"
    replicas:
      ingester: 3
      querier: 3
      distributor: 3
    storage:
      backend: "s3"
      s3:
        bucket: "kacho-logs-prod"
        endpoint: ""
        region: "eu-central-1"
        accessKeySecret: "loki-s3-credentials"
    retention: "720h"                      # 30d
    resources:
      ingester:
        requests: { cpu: 500m, memory: 1Gi }
        limits:   { cpu: 2000m, memory: 4Gi }

  # Grafana (dashboards).
  grafana:
    image: "grafana/grafana:11.2.0"
    replicas: 2
    oidc:
      enabled: true
      issuer: "https://hydra.{{ .Values.kacho.domain }}"
      clientId: "grafana"
      clientSecret: "$__file{/etc/secrets/grafana/oidc-client-secret}"
      allowedDomains: "kacho.cloud"
      scopes: ["openid", "profile", "email", "groups"]
      roleAttributeStrict: true
    ingress:
      enabled: true
      host: "grafana.{{ .Values.kacho.domain }}"
      tlsSecretName: "kacho-wildcard-tls"
      certIssuer: "letsencrypt-prod"
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits:   { cpu: 1000m, memory: 1Gi }
    dashboards:
      - "iam-overview"
      - "iam-authn"
      - "iam-authz-fga"
      - "iam-audit-pipeline"
      - "iam-caep-pipeline"
      - "iam-spiffe-mesh"
      - "iam-slo-burn-rate"
      - "api-gateway-overview"
      - "vpc-overview"
      - "compute-overview"
      - "loadbalancer-overview"
      - "cross-region-replication-lag"

  # Alertmanager.
  alertmanager:
    image: "prom/alertmanager:v0.27.0"
    replicas: 3
    pagerduty:
      enabled: true
      secretName: "alertmanager-pagerduty-key"
      serviceKey: "service_key"
      severityRouting:
        P1: "critical"
        P2: "error"
        P3: "warning"
        P4: "info"
    slack:
      enabled: true
      secretName: "alertmanager-slack-token"
      channels:
        P1: "#kacho-iam-page"
        P2: "#kacho-iam-page"
        P3: "#kacho-iam-alerts"
        P4: "#kacho-iam-info"

  # Sloth (SLO controller — converts YAML SLOs into PrometheusRule CRDs).
  sloth:
    enabled: true
    image: "ghcr.io/slok/sloth:v0.11.0"
    replicas: 1
    metricsPort: 8081

kacho:
  domain: "api.kacho.local"
global:
  kacho:
    domain: ""
