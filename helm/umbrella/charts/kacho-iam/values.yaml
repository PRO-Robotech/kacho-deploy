# Default values for kacho-iam sub-chart.
# Все ключи здесь — fallback'и для umbrella values.dev.yaml (которая override'ит через
# `kacho-iam: { ... }`). НЕ ставить здесь production-secret'ы.

# Phase 2 (KAC-127) — `kacho.domain` пробрасывается из umbrella values.yaml
# через subchart-import (см. dependencies в umbrella Chart.yaml). Sub-chart
# читает `.Values.kacho.domain`, но fallback (если subchart запускается
# standalone, без umbrella) — `api.kacho.cloud`.
kacho:
  domain: api.kacho.cloud
  subdomains:
    app: app
    hydra: hydra
    kratos: kratos
    api: ""
  iam:
    jwks:
      enabled: true
      schedule: "0 2 * * *"
      rotationDays: 90
      encKeySecretName: kacho-iam-jwks-enc-key
      encKeySecretKey: enc_key
    sessionRevocations:
      cacheTTLSeconds: 5
    dpopReplay:
      cacheTTLSeconds: 120
      cacheSize: 100000
  hooks:
    tokenHookSecretName: kacho-iam-hook-token
    tokenHookSecretKey: token

# Phase 2 (KAC-127) — Kratos identity schema + config ConfigMaps. Управляются
# флагами; в Phase 2 поднимаются вместе с kacho-iam (один namespace, один Helm
# release). При желании задеплоить Kratos в отдельный namespace — отключить
# здесь и завести в стороннем chart'е.
kratos:
  identitySchema:
    enabled: true
  config:
    enabled: true
    smtp:
      connectionURI: "smtp://mailhog.kacho.svc.cluster.local:1025/?disable_starttls=true"
      fromAddress: "noreply@kacho.cloud"
      fromName: "Kacho Cloud"

# Phase 2 (KAC-127) — JWKS rotator CronJob. Image = тот же kacho-iam binary,
# entrypoint = `kacho-iam jwks rotate`. Pulls private/public keypair generator
# + Hydra-admin PUT /admin/keys из IAM service.
jwksRotator:
  # Если false — CronJob не создаётся (например, для integration-тестов с key-pinning).
  # Управляется через umbrella values: `.Values.kacho.iam.jwks.enabled`.
  # Дублируем сюда для standalone-deploy sub-chart'а.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Activity history — сколько успешных / неудачных Job'ов держать.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Block concurrent runs — advisory_lock на DB-стороне (acceptance §6.8.5)
  # дополнительно защищает, но Forbid здесь — single source-of-truth для k8s scheduler.
  concurrencyPolicy: Forbid
  # 1h deadline на каждый run; rotation сам по себе ≤ 5s, но Hydra-admin PUT
  # может ретраиться при transient errors.
  activeDeadlineSeconds: 3600

name: kacho-iam
replicas: 1
image:
  repository: kacho-iam
  tag: dev
  pullPolicy: IfNotPresent

ports:
  grpc: 9090
  internalGrpc: 9091

service:
  public:
    type: ClusterIP
    port: 9090
  internal:
    type: ClusterIP
    port: 9091

db:
  host: kacho-umbrella-pg-iam
  port: "5432"
  user: iam
  name: kacho_iam
  passwordSecretName: kacho-umbrella-pg-iam
  passwordSecretKey: password

config:
  logger:
    level: INFO
  apiServer:
    gracefulShutdown: 10s
  metrics:
    enable: true
  healthcheck:
    enable: true
  repository:
    postgres:
      maxConns: 100
      sslMode: disable
  authn:
    mode: dev
  extapi:
    # KAC-127: zitadel config удалён — identity/OIDC tier на Ory Kratos + Hydra.
    openfga:
      endpoint: openfga:8081
      storeIdSecretName: kacho-iam-openfga-store
      storeIdSecretKey: store_id
      # KAC-127 Phase 3 — Check timing budgets (acceptance §4.4):
      checkTimeoutMs: 200          # FGA Check hard ceiling
      listObjectsTimeoutMs: 1000   # ListObjects (Phase 4) hard ceiling
      checkCacheTtlSeconds: 5      # subject-level Check cache TTL (LISTEN-invalidated)
  # KAC-127 Phase 3 — authz core (Conditions context + OPA sidecar contract).
  authz:
    conditions:
      contextCacheTtlSeconds: 60   # short-lived per-Principal Conditions context cache
    opaSidecar:
      url: http://localhost:8181
      timeoutMs: 100
      # read-fail-open=false → fail-closed even for read RPCs (production-safe).
      # Set to true ONLY for read-only emergencies (logged WARN + Critical alert).
      readFailOpen: false

initContainer:
  migrator:
    enabled: true
    command: ["/usr/local/bin/kacho-migrator", "up"]
  # wait-for-openfga init-container. На E0/E1 (без auth) — ставь false
  # (OpenFGA ещё не задеплоен, pod иначе застрянет в Init).
  # На E2/E3 — true (стандартная gate-проверка startup-порядка).
  waitForExtAuth:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

env: {}

# ─── KAC-127 Phase 3 — OPA sidecar + OpenFGA model id ────────────────────
# Fallback defaults if umbrella does not override. Umbrella's `opaSidecar.*`
# section (in values.yaml at top-level) propagates here via subchart import
# (Helm rule: subchart can read parent values only via `--set` or aliasing;
# we therefore mirror minimal knobs here for standalone-deploy).
opaSidecar:
  enabled: false   # Disabled by default in sub-chart standalone; umbrella enables.
  image: openpolicyagent/opa:1.0.0-rootless
  logLevel: info
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  jwks:
    configMapName: kacho-iam-jwks

# Mirror knob — `openfga-bootstrap-job` writes here at install/upgrade.
openfgaBootstrap:
  modelIdSecretName: openfga-model-id

# ─── KAC-127 Phase 9 — Audit pipeline (sub-phase 3.9) ─────────────────────
# Все ключи configurable; HSM provider / S3 endpoint / SIEM providers — env-
# specific (dev / staging / prod). На kind/dev — audit.enabled=false
# (drainer работает в pg_notify mode, без OLAP/S3/HSM/SIEM).
#
# Соответствует acceptance:
#   - §2.5 (Kafka topics)
#   - §2.6 (ClickHouse schema)
#   - §2.7 (S3 layout + lifecycle)
#   - §2.8 (HSM signing contract — PKCS#11 + ECDSA P-384)
#   - §2.9 (SIEM webhook protocol)
#   - §2.10 (Detection rules library — 8 rules)
#   - §4.1 (data flow)
#   - D-3 / D-5 / D-7 / D-9 / D-13 / D-15 / D-17
audit:
  # Master toggle для всего audit pipeline на стороне kacho-iam Helm chart.
  # При false — chart НЕ создаёт audit-related CronJob'ы / Deployment'ы /
  # ConfigMaps / NetworkPolicies (drainer работает только в pg_notify mode).
  enabled: false

  # ─── Merkle batch signer ────────────────────────────────────────────
  # CronJob */5 * * * * (P9-D7). 5-min window — баланс между S3 object
  # count и tamper-blast-radius.
  merkleBatchSchedule: "*/5 * * * *"
  merkleBatchActiveDeadlineSeconds: 240

  # ─── Independent verifier ────────────────────────────────────────────
  # Daily 02:00 UTC (P9-D13).
  verifierSchedule: "0 2 * * *"
  verifier:
    # Sample ratio для S3 download verification (P9-D27).
    # 0.01 = 1/100 batches — full-jsonl-recompute; rest — manifest-only verify.
    s3SampleRatio: "0.01"

  # ─── Kafka connection (umbrella reads from kafka subchart) ─────────
  kafka:
    bootstrapServers: "kacho-umbrella-kafka-bootstrap:9092"

  # ─── S3 cold storage ──────────────────────────────────────────────
  # Configurable bucket + endpoint. На prod — обязательно override.
  s3:
    # Bucket name. PROD: override via umbrella values. dev: MinIO compat.
    bucket: ""
    # Endpoint URL. Пусто = AWS S3 (region-based); override для MinIO /
    # Wasabi / Cloudflare R2.
    endpoint: ""
    region: us-east-1
    # IAM credentials. Через external-secrets-operator на prod.
    accessKeySecretName: kacho-audit-s3-creds
    accessKeySecretKey: AWS_ACCESS_KEY_ID
    secretKeySecretName: kacho-audit-s3-creds
    secretKeySecretKey: AWS_SECRET_ACCESS_KEY

  # ─── Retention tiers ────────────────────────────────────────────────
  # Соответствует acceptance §2.7 lifecycle table + P9-D8.
  retention:
    # ClickHouse hot tier (TTL DELETE per partition).
    hot: 90d
    # S3 Standard tier.
    warmStandard: 30d
    # S3 Standard-IA tier (after warmStandard).
    warmIA: 1y
    # S3 Glacier Deep Archive tier (after warmIA).
    cold: 10y

  # ─── HSM PKCS#11 (configurable provider) ────────────────────────────
  # Соответствует acceptance §2.8 + P9-D9 + P9-D10.
  hsm:
    # provider: softhsm | awscloudhsm | gcpcloudhsm | azurekv | thalesluna
    # PROD: НИКОГДА softhsm (dev only — explicitly marked).
    provider: softhsm

    # PKCS#11 library path per provider.
    libraryPath: /usr/lib/softhsm/libsofthsm2.so

    # PKCS#11 slot id.
    slot: 0

    # Token label (configured при создании token via softhsm2-util / vendor tool).
    tokenLabel: kacho-audit-signing

    # Key label (configured при keypair generation).
    # Rotation: yearly label `kacho-audit-merkle-<year+1>` (P9-D28 dual-sign 7d).
    keyLabel: kacho-audit-merkle-2026

    # Signing algorithm: ECDSA P-384 (FIPS 140-2 Level 3 acceptable).
    signingAlgorithm: ECDSA-P384-SHA384

    # PIN Secret name. Externally-managed (sealed-secrets / external-secrets).
    pinSecret: kacho-iam-hsm-pin

  # ─── SIEM forwarders ─────────────────────────────────────────────────
  # Соответствует acceptance §2.9 + P9-D15..D17, D-25.
  siem:
    enabled: false
    replicas: 2

    # Auto-disable threshold (P9-D17): consecutive 4xx (non-429) → disabled=true.
    autoDisableThreshold: 5

    # Per-subscriber rate-limit (events/sec) — Datadog HEC default.
    rateLimitEventsPerSec: 100

    # Per-provider toggles. Subscribers tenant-scoped (siem_subscribers row),
    # provider-toggles infra-scoped (drainer compiles in provider client).
    datadog:
      enabled: true
    splunk:
      enabled: true
    elastic:
      enabled: true
    genericWebhook:
      enabled: true

  # ─── NetworkPolicies (defense-in-depth) ──────────────────────────────
  networkPolicy:
    enabled: false
    # HSM endpoint CIDRs (whitelisted egress from signer + verifier pods).
    # PROD: AWS CloudHSM ENI CIDR; GCP/Azure — VPN/PrivateLink endpoints.
    hsmEndpoints: []
    # Пример:
    #   - cidr: "10.100.0.0/24"
    #     port: 2223
    #   - cidr: "10.100.0.0/24"
    #     port: 2224

  # ─── Prometheus alerts ───────────────────────────────────────────────
  prometheusRules:
    enabled: true
