title: Mass Deletion
id: kacho-audit-rule-03-mass-deletion
description: |
  Detects >100 *.deleted events from same actor_id in 5-min window.
  Indicator of compromised credentials or insider attack. Phase 9 §2.10
  rule #3. Severity Critical.
status: stable
author: Kacho Cloud Security
date: 2026-05-19
references:
  - https://attack.mitre.org/techniques/T1485/  # Data Destruction
tags:
  - attack.impact
  - attack.t1485
logsource:
  product: kacho_iam
  category: resource_lifecycle
detection:
  selection:
    event_type|endswith: '.deleted'
  timeframe: 5m
  condition: selection | count() by actor_id > 100
fields:
  - actor_id
  - actor_ip
  - event_type
  - target_id
falsepositives:
  - Legitimate bulk cleanup (rare; should use admin tooling that bypasses
    audit-rate-detection via explicit `audit.bulk_cleanup=true` claim)
  - CI/CD test cleanup harness (should be SA with marked claim)
level: critical
response:
  action: auto_revoke_session
  notification: pagerduty_p1
