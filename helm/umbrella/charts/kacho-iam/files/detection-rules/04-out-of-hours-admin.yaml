title: Out-of-Hours Admin Activity
id: kacho-audit-rule-04-out-of-hours-admin
description: |
  Detects admin-level action outside tenant configured business_hours.
  Phase 9 §2.10 rule #4. Severity Medium.
status: stable
author: Kacho Cloud Security
date: 2026-05-19
tags:
  - attack.persistence
logsource:
  product: kacho_iam
  category: admin_action
detection:
  selection:
    actor.role: 'admin'
  filter_business_hours:
    timestamp_in_business_hours: true
  condition: selection and not filter_business_hours
fields:
  - actor_id
  - event_type
  - target_id
  - timestamp
falsepositives:
  - On-call admin (should mark session with `oncall=true` claim)
  - Different timezone admin (tenant should configure business_hours per actor)
level: medium
response:
  action: slack_notify
  notification: audit_review_queue
