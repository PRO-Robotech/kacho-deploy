{{- if and .Values.audit.enabled .Values.audit.siem.enabled }}
{{/*
KAC-127 Phase 9 — SIEM forwarder Deployment (P9-D15, P9-D16, P9-D17, P9-D25).

One pod runs forwarder for ALL subscribers; per-subscriber Kafka consumer
group inside the binary. Scales horizontally — each subscriber's CG has
single owner, kacho-iam siem_subscribers table tracks pod assignment.

Supported providers (per-subscriber via siem_subscribers.provider field):
  - DATADOG_HEC          → POST https://http-intake.logs.datadoghq.com/api/v2/logs
  - SPLUNK_HEC           → POST https://<splunk>:8088/services/collector
  - ELASTIC_BULK         → POST https://<elastic>:9200/_bulk
  - GENERIC_WEBHOOK      → POST <configured>, JWT bearer signed by kacho-iam JWKS

Top-level audit.siem.<provider>.enabled gates whether provider config is
emitted in env (subscriber rows are tenant-scoped runtime config; HCL is
infra-scoped on-by-default).

Failure handling per P9-D17: 4xx (non-429) → failure_count++; ≥5 → enabled=false
+ tenant admin alert. Auto-disable persisted в siem_subscribers row через
service-RPC `InternalSIEMService.DisableSubscriber`.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kacho-iam.fullname" . }}-siem-forwarder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kacho-iam.labels" . | nindent 4 }}
    kacho.cloud/component: siem-forwarder
spec:
  replicas: {{ .Values.audit.siem.replicas | default 2 }}
  selector:
    matchLabels:
      app: {{ include "kacho-iam.fullname" . }}-siem-forwarder
  template:
    metadata:
      labels:
        app: {{ include "kacho-iam.fullname" . }}-siem-forwarder
        {{- include "kacho-iam.labels" . | nindent 8 }}
        kacho.cloud/component: siem-forwarder
      annotations:
        checksum/siem-config: {{ .Values.audit.siem | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ include "kacho-iam.fullname" . }}
      containers:
        - name: siem-forwarder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/kacho-iam", "audit", "siem-forward"]
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: KACHO_IAM_CONFIG_PATH
              value: /etc/kacho-iam/config.yaml
            - name: KACHO_IAM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
            - name: KACHO_AUDIT_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.audit.kafka.bootstrapServers | quote }}
            - name: KACHO_AUDIT_KAFKA_TOPIC
              value: kacho-audit-events.shared
            - name: KACHO_AUDIT_KAFKA_SASL_USERNAME
              value: kacho-iam-audit-siem-forwarder
            - name: KACHO_AUDIT_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-scram-kacho-iam-siem-forwarder
                  key: password
                  optional: true
            - name: KACHO_AUDIT_SIEM_DATADOG_ENABLED
              value: {{ .Values.audit.siem.datadog.enabled | quote }}
            - name: KACHO_AUDIT_SIEM_SPLUNK_ENABLED
              value: {{ .Values.audit.siem.splunk.enabled | quote }}
            - name: KACHO_AUDIT_SIEM_ELASTIC_ENABLED
              value: {{ .Values.audit.siem.elastic.enabled | quote }}
            - name: KACHO_AUDIT_SIEM_GENERIC_WEBHOOK_ENABLED
              value: {{ .Values.audit.siem.genericWebhook.enabled | quote }}
            - name: KACHO_AUDIT_SIEM_AUTO_DISABLE_THRESHOLD
              value: {{ .Values.audit.siem.autoDisableThreshold | default 5 | quote }}
            - name: KACHO_AUDIT_SIEM_RATE_LIMIT_EVENTS_PER_SEC
              value: {{ .Values.audit.siem.rateLimitEventsPerSec | default 100 | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/kacho-iam
              readOnly: true
            - name: detection-rules
              mountPath: /etc/kacho-iam/detection-rules
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: {{ include "kacho-iam.fullname" . }}-config
        - name: detection-rules
          configMap:
            name: {{ include "kacho-iam.fullname" . }}-detection-rules
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kacho-iam.fullname" . }}-siem-forwarder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kacho-iam.labels" . | nindent 4 }}
    kacho.cloud/component: siem-forwarder
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9090
  selector:
    app: {{ include "kacho-iam.fullname" . }}-siem-forwarder
{{- end }}
