{{- if .Values.audit.enabled }}
{{/*
KAC-127 Phase 9 — Runbook ConfigMap (audit-pipeline-incident.md).

Mounted into kacho-iam pods at /etc/kacho-iam/runbooks/ для self-service ops
+ also available на Grafana dashboard panel "Runbook URL" (см. annotations).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kacho-iam.fullname" . }}-runbooks
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kacho-iam.labels" . | nindent 4 }}
    kacho.cloud/component: runbooks
data:
  audit-pipeline-incident.md: |
{{ .Files.Get "files/runbooks/audit-pipeline-incident.md" | indent 4 }}
{{- end }}
