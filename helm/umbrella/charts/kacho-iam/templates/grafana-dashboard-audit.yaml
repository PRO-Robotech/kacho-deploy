{{- if .Values.audit.enabled }}
{{/*
KAC-127 Phase 9 — Grafana dashboard ConfigMap for audit pipeline observability.

Provisioned via grafana-operator (label app.kubernetes.io/name=grafana picks
ConfigMaps with `grafana_dashboard=1` annotation).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kacho-iam.fullname" . }}-grafana-dashboard-audit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kacho-iam.labels" . | nindent 4 }}
    kacho.cloud/component: grafana-dashboard
    grafana_dashboard: "1"
data:
  audit-pipeline.json: |
{{ .Files.Get "files/grafana-dashboards/audit-pipeline.json" | indent 4 }}
{{- end }}
