{{- if and .Values.audit.enabled (eq .Values.audit.hsm.provider "softhsm") }}
{{/*
KAC-127 Phase 9 — DEV-ONLY: SoftHSM PIN bootstrap Secret.

PROD: НЕ создавать через Helm. Использовать external-secrets / sealed-secrets.

Этот manifest emit-ится ТОЛЬКО для provider=softhsm (dev). На любом
другом provider (AWS/GCP/Azure/Thales) PIN управляется externally.

ВНИМАНИЕ: PIN-значение генерится Helm'ом — не стабильно между upgrade'ами
без --set audit.hsm.pinValue=<fixed>. На dev это OK; на staging — pin'ить.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.audit.hsm.pinSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kacho-iam.labels" . | nindent 4 }}
    kacho.cloud/component: hsm-pin
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  pin: {{ default (randAlphaNum 16) .Values.audit.hsm.pinValue | quote }}
  so_pin: {{ default (randAlphaNum 16) .Values.audit.hsm.soPinValue | quote }}
{{- end }}
{{- if and .Values.audit.enabled (ne .Values.audit.hsm.provider "softhsm") }}
{{/*
PROD providers: Secret ДОЛЖЕН существовать в namespace до Helm install.
Создать через external-secrets-operator example:

  apiVersion: external-secrets.io/v1beta1
  kind: ExternalSecret
  metadata:
    name: {{ .Values.audit.hsm.pinSecret }}
  spec:
    secretStoreRef:
      name: kacho-vault-store
      kind: ClusterSecretStore
    target:
      name: {{ .Values.audit.hsm.pinSecret }}
    data:
      - secretKey: pin
        remoteRef:
          key: kacho/iam/audit/hsm/pin
*/}}
{{- end }}
