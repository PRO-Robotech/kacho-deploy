{{- if .Values.audit.networkPolicy.openfgaIngressFromIamOnly.enabled }}
{{- $np := .Values.audit.networkPolicy.openfgaIngressFromIamOnly }}
{{/*
SEC-F-12 — OpenFGA ingress allowlist (defense-in-depth, requirement #6).

After SEC-D, vpc/compute/nlb no longer dial OpenFGA directly — they go through
InternalIAMService.RegisterResource. So OpenFGA ingress can be cut to kacho-iam
only: even a compromised module cannot reach FGA out-of-band. Selector style
matches networkpolicy-audit.yaml (app.kubernetes.io/name, NOT legacy `app=`).
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kacho-iam.fullname" . }}-openfga-ingress-from-iam-only
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kacho-iam.labels" . | nindent 4 }}
    kacho.cloud/component: networkpolicy-openfga
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $np.openfgaName | quote }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "kacho-iam.fullname" . }}
      ports:
        - port: {{ $np.grpcPort }}
          protocol: TCP
        - port: {{ $np.httpPort }}
          protocol: TCP
{{- end }}
