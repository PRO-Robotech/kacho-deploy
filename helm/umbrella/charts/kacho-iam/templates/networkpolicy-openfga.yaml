{{- if .Values.audit.networkPolicy.openfgaIngressFromIamOnly.enabled }}
{{- $np := .Values.audit.networkPolicy.openfgaIngressFromIamOnly }}
{{/*
SEC-F-12 — OpenFGA ingress allowlist (defense-in-depth, requirement #6).

After SEC-D, vpc/compute/nlb no longer dial OpenFGA directly — they go through
InternalIAMService.RegisterResource. So OpenFGA ingress can be cut to kacho-iam
only: even a compromised module cannot reach FGA out-of-band. Selector style
matches networkpolicy-audit.yaml (app.kubernetes.io/name, NOT legacy `app=`).
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kacho-iam.fullname" . }}-openfga-ingress-from-iam-only
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kacho-iam.labels" . | nindent 4 }}
    kacho.cloud/component: networkpolicy-openfga
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $np.openfgaName | quote }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "kacho-iam.fullname" . }}
      ports:
        - port: {{ $np.grpcPort }}
          protocol: TCP
        - port: {{ $np.httpPort }}
          protocol: TCP
{{- if $np.bootstrapComponent }}
    {{/*
    SEC-F-12 — the OpenFGA store+model bootstrap (helm post-install Job) seeds
    FGA over HTTP. It is provisioning infra, NOT a runtime FGA dialer, so it is
    allowed by its OWN component label (the app.kubernetes.io/name allowlist
    above stays exactly kacho-iam) and ONLY on the HTTP port — least-privilege.
    Without this the iam-only allowlist blocks the hook and `helm --wait` hangs.
    */}}
    - from:
        - podSelector:
            matchLabels:
              kacho.cloud/component: {{ $np.bootstrapComponent | quote }}
      ports:
        - port: {{ $np.httpPort }}
          protocol: TCP
{{- end }}
{{- end }}
