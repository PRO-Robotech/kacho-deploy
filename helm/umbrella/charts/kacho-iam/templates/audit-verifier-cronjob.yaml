{{- if .Values.audit.enabled }}
{{/*
KAC-127 Phase 9 — Independent audit verifier CronJob (P9-D13, P9-D14, P9-D27).

Schedule: daily 02:00 UTC (configurable via audit.verifierSchedule).

ReadOnly credentials (separation of duties):
  - Postgres user: `kacho_audit_verifier` (SELECT-only на audit_signing_batches)
  - HSM key: verify-only role (cannot sign — `pkcs11_verify_only` flag)
  - S3 bucket: ReadOnly IAM role

Algorithm (P9-D27 full walk):
  1. SELECT batch_id, batch_seq, batch_hash, previous_batch_hash, merkle_root,
            signing_key_id, signature_b64, s3_manifest_uri
     FROM audit_signing_batches ORDER BY batch_seq ASC;
  2. For each batch:
       a. Download s3_manifest_uri
       b. HSM verify signature against (batch_hash || previous_batch_hash || ...)
       c. Verify chain link: previous_batch_hash == prev row's batch_hash
       d. Sample 1/100 — download <batch_id>.jsonl.gz, recompute Merkle root,
          compare с manifest.merkle_root
  3. INSERT audit_verifier_runs (run_id, ..., anomalies_found, anomaly_batch_ids)
  4. For each anomaly:
       - PagerDuty P0 incident `incident_key=audit-tamper-<batch_id>`
       - Slack #security-critical webhook
       - Email security@kacho.cloud (+ CISO mobile SMS via PagerDuty)
       - UPDATE audit_signing_batches.verifier_status = 'verified_broken',
                                     verifier_alert_id = <pagerduty_key>

Worker entrypoint: `kacho-iam audit verify` (single-shot run, exits 0 even on
anomaly — anomaly counted in metrics + alerts; exit non-zero ТОЛЬКО на
infrastructure error).
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kacho-iam.fullname" . }}-audit-verifier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kacho-iam.labels" . | nindent 4 }}
    kacho.cloud/component: audit-verifier
spec:
  schedule: {{ .Values.audit.verifierSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 14
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 3
      # Full walk при 10k batches × 50ms HSM verify = 8min; full S3 sample
      # walk (1/100) добавляет ~30min на 30d cycle. Daily — 4h reasonable.
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            {{- include "kacho-iam.labels" . | nindent 12 }}
            kacho.cloud/component: audit-verifier
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          serviceAccountName: {{ include "kacho-iam.fullname" . }}-audit-verifier
          containers:
            - name: verifier
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/usr/local/bin/kacho-iam", "audit", "verify"]
              env:
                - name: KACHO_IAM_CONFIG_PATH
                  value: /etc/kacho-iam/config.yaml
                # ReadOnly Postgres user.
                - name: KACHO_IAM_DB_USER
                  value: kacho_audit_verifier
                - name: KACHO_IAM_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: kacho-iam-audit-verifier-db
                      key: password
                - name: KACHO_AUDIT_HSM_CONFIG_PATH
                  value: /etc/kacho-iam/hsm/hsm.json
                - name: KACHO_AUDIT_HSM_VERIFY_ONLY
                  value: "true"
                - name: KACHO_HSM_PIN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.audit.hsm.pinSecret }}
                      key: pin
                      optional: true
                - name: KACHO_AUDIT_S3_BUCKET
                  value: {{ .Values.audit.s3.bucket | quote }}
                - name: KACHO_AUDIT_S3_ENDPOINT
                  value: {{ .Values.audit.s3.endpoint | quote }}
                - name: KACHO_AUDIT_S3_REGION
                  value: {{ .Values.audit.s3.region | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: kacho-audit-verifier-s3-creds
                      key: AWS_ACCESS_KEY_ID
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: kacho-audit-verifier-s3-creds
                      key: AWS_SECRET_ACCESS_KEY
                      optional: true
                - name: KACHO_AUDIT_VERIFIER_S3_SAMPLE_RATIO
                  value: {{ .Values.audit.verifier.s3SampleRatio | default "0.01" | quote }}
                - name: KACHO_AUDIT_VERIFIER_PAGERDUTY_INTEGRATION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: kacho-audit-pagerduty
                      key: integration_key
                      optional: true
                - name: KACHO_AUDIT_VERIFIER_SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: kacho-audit-slack-webhook
                      key: url
                      optional: true
              volumeMounts:
                - name: config
                  mountPath: /etc/kacho-iam
                  readOnly: true
                - name: hsm-config
                  mountPath: /etc/kacho-iam/hsm
                  readOnly: true
              resources:
                requests:
                  cpu: 1000m
                  memory: 2Gi
                limits:
                  cpu: 4000m
                  memory: 8Gi
          volumes:
            - name: config
              configMap:
                name: {{ include "kacho-iam.fullname" . }}-config
            - name: hsm-config
              configMap:
                name: {{ include "kacho-iam.fullname" . }}-hsm-pkcs11
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kacho-iam.fullname" . }}-audit-verifier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kacho-iam.labels" . | nindent 4 }}
    kacho.cloud/component: audit-verifier
{{- end }}
