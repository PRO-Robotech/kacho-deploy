{{- if .Values.audit.enabled }}
{{/*
KAC-127 Phase 9 — HSM PKCS#11 client config (multi-provider support).

Configurable via `.Values.audit.hsm.provider`:
  - softhsm        — SoftHSM2 (dev only, marked explicitly)
  - awscloudhsm    — AWS CloudHSM
  - gcpcloudhsm    — GCP Cloud HSM (через PKCS#11 plugin)
  - azurekv        — Azure Key Vault Managed HSM
  - thalesluna     — Thales Luna Network HSM (on-prem)

Каждый provider требует:
  - PKCS#11 library path (`libraryPath`)
  - Slot id (`slot`)
  - Token label (`tokenLabel`)
  - Key label (`keyLabel`)
  - PIN secret (externally managed; `pinSecret`)

PIN-секреты — externally managed (sealed-secrets / external-secrets-operator /
HashiCorp Vault). Этот ConfigMap содержит ТОЛЬКО non-sensitive config; PIN
монтируется отдельным volume из Secret (см. hsm-key-secret.yaml comments).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kacho-iam.fullname" . }}-hsm-pkcs11
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kacho-iam.labels" . | nindent 4 }}
    kacho.cloud/component: hsm-pkcs11
data:
  hsm.json: |
    {
      "provider": {{ .Values.audit.hsm.provider | quote }},
      "library_path": {{ .Values.audit.hsm.libraryPath | quote }},
      "slot": {{ .Values.audit.hsm.slot }},
      "token_label": {{ .Values.audit.hsm.tokenLabel | quote }},
      "key_label": {{ .Values.audit.hsm.keyLabel | quote }},
      "signing_algorithm": {{ .Values.audit.hsm.signingAlgorithm | quote }},
      "pin_env": "KACHO_HSM_PIN"
    }

  # Provider-specific helper notes (for ops).
  README.md: |
    # HSM PKCS#11 Provider: {{ .Values.audit.hsm.provider }}

    ## Library path
    {{ .Values.audit.hsm.libraryPath }}

    {{- if eq .Values.audit.hsm.provider "softhsm" }}
    ## SoftHSM (DEV ONLY — NOT FOR PRODUCTION)
    Initialize token (one-time):
        softhsm2-util --init-token --slot 0 --label kacho-audit-signing \
            --pin <PIN> --so-pin <SO-PIN>
    Generate ECDSA P-384 key:
        pkcs11-tool --module /usr/lib/softhsm/libsofthsm2.so \
            --login --pin <PIN> --keypairgen --key-type EC:secp384r1 \
            --label "kacho-audit-merkle-2026"

    {{- else if eq .Values.audit.hsm.provider "awscloudhsm" }}
    ## AWS CloudHSM
    Library: /opt/cloudhsm/lib/libcloudhsm_pkcs11.so
    User creation in CloudHSM cluster (cloudhsm_mgmt_util):
        createUser CU kacho-audit-signer '<PIN>'
    Key generation (key_mgmt_util):
        genECCKeyPair -i 16 -l kacho-audit-merkle-2026 -id 1
    Requires VPC peering или PrivateLink to CloudHSM ENI.

    {{- else if eq .Values.audit.hsm.provider "gcpcloudhsm" }}
    ## GCP Cloud HSM
    Uses libkmsp11 (KMS PKCS#11 plugin).
    Service account: kacho-iam-hsm-signer@<project>.iam.gserviceaccount.com
    Required IAM role: roles/cloudkms.signerVerifier на ключ-resource.
    Token = project + location + keyring.

    {{- else if eq .Values.audit.hsm.provider "azurekv" }}
    ## Azure Key Vault Managed HSM
    PKCS#11 plugin: libazurekv-pkcs11.so (community-supported) или direct
    REST API (recommended).
    Workload identity (federated via OIDC) — рекомендуемый auth path.
    Token = vault-uri; key-label = key-name within vault.

    {{- else if eq .Values.audit.hsm.provider "thalesluna" }}
    ## Thales Luna Network HSM (on-prem)
    Library: /usr/safenet/lunaclient/lib/libCryptoki2_64.so
    Client cert: /etc/Chrystoki.conf points to /var/CryptoServer/cert/...
    PIN — partition PIN ('CO' / 'PU' depending on role).
    Required: ProtectServer / Luna Network appliance reachable on TCP/1792.
    {{- end }}

    ## Key rotation
    Phase 9 D-28: dual-sign 7d window.
      1. Generate new key with label `kacho-audit-merkle-<year+1>`
      2. Update `audit.hsm.keyLabel` value → helm upgrade
      3. Old key remains valid для verify-only 7 days (deploy.cleanupAfter=168h)
      4. After 7d — remove old key from HSM via provider-specific tool
{{- end }}
