apiVersion: v2
name: spire-server
version: 0.1.0
appVersion: "1.9.6"
description: |
  KAC-127 Phase 10 (sub-phase 3.10 IAM SPIFFE/SPIRE + Cilium mesh) — SPIRE
  Server StatefulSet (HA).

  Конфигурация по acceptance §3 + Decision Log P10-D1 / P10-D3 / P10-D4 / P10-D17:
    - 3 replicas StatefulSet, anti-affinity per AZ/node.
    - Postgres-backed DataStore (schema `spire_server` в shared Postgres-инстансе
      `kacho_spire`, либо отдельный CloudSQL HA instance в prod — управляется
      через `dataStore.connectionString`).
    - Trust domain — **configurable parameter** `{{ .Values.spire.server.trustDomain }}`
      (defaults: dev=`kacho.dev.cloud`, staging=`kacho.staging.cloud`,
      prod=`kacho.cloud`). НИ В КОЕМ СЛУЧАЕ не хардкодить.
    - Upstream CA: PKCS#11 plugin → backed by AWS CloudHSM / GCP Cloud HSM
      (prod) или SoftHSM2 (dev/staging). Plugin провайдер выбирается через
      `spire.server.ca.plugin` = `pkcs11|disk|memory`.
    - CA TTL = 168h (7d auto-rotating); leaf SVID TTL = 3600s (1h).
    - Federation bundles endpoint enabled (для cross-cluster Phase 11).
    - JWT SVIDs enabled (для legacy clients, не используется внутри Kachō).
    - Leader-election через k8s Lease (`coordination.k8s.io/Lease`) для CA
      signing operations — только leader подписывает; followers serve
      attestation reads.
    - HSM unavailable = fail-closed для new issuance, existing SVIDs continue
      until expiry (max 1h) — P10-D17.
type: application
keywords:
  - spire
  - spiffe
  - workload-identity
  - mtls
  - mesh
home: https://github.com/PRO-Robotech/kacho-deploy
maintainers:
  - name: Kacho Cloud
    email: platform@kacho.cloud
