{{- /*
  Initialize the kacho_spire database for SPIRE Server DataStore.

  Pattern parallels openfga-postgres-init-job in umbrella — runs once when
  initDatabase=true; idempotent (CREATE DATABASE IF NOT EXISTS via DO block).
*/ -}}
{{- if .Values.dataStore.initDatabase | default false }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "spire-server.fullname" . }}-pg-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spire-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "spire-server.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pg-init
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: {{ .Values.dataStore.initJob.host | quote }}
            - name: PGPORT
              value: {{ .Values.dataStore.initJob.port | default "5432" | quote }}
            - name: PGUSER
              value: {{ .Values.dataStore.initJob.adminUser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dataStore.initJob.adminPasswordSecretName }}
                  key: {{ .Values.dataStore.initJob.adminPasswordSecretKey }}
            - name: SPIRE_DB
              value: {{ .Values.dataStore.initJob.database | quote }}
            - name: SPIRE_USER
              value: {{ .Values.dataStore.initJob.user | quote }}
            - name: SPIRE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dataStore.passwordSecretName }}
                  key: {{ .Values.dataStore.passwordSecretKey }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Create user if not exists.
              psql -v ON_ERROR_STOP=1 -d postgres <<-EOSQL
                DO \$\$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '${SPIRE_USER}') THEN
                    CREATE ROLE ${SPIRE_USER} LOGIN PASSWORD '${SPIRE_PASSWORD}';
                  END IF;
                END
                \$\$;
              EOSQL
              # Create database if not exists.
              if ! psql -tA -d postgres -c "SELECT 1 FROM pg_database WHERE datname='${SPIRE_DB}'" | grep -q 1; then
                psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ${SPIRE_DB} OWNER ${SPIRE_USER};"
              fi
              # Grant.
              psql -v ON_ERROR_STOP=1 -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE ${SPIRE_DB} TO ${SPIRE_USER};"
              echo "spire-server: database ${SPIRE_DB} ready"
{{- end }}
