{{- /*
  Post-install Job that registers SPIFFE identities for each Kachō service.

  Implementation: runs spire-server CLI (`/opt/spire/bin/spire-server entry create`)
  against the leader via headless service.

  Idempotent: `entry create` with same selectors + spiffeID returns "Entry already
  exists" — captured in shell guard (grep -v "already exists").

  Selectors per P10-D9: k8s_psat (ns + sa) AND cosign:image_id_<fingerprint>.
  cosign fingerprint configurable via `spireRegistration.cosignFingerprint`.

  Registration entries declared in `.Values.registrations[]` — Argo CD reconciler
  watches kacho-deploy/spire-registration/*.yaml in Phase 11. In Phase 10, the
  list is rendered from Helm values (production-ready, declarative).
*/ -}}
{{- if .Values.registrations.enabled | default true }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "spire-server.fullname" . }}-bootstrap-entries
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spire-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "spire-server.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "spire-server.serviceAccountName" . }}
      containers:
        - name: register
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SERVER_ADDR
              value: "{{ include "spire-server.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local"
            - name: TRUST_DOMAIN
              value: {{ include "spire-server.trustDomain" . | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Wait for SPIRE Server to be reachable.
              for i in $(seq 1 60); do
                if /opt/spire/bin/spire-server healthcheck \
                   -socketPath /tmp/spire-server/private/api.sock 2>/dev/null; then
                  break
                fi
                echo "Waiting for SPIRE Server ($i/60)..."
                sleep 2
              done

              # Register entries — idempotent.
              # Trust-domain templated at render time; entries declared with
              # spiffe://kacho.cloud/* pattern are auto-rewritten to match
              # chart-level trustDomain override.
              {{- $trustDomain := include "spire-server.trustDomain" . }}
              {{- range .Values.registrations.entries }}
              {{- $sid := .spiffeId | replace "spiffe://kacho.cloud/" (printf "spiffe://%s/" $trustDomain) }}
              {{- $pid := .parentId | replace "spiffe://kacho.cloud/" (printf "spiffe://%s/" $trustDomain) }}
              echo "Registering: {{ $sid }}"
              /opt/spire/bin/spire-server entry create \
                -socketPath /tmp/spire-server/private/api.sock \
                -parentID "{{ $pid }}" \
                -spiffeID "{{ $sid }}" \
                {{- range .selectors }}
                -selector "{{ .type }}:{{ .value }}" \
                {{- end }}
                -ttl {{ .ttl | default 3600 }} \
                {{- if .admin }}
                -admin \
                {{- end }}
                {{- if .downstream }}
                -downstream \
                {{- end }}
                2>&1 | grep -v "already exists" || true
              {{- end }}
              echo "SPIFFE registrations applied"
          volumeMounts:
            - name: spire-server-socket
              mountPath: /tmp/spire-server/private
      volumes:
        - name: spire-server-socket
          emptyDir: {}
{{- end }}
