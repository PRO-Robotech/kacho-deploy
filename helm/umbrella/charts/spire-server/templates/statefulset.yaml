apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "spire-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spire-server.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "spire-server.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "spire-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spire-server.selectorLabels" . | nindent 8 }}
        {{- include "spire-server.labels" . | nindent 8 }}
      annotations:
        kacho.cloud/config-hash: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum | trunc 12 }}
    spec:
      serviceAccountName: {{ include "spire-server.serviceAccountName" . }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinity.type "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "spire-server.selectorLabels" . | nindent 18 }}
              topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "spire-server.selectorLabels" . | nindent 20 }}
                topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
          {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spire-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-config"
            - "/run/spire/config/server.conf"
            {{- if .Values.leaderElection.enabled }}
            - "-expandEnv"
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KACHO_TRUST_DOMAIN
              value: {{ include "spire-server.trustDomain" . | quote }}
            {{- if eq .Values.ca.plugin "pkcs11" }}
            - name: PKCS11_PIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ca.pkcs11.pinSecretName }}
                  key: {{ .Values.ca.pkcs11.pinSecretKey }}
            {{- end }}
            - name: DATASTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dataStore.passwordSecretName }}
                  key: {{ .Values.dataStore.passwordSecretKey }}
          ports:
            - name: grpc
              containerPort: {{ .Values.grpc.bindPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.healthChecks.livenessPort }}
              protocol: TCP
            - name: metrics
              containerPort: 9988
              protocol: TCP
            {{- if .Values.federation.bundleEndpoint.port }}
            - name: federation
              containerPort: {{ .Values.federation.bundleEndpoint.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-data
              mountPath: /run/spire/data
            - name: spire-server-socket
              mountPath: /tmp/spire-server/private
            {{- if eq .Values.ca.plugin "pkcs11" }}
            - name: hsm-pki
              mountPath: /run/spire/hsm
              readOnly: true
            {{- else if eq .Values.ca.plugin "disk" }}
            - name: ca-keys
              mountPath: /run/spire/secrets
              readOnly: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: spire-config
          configMap:
            name: {{ include "spire-server.fullname" . }}-config
        - name: spire-server-socket
          emptyDir: {}
        {{- if eq .Values.ca.plugin "pkcs11" }}
        - name: hsm-pki
          secret:
            secretName: {{ include "spire-server.fullname" . }}-hsm-pki
            optional: true
        {{- else if eq .Values.ca.plugin "disk" }}
        - name: ca-keys
          secret:
            secretName: {{ include "spire-server.fullname" . }}-ca-keys
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: spire-data
        labels:
          {{- include "spire-server.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- else }}
      volumes:
        - name: spire-data
          emptyDir: {}
  {{- end }}
