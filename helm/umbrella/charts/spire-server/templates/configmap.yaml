apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spire-server.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spire-server.labels" . | nindent 4 }}
data:
  server.conf: |
    # KAC-127 Phase 10 — SPIRE Server HCL config.
    # Generated from spire-server Helm template; all knobs configurable.
    server {
      bind_address = "{{ .Values.grpc.bindAddress }}"
      bind_port = "{{ .Values.grpc.bindPort }}"
      socket_path = "{{ .Values.grpc.socketPath }}"
      trust_domain = "{{ include "spire-server.trustDomain" . }}"
      data_dir = "/run/spire/data"
      log_level = "{{ .Values.log.level | upper }}"
      log_format = "{{ .Values.log.format }}"
      default_x509_svid_ttl = "{{ .Values.ca.defaultSvidTtlSeconds }}s"
      ca_ttl = "{{ .Values.ca.ttlHours }}h"
      ca_subject = {
        country = ["US"]
        organization = ["Kacho Cloud"]
        common_name = "{{ include "spire-server.trustDomain" . }}"
      }

      {{- if .Values.federation.bundleEndpoint.address }}
      federation {
        bundle_endpoint {
          address = "{{ .Values.federation.bundleEndpoint.address }}"
          port = {{ .Values.federation.bundleEndpoint.port }}
          {{- if eq .Values.federation.bundleEndpoint.profile "https_spiffe" }}
          profile "https_spiffe" {}
          {{- else if eq .Values.federation.bundleEndpoint.profile "https_web" }}
          profile "https_web" {
            {{- if .Values.federation.bundleEndpoint.acme.enabled }}
            acme {
              directory_url = "{{ .Values.federation.bundleEndpoint.acme.directoryUrl }}"
              tos_accepted = {{ .Values.federation.bundleEndpoint.acme.tosAccepted }}
              email = "{{ .Values.federation.bundleEndpoint.acme.email }}"
            }
            {{- end }}
          }
          {{- end }}
        }
        {{- if .Values.federation.trustDomains }}
        federates_with = {
          {{- range .Values.federation.trustDomains }}
          "{{ .name }}" = {
            bundle_endpoint_url = "{{ .endpointUrl }}"
            bundle_endpoint_profile "https_spiffe" {
              endpoint_spiffe_id = "{{ .endpointSpiffeId }}"
            }
          }
          {{- end }}
        }
        {{- end }}
      }
      {{- end }}

      health_checks {
        listener_enabled = true
        bind_address = "{{ .Values.healthChecks.bindAddress }}"
        bind_port = "{{ .Values.healthChecks.livenessPort }}"
        live_path = "/live"
        ready_path = "/ready"
      }

      {{- if .Values.jwt.enabled }}
      jwt_issuer = "{{ .Values.jwt.issuer }}"
      {{- end }}
    }

    plugins {
      DataStore "{{ .Values.dataStore.plugin }}" {
        plugin_data {
          database_type = "{{ .Values.dataStore.databaseType }}"
          connection_string = "{{ .Values.dataStore.connectionString }}"
        }
      }

      # Node attestation plugins — позволяют SPIRE Agent доказать свою identity Server'у.
      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "kacho" = {
              service_account_allow_list = ["{{ .Release.Namespace }}:spire-agent"]
            }
          }
        }
      }

      # KeyManager — где SPIRE Server держит свои подписные ключи (отличные от CA).
      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys.json"
        }
      }

      {{- if eq .Values.ca.plugin "pkcs11" }}
      # UpstreamAuthority — PKCS#11 HSM-backed root CA (P10-D4).
      UpstreamAuthority "disk" {
        plugin_data {
          # PKCS#11 plugin loaded via separate Notation; SPIRE 1.9 doesn't have native
          # `pkcs11` UpstreamAuthority — using `disk` with HSM-managed cert pre-loaded.
          # PKI material живёт в /run/spire/hsm/, mounted from HSM CSI driver.
          cert_file_path = "/run/spire/hsm/upstream-ca.crt"
          key_file_path = "/run/spire/hsm/upstream-ca.key"
        }
      }
      {{- else if eq .Values.ca.plugin "disk" }}
      UpstreamAuthority "disk" {
        plugin_data {
          cert_file_path = "/run/spire/secrets/upstream-ca.crt"
          key_file_path = "/run/spire/secrets/upstream-ca.key"
        }
      }
      {{- end }}
      # ca.plugin=memory → no UpstreamAuthority block (self-signed root, dev only).

      # Workload attestation — kacho-only profile: k8s + cosign.
      # cosign attestor pulled as separate sidecar in production setups; here registered.
      Notifier "k8sbundle" {
        plugin_data {
          namespace = "{{ .Release.Namespace }}"
          config_map = "{{ include "spire-server.fullname" . }}-trust-bundle"
        }
      }
    }

    telemetry {
      Prometheus {
        host = "0.0.0.0"
        port = 9988
      }
    }
