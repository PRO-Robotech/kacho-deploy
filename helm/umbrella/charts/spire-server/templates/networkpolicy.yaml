{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spire-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spire-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spire-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # SPIRE Agents from spire-system namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: spire-agent
      ports:
        - port: {{ .Values.grpc.bindPort }}
          protocol: TCP
    # Federation bundle endpoint — public (Phase 10 — k8s Ingress + cert-manager).
    {{- if .Values.federation.bundleEndpoint.port }}
    - ports:
        - port: {{ .Values.federation.bundleEndpoint.port }}
          protocol: TCP
    {{- end }}
    # Metrics — Prometheus scrape from monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9988
          protocol: TCP
    # Health probes — kubelet.
    - ports:
        - port: {{ .Values.healthChecks.livenessPort }}
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Postgres DataStore
    - ports:
        - port: 5432
          protocol: TCP
    # k8s API for TokenReview + Lease
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # HSM endpoints — populated per-env from networkPolicy.hsmEndpoints.
    {{- range .Values.networkPolicy.hsmEndpoints }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        - port: {{ .port }}
          protocol: TCP
    {{- end }}
{{- end }}
