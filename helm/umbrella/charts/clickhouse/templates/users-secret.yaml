{{- if .Values.enabled }}
{{/*
KAC-127 Phase 9 — ClickHouse users config Secret.

Users + roles из values.auth.users. PROD должен использовать LDAP/OIDC
external_user_directories (auth.mode=ldap/oidc) вместо inline.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.fullname" . }}-users
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.xml: |
    <clickhouse>
      <users>
        <default>
          <password></password>
          <networks><ip>::1</ip><ip>127.0.0.1</ip></networks>
          <profile>default</profile>
          <quota>default</quota>
        </default>

        {{- range .Values.auth.users }}
        <{{ .username }}>
          <!-- Password — pulled from external Secret at runtime via env-substitution -->
          <password_sha256_hex from_env="{{ .username | upper | replace "-" "_" }}_PASSWORD_SHA256"/>
          <networks><ip>::/0</ip></networks>
          <profile>{{ if .readOnly }}readonly{{ else }}default{{ end }}</profile>
          <quota>default</quota>
        </{{ .username }}>
        {{- end }}
      </users>

      <roles>
        <audit_reader>
          <grants>
            <query>GRANT SELECT ON kacho_audit.* TO audit_reader</query>
          </grants>
        </audit_reader>
        <audit_writer>
          <grants>
            <query>GRANT SELECT, INSERT ON kacho_audit.* TO audit_writer</query>
          </grants>
        </audit_writer>
      </roles>

      <profiles>
        <default>
          <max_memory_usage>10000000000</max_memory_usage>
          <use_uncompressed_cache>0</use_uncompressed_cache>
          <load_balancing>random</load_balancing>
        </default>
        <readonly>
          <readonly>1</readonly>
          <max_memory_usage>10000000000</max_memory_usage>
        </readonly>
      </profiles>
    </clickhouse>
{{- end }}
