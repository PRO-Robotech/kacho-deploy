{{- if and .Values.enabled .Values.keeper.enabled }}
{{/*
KAC-127 Phase 9 — ClickHouse Keeper StatefulSet (3-node replicated coordination
service, replacement для ZooKeeper).

Используется ClickHouse server для replication metadata, leader election,
distributed DDL.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse.keeper.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.keeper.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "clickhouse.keeper.fullname" . }}-headless
  replicas: {{ .Values.keeper.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "clickhouse.keeper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clickhouse.keeper.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      {{- if .Values.affinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.affinity.topologyKey | quote }}
                labelSelector:
                  matchLabels:
                    {{- include "clickhouse.keeper.selectorLabels" . | nindent 20 }}
      {{- end }}
      containers:
        - name: keeper
          image: "{{ .Values.keeper.image.repository }}:{{ .Values.keeper.image.tag }}"
          ports:
            - name: keeper-tcp
              containerPort: 9181
            - name: raft
              containerPort: 9234
          env:
            - name: KEEPER_HEAP_OPTS
              value: "-Xms1g -Xmx1g"
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse-keeper
            - name: config
              mountPath: /etc/clickhouse-keeper
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: keeper-tcp
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "echo ruok | nc -w 2 localhost 9181 | grep -q imok"
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.keeper.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "clickhouse.keeper.fullname" . }}-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.keeper.storage.storageClass }}
        storageClassName: {{ .Values.keeper.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.keeper.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.keeper.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.keeper.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: keeper-tcp
      port: 9181
    - name: raft
      port: 9234
  selector:
    {{- include "clickhouse.keeper.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.keeper.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.keeper.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: keeper-tcp
      port: 9181
  selector:
    {{- include "clickhouse.keeper.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.keeper.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.keeper.labels" . | nindent 4 }}
data:
  keeper_config.xml: |
    <clickhouse>
      <logger>
        <level>information</level>
      </logger>
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id from_env="KEEPER_SERVER_ID"/>
        <log_storage_path>/var/lib/clickhouse-keeper/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse-keeper/coordination/snapshots</snapshot_storage_path>
        <coordination_settings>
          <operation_timeout_ms>10000</operation_timeout_ms>
          <session_timeout_ms>30000</session_timeout_ms>
          <raft_logs_level>information</raft_logs_level>
        </coordination_settings>
        <raft_configuration>
          {{- range $i, $_ := until (int .Values.keeper.replicas) }}
          <server>
            <id>{{ add $i 1 }}</id>
            <hostname>{{ include "clickhouse.keeper.fullname" $ }}-{{ $i }}.{{ include "clickhouse.keeper.fullname" $ }}-headless.{{ $.Release.Namespace }}.svc.cluster.local</hostname>
            <port>9234</port>
          </server>
          {{- end }}
        </raft_configuration>
      </keeper_server>
    </clickhouse>
{{- end }}
