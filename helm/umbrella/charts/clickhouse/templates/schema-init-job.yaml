{{- if and .Values.enabled .Values.schemaInit.enabled }}
{{/*
KAC-127 Phase 9 — ClickHouse schema-init Job.

Применяет migration SQL файлы из files/migrations/ через clickhouse-client.
Pre-render'ит env-vars (Kafka bootstrap, SCRAM creds).

Helm hooks:
  - post-install + post-upgrade
  - hook-weight=20 (после ClickHouse pod'ов поднялись)
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-migrations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/migrations/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "clickhouse.fullname" . }}-schema-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
    kacho.cloud/component: clickhouse-schema-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "clickhouse.labels" . | nindent 8 }}
        kacho.cloud/component: clickhouse-schema-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                if nc -z {{ include "clickhouse.fullname" . }} 9000; then
                  echo "ClickHouse reachable."
                  exit 0
                fi
                sleep 5
              done
              echo "ClickHouse did not become ready in 5min."
              exit 1
      containers:
        - name: schema-init
          image: "{{ .Values.schemaInit.image.repository }}:{{ .Values.schemaInit.image.tag }}"
          env:
            - name: CLICKHOUSE_HOST
              value: {{ include "clickhouse.fullname" . | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafkaConsumer.bootstrapServers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafkaConsumer.topic | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ .Values.kafkaConsumer.consumerGroup | quote }}
            - name: KAFKA_MAX_BLOCK_SIZE
              value: {{ .Values.kafkaConsumer.maxBlockSize | quote }}
            - name: KAFKA_FLUSH_INTERVAL_MS
              value: {{ .Values.kafkaConsumer.flushIntervalMs | quote }}
            - name: KAFKA_SASL_USERNAME
              value: {{ .Values.kafkaConsumer.saslUsername | quote }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaConsumer.saslPasswordSecretName }}
                  key: {{ .Values.kafkaConsumer.saslPasswordSecretKey }}
                  optional: true
          command:
            - bash
            - -ec
            - |
              for sql in /migrations/*.sql; do
                echo "Applying $sql..."
                envsubst < "$sql" | clickhouse-client --host "$CLICKHOUSE_HOST" --multiquery
              done
              echo "Schema init complete."
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: {{ include "clickhouse.fullname" . }}-migrations
{{- end }}
