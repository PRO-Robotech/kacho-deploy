{{- if .Values.enabled }}
{{/*
KAC-127 Phase 9 — ClickHouse server StatefulSet (vanilla, без Altinity Operator).

Topology: shards × replicas (each pod = one replica of one shard). Pod
ordinal naming:
  <fullname>-0   shard=1 replica=1
  <fullname>-1   shard=1 replica=2
  <fullname>-2   shard=2 replica=1
  <fullname>-3   shard=2 replica=2

Replication coordination via ClickHouse Keeper (см. keeper-statefulset.yaml).

Production: использовать Altinity Operator (ClickHouseInstallation CRD) с
proper shard/replica management. Vanilla — для dev / staging без operator
dependency.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "clickhouse.fullname" . }}-headless
  replicas: {{ mul .Values.cluster.shards .Values.cluster.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "clickhouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clickhouse.labels" . | nindent 8 }}
      annotations:
        checksum/cluster-config: {{ .Values.cluster | toJson | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 101
        fsGroup: 101
      {{- if .Values.affinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.affinity.topologyKey | quote }}
                labelSelector:
                  matchLabels:
                    {{- include "clickhouse.selectorLabels" . | nindent 20 }}
      {{- end }}
      containers:
        - name: clickhouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8123
            - name: tcp
              containerPort: 9000
            - name: interserver
              containerPort: 9009
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            # Replication coordinates: derived from pod ordinal.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SHARDS
              value: {{ .Values.cluster.shards | quote }}
            - name: REPLICAS
              value: {{ .Values.cluster.replicas | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.cluster.name | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d
              readOnly: true
            - name: users-config
              mountPath: /etc/clickhouse-server/users.d
              readOnly: true
            - name: kafka-tls
              mountPath: /etc/clickhouse-server/kafka-tls
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "clickhouse.fullname" . }}-config
        - name: users-config
          secret:
            secretName: {{ include "clickhouse.fullname" . }}-users
        - name: kafka-tls
          secret:
            secretName: {{ .Values.kafkaConsumer.caCertSecretName }}
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClass }}
        storageClassName: {{ .Values.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8123
    - name: tcp
      port: 9000
    - name: interserver
      port: 9009
  selector:
    {{- include "clickhouse.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8123
    - name: tcp
      port: 9000
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
    {{- end }}
  selector:
    {{- include "clickhouse.selectorLabels" . | nindent 4 }}
{{- if .Values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "clickhouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "clickhouse.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
