# ClickHouse subchart defaults (KAC-127 Phase 9 / sub-phase 3.9).
# Override через umbrella values.yaml `clickhouse: { ... }`.

# Включает ClickHouse stack. На kind/dev можно false — drainer работает в
# pg_notify mode без OLAP-аналитики (Activity tab UI деградирует).
enabled: false

# Operator strategy:
#   - altinity:  Altinity ClickHouseInstallation CRD (требует Altinity Operator)
#   - vanilla:   raw StatefulSet (для dev / staging без operator dependency)
operator: vanilla

image:
  repository: clickhouse/clickhouse-server
  tag: 24.8.0-alpine
  pullPolicy: IfNotPresent

# Cluster topology.
cluster:
  name: kacho_audit
  shards: 2     # P9-D5 (production)
  replicas: 2   # P9-D5
  # На kind/single-node — снижать до shards=1 replicas=1 чтобы не упереться
  # в anti-affinity при scheduling'е.

# ClickHouse Keeper (replicated coordination service, replacement для
# ZooKeeper).
keeper:
  enabled: true
  replicas: 3
  image:
    repository: clickhouse/clickhouse-keeper
    tag: 24.8.0-alpine
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Storage per node.
storage:
  size: 1Ti
  storageClass: ""

# Resources per node.
resources:
  requests:
    cpu: 4000m
    memory: 16Gi
  limits:
    cpu: 8000m
    memory: 32Gi

# Anti-affinity per node (HA). Disable на single-node kind.
affinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

# PodDisruptionBudget — replica может уйти в drain без потери query
# availability.
pdb:
  enabled: true
  minAvailable: 1

# ─── Schema initialization ──────────────────────────────────────────────
# Schema apply job — runs post-install. Re-runs on Chart upgrade if file
# checksums change.
schemaInit:
  enabled: true
  image:
    repository: clickhouse/clickhouse-client
    tag: 24.8.0-alpine

# ─── Kafka engine consumer config ───────────────────────────────────────
# Подключение к Kafka audit topic. Bootstrap servers / SCRAM creds —
# умbrellа values пробрасывает.
kafkaConsumer:
  enabled: true
  # Bootstrap servers — DNS-name Kafka bootstrap Service.
  bootstrapServers: "kacho-umbrella-kafka-bootstrap:9092"
  # Topic. Используется shared topic из §2.5 (per-tenant topics — opt-in
  # через runtime upgrade, не Helm).
  topic: kacho-audit-events.shared
  consumerGroup: kacho-audit-clickhouse
  # Batch tuning (P9-D23).
  maxBlockSize: 1000
  flushIntervalMs: 5000
  # SCRAM credentials.
  saslUsername: clickhouse-audit-consumer
  saslPasswordSecretName: kafka-scram-clickhouse-audit
  saslPasswordSecretKey: password
  # TLS truststore.
  caCertSecretName: kacho-umbrella-kafka-tls
  caCertSecretKey: ca.crt

# ─── TTL / retention ─────────────────────────────────────────────────
retention:
  # Hot tier — ClickHouse TTL DELETE per partition (P9-D6).
  hotDays: 90

# ─── Auth (LDAP/OIDC) ───────────────────────────────────────────────────
# В production — LDAP/OIDC через external_user_directories. Для dev —
# inline users.xml.
auth:
  mode: inline  # inline | ldap | oidc
  # Inline user для kacho-iam SIEM forwarder / audit-verifier queries.
  users:
    - username: kacho-audit-reader
      role: audit_reader
      passwordSecretName: clickhouse-audit-reader
      passwordSecretKey: password
      readOnly: true
    - username: kacho-iam-audit-writer
      role: audit_writer
      passwordSecretName: clickhouse-audit-writer
      passwordSecretKey: password
      readOnly: false

# ─── Backup ─────────────────────────────────────────────────────────────
backup:
  enabled: true
  # CronJob schedule. Default — weekly Sunday 02:00 UTC.
  schedule: "0 2 * * 0"
  # clickhouse-backup pushes via S3 protocol.
  s3:
    bucket: ""    # configurable, default empty = require explicit set
    endpoint: ""  # configurable (MinIO / AWS S3)
    region: us-east-1
    prefix: clickhouse-backup
    accessKeySecretName: kacho-audit-backup-creds
    accessKeySecretKey: AWS_ACCESS_KEY_ID
    secretKeySecretName: kacho-audit-backup-creds
    secretKeySecretKey: AWS_SECRET_ACCESS_KEY
  retentionDays: 30

# ─── Monitoring ──────────────────────────────────────────────────────────
metrics:
  enabled: true
  port: 9363
