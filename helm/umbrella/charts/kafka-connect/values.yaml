# kafka-connect subchart defaults (KAC-127 Phase 9).
# Этот chart управляет Kafka Connect distributed cluster и регистрирует S3-sink
# connector через init-job (curl POST /connectors).
#
# NB: Phase 9 also implements custom S3 batch writer в kacho-iam (с HSM signing
# поверх). Этот chart запускает _backup_ архивацию raw Kafka topic'ов (без HSM
# signing) — отдельный pipeline для full-replay capability при катастрофе
# kacho-iam. Custom writer + Connect S3 sink работают параллельно (different
# consumer groups).

enabled: false

image:
  repository: confluentinc/cp-kafka-connect
  tag: 7.6.0
  pullPolicy: IfNotPresent

replicas: 2

# Kafka cluster connection.
kafka:
  bootstrapServers: "kacho-umbrella-kafka-bootstrap:9092"
  saslMechanism: SCRAM-SHA-512
  securityProtocol: SASL_SSL
  saslUsername: kacho-iam-audit-s3-writer
  saslPasswordSecretName: kafka-scram-kacho-iam-s3-writer
  saslPasswordSecretKey: password
  tlsCaSecretName: kacho-umbrella-kafka-tls
  tlsCaSecretKey: ca.crt

# S3 sink configuration.
# ВНИМАНИЕ: bucket / endpoint — должны пробрасываться umbrella values
# (audit.s3.bucket / audit.s3.endpoint). См. umbrella values.yaml
# `kafka-connect:` блок. На standalone-deploy — обязательно override.
s3:
  # Configurable endpoint — пусто = AWS S3; для MinIO/dev — override.
  endpoint: ""
  region: us-east-1
  # Configurable bucket name. Пусто = не сконфигурировано (Connect
  # connectors не запустятся). PROD: umbrella values пробрасывает audit.s3.bucket.
  bucket: ""
  # Partitioner: TimeBasedPartitioner with /dt=YYYY-MM-DD prefix
  partitionDurationMs: 3600000  # 1h
  pathFormat: "'dt'=YYYY-MM-dd/'hour'=HH"
  flushSize: 10000
  rotateIntervalMs: 600000     # 10min
  format: io.confluent.connect.s3.format.parquet.ParquetFormat
  # IAM credentials (для AWS S3) — через secret.
  accessKeySecretName: kacho-audit-s3-creds
  accessKeySecretKey: AWS_ACCESS_KEY_ID
  secretKeySecretName: kacho-audit-s3-creds
  secretKeySecretKey: AWS_SECRET_ACCESS_KEY

# Connectors to register.
connectors:
  - name: s3-sink-audit-events
    topic: kacho-audit-events.shared
    consumerGroup: kacho-connect-s3-audit-events
    prefix: audit-events
  - name: s3-sink-caep-events
    topic: kacho-caep-events
    consumerGroup: kacho-connect-s3-caep
    prefix: caep-events
  - name: s3-sink-audit-dlq
    topic: kacho-audit-dlq
    consumerGroup: kacho-connect-s3-dlq
    prefix: audit-dlq

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi
