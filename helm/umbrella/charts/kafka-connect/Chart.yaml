apiVersion: v2
name: kafka-connect
version: 0.1.0
appVersion: "3.7.0"
description: |
  KAC-127 Phase 9 — Kafka Connect cluster + S3 sink connectors для kacho-iam
  audit pipeline.

  Streams from Kafka topics `kacho-audit-events.shared` + `kacho-caep-events`
  → S3 (parquet, partitioned by ts/dt=YYYY-MM-DD).

  S3 lifecycle (configured on bucket, not connector):
    - 0–30d   Standard tier
    - 30d–1y  Standard-IA (Infrequent Access)
    - 1y–10y  Glacier Deep Archive
    - 10y+    delete

  Configurable S3 endpoint (.Values.s3.endpoint) для MinIO compatibility в dev.
type: application
keywords:
  - kafka
  - connect
  - s3
  - audit
home: https://github.com/PRO-Robotech/kacho-deploy
maintainers:
  - name: Kacho Cloud
    email: platform@kacho.cloud
