{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafka-connect.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-connect.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "kafka-connect.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kafka-connect.labels" . | nindent 8 }}
      annotations:
        checksum/connectors: {{ .Values.connectors | toJson | sha256sum }}
    spec:
      containers:
        - name: connect
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: rest
              containerPort: 8083
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: CONNECT_GROUP_ID
              value: kacho-connect-cluster
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: kacho-connect-configs
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: kacho-connect-offsets
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: kacho-connect-status
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_KEY_CONVERTER
              value: org.apache.kafka.connect.storage.StringConverter
            - name: CONNECT_VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CONNECT_PLUGIN_PATH
              value: /usr/share/confluent-hub-components,/usr/share/java
            - name: CONNECT_SECURITY_PROTOCOL
              value: {{ .Values.kafka.securityProtocol | quote }}
            - name: CONNECT_SASL_MECHANISM
              value: {{ .Values.kafka.saslMechanism | quote }}
            - name: CONNECT_SSL_TRUSTSTORE_LOCATION
              value: /etc/kafka-tls/truststore.jks
            - name: CONNECT_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ include "kafka-connect.fullname" . }}-sasl
                  key: jaas.config
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.accessKeySecretName }}
                  key: {{ .Values.s3.accessKeySecretKey }}
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretKeySecretName }}
                  key: {{ .Values.s3.secretKeySecretKey }}
                  optional: true
          livenessProbe:
            httpGet:
              path: /
              port: rest
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /connectors
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: kafka-tls
              mountPath: /etc/kafka-tls
              readOnly: true
      volumes:
        - name: kafka-tls
          secret:
            secretName: {{ .Values.kafka.tlsCaSecretName }}
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka-connect.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-connect.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: rest
      port: 8083
  selector:
    {{- include "kafka-connect.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka-connect.fullname" . }}-sasl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-connect.labels" . | nindent 4 }}
type: Opaque
stringData:
  jaas.config: |
    org.apache.kafka.common.security.scram.ScramLoginModule required username="{{ .Values.kafka.saslUsername }}" password="${KAFKA_SASL_PASSWORD}";
{{- end }}
