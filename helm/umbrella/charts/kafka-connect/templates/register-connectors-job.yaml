{{- if .Values.enabled }}
{{/*
KAC-127 Phase 9 — Register S3-sink connectors через REST API после того, как
Kafka Connect cluster поднялся.

Idempotent: PUT /connectors/<name>/config (overrides existing config).
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kafka-connect.fullname" . }}-register
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-connect.labels" . | nindent 4 }}
    kacho.cloud/component: kafka-connect-register
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "30"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "kafka-connect.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-connect
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                if curl -sf http://{{ include "kafka-connect.fullname" . }}:8083/ > /dev/null; then
                  echo "Connect REST ready."
                  exit 0
                fi
                sleep 5
              done
              exit 1
      containers:
        - name: register
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -ec
            - |
              CONNECT_URL="http://{{ include "kafka-connect.fullname" . }}:8083"
              {{- range .Values.connectors }}
              echo "Registering connector {{ .name }}..."
              cat > /tmp/{{ .name }}.json <<EOF
              {
                "connector.class": "io.confluent.connect.s3.S3SinkConnector",
                "tasks.max": "4",
                "topics": "{{ .topic }}",
                "consumer.group.id": "{{ .consumerGroup }}",
                "s3.region": "{{ $.Values.s3.region }}",
                "s3.bucket.name": "{{ $.Values.s3.bucket }}",
                {{- if $.Values.s3.endpoint }}
                "store.url": "{{ $.Values.s3.endpoint }}",
                {{- end }}
                "topics.dir": "{{ .prefix }}",
                "s3.part.size": "5242880",
                "flush.size": "{{ $.Values.s3.flushSize }}",
                "rotate.interval.ms": "{{ $.Values.s3.rotateIntervalMs }}",
                "storage.class": "io.confluent.connect.s3.storage.S3Storage",
                "format.class": "{{ $.Values.s3.format }}",
                "schema.compatibility": "NONE",
                "partitioner.class": "io.confluent.connect.storage.partitioner.TimeBasedPartitioner",
                "partition.duration.ms": "{{ $.Values.s3.partitionDurationMs }}",
                "path.format": "{{ $.Values.s3.pathFormat }}",
                "locale": "en-US",
                "timezone": "UTC",
                "timestamp.extractor": "Record",
                "key.converter": "org.apache.kafka.connect.storage.StringConverter",
                "value.converter": "org.apache.kafka.connect.json.JsonConverter",
                "value.converter.schemas.enable": "false"
              }
              EOF
              curl -sf -X PUT \
                -H "Content-Type: application/json" \
                "$CONNECT_URL/connectors/{{ .name }}/config" \
                -d @/tmp/{{ .name }}.json
              echo
              {{- end }}
              echo "All connectors registered."
{{- end }}
