{{- if and .Values.cloudflare.crossplane.enabled .Values.cloudflare.access.enabled }}
{{- range .Values.cloudflare.access.applications }}
---
apiVersion: cloudflare.crossplane.io/v1alpha1
kind: AccessApplication
metadata:
  name: {{ printf "access-%s" (.name | lower | replace " " "-") | quote }}
  labels:
    kacho.cloud/component: cloudflare-access
spec:
  forProvider:
    accountId: {{ $.Values.cloudflare.accountId | quote }}
    name: {{ .name | quote }}
    domain: {{ tpl .domain $ | quote }}
    type: "self_hosted"
    sessionDuration: {{ .sessionDuration | quote }}
    autoRedirectToIdentity: false
    enableBindingCookie: true
    httpOnlyCookieAttribute: true
    sameSiteCookieAttribute: "lax"
    appLauncherVisible: true
    serviceAuth401Redirect: false
  providerConfigRef:
    name: cloudflare-default
{{- range .policies }}
---
apiVersion: cloudflare.crossplane.io/v1alpha1
kind: AccessPolicy
metadata:
  name: {{ printf "policy-%s" (.name | lower | replace " " "-") | quote }}
  labels:
    kacho.cloud/component: cloudflare-access
spec:
  forProvider:
    accountId: {{ $.Values.cloudflare.accountId | quote }}
    name: {{ .name | quote }}
    decision: {{ .decision | quote }}
    precedence: 1
    {{- with .include }}
    include:
      {{- range . }}
      {{- if .emailDomain }}
      - emailDomain:
          - {{ .emailDomain | quote }}
      {{- end }}
      {{- if .groupId }}
      - group:
          - {{ .groupId | quote }}
      {{- end }}
      {{- end }}
    {{- end }}
  providerConfigRef:
    name: cloudflare-default
{{- end }}
{{- end }}
{{- end }}
