# Cloudflare config defaults — fully overridable per environment.
# All resources here are Crossplane-cloudflare-provider CRDs OR Terraform-
# rendered JSON (when crossplane.enabled=false). User must supply API token
# via Secret `cloudflare-api-token` (key `token`) in namespace `cloudflare-system`.

cloudflare:
  # Zone — root domain owned by user; typically the bare apex `kacho.cloud`.
  # User-action required: register domain + delegate NS to Cloudflare.
  zone: ""                                     # e.g. "kacho.cloud" — REQUIRES user setup
  accountId: ""                                # Cloudflare account id  — REQUIRES user setup

  # API token Secret name (in cloudflare-system namespace). Created externally
  # (ExternalSecrets-operator from Vault path `secret/kacho/prod/cloudflare/api-token`).
  apiTokenSecret:
    name: "cloudflare-api-token"
    key: "token"

  # Use Crossplane provider OR render Terraform .tf manifests.
  crossplane:
    enabled: true                              # false → manifests are TF dry-run only

  # Zone-level settings.
  zoneSettings:
    tls:
      minVersion: "1.3"
      hstsMaxAge: 63072000                     # 2 years (preload-eligible)
      hstsIncludeSubdomains: true
      hstsPreload: true                        # REQUIRES manual submission to hstspreload.org
    http3: true
    earlyHints: true
    brotli: true
    minify:
      css: true
      js: false                                # leave JS unminified — UI repo is already pre-minified
      html: true

  # WAF rulesets (managed).
  waf:
    managed:
      owaspCrs:
        enabled: true
        sensitivity: medium                    # low|medium|high
        action: block                          # simulate|challenge|block
      cloudflareSpecials:
        enabled: true
        action: block
    # Custom rules per endpoint.
    custom:
      - id: deny-known-scrapers
        description: "Deny user-agents matching known scraper patterns"
        expression: '(http.user_agent contains "MJ12bot" or http.user_agent contains "AhrefsBot" or http.user_agent contains "SemrushBot")'
        action: block
      - id: deny-path-traversal
        description: "Deny path traversal attempts on /v1/*"
        expression: '(http.request.uri.path contains "..") and (starts_with(http.request.uri.path, "/v1/"))'
        action: block
      - id: deny-sqli-uri
        description: "Deny SQLi-pattern in URI on /v1/*"
        expression: '(starts_with(http.request.uri.path, "/v1/")) and ((http.request.uri.query contains "UNION SELECT") or (http.request.uri.query contains "; DROP TABLE"))'
        action: block
      - id: challenge-suspicious-bots
        description: "Challenge bot-score < 30"
        expression: '(cf.bot_management.score lt 30) and (not cf.bot_management.verified_bot)'
        action: managed_challenge

  # Per-endpoint rate limits.
  rateLimit:
    enabled: true
    rules:
      - id: auth-rate-limit
        description: "Rate-limit /v1/auth/* — login/signup brute-force guard"
        match:
          pathPattern: "/v1/auth/*"
        threshold:
          requests: 100
          periodSeconds: 60
        action: challenge                      # challenge|block
      - id: breakglass-rate-limit
        description: "Aggressive rate-limit on /v1/iam/v1/breakglass:activate (high-risk endpoint)"
        match:
          pathPattern: "/v1/iam/v1/breakglass:activate"
        threshold:
          requests: 10
          periodSeconds: 60
        action: block
      - id: generic-api-rate-limit
        description: "Generic per-IP rate-limit for /v1/*"
        match:
          pathPattern: "/v1/*"
        threshold:
          requests: 1000
          periodSeconds: 60
        action: challenge

  # Bot management (Cloudflare Bot Score header injection).
  botManagement:
    enabled: true
    fightMode: false                           # leave off — relies on score-based rules above

  # DDoS protection.
  ddos:
    enabled: true
    advancedTcp: true                          # Magic Transit auto-mitigation (paid tier)

  # Geo-blocking — configurable allow / deny.
  geoBlocking:
    enabled: false                             # off by default; enable per tenant
    allowedCountries: []                       # ISO 3166-1 alpha-2 (e.g. ["US","CA","DE"])
    deniedCountries: []                        # e.g. ["KP","IR"] — sanctioned regions

  # Cloudflare Access (Zero Trust) — admin-only paths protected by SSO.
  access:
    enabled: true
    applications:
      - name: "Grafana SSO"
        domain: "grafana.{{ .Values.kacho.domain }}"
        sessionDuration: "8h"
        policies:
          - name: "Allow kacho-platform admins"
            decision: "allow"
            include:
              - emailDomain: "kacho.cloud"
              - groupId: "kacho-platform-admins"
      - name: "Hubble UI SSO"
        domain: "hubble.{{ .Values.kacho.domain }}"
        sessionDuration: "8h"
        policies:
          - name: "Allow SRE admins"
            decision: "allow"
            include:
              - groupId: "kacho-sre"
      - name: "Argo CD UI SSO"
        domain: "argocd.{{ .Values.kacho.domain }}"
        sessionDuration: "12h"
        policies:
          - name: "Allow deploy admins"
            decision: "allow"
            include:
              - groupId: "kacho-deploy-admins"

  # DNS records — per-region pointing.
  dns:
    records:
      - name: "@"
        type: "CNAME"
        content: "kacho-loadbalancer.{{ .Values.kacho.domain }}"
        proxied: true
        ttl: 1                                 # auto (Cloudflare proxy mode)
      - name: "api"
        type: "CNAME"
        content: "kacho-loadbalancer.{{ .Values.kacho.domain }}"
        proxied: true
        ttl: 1
      - name: "grafana"
        type: "CNAME"
        content: "kacho-loadbalancer.{{ .Values.kacho.domain }}"
        proxied: true
        ttl: 1
      - name: "hubble"
        type: "CNAME"
        content: "kacho-loadbalancer.{{ .Values.kacho.domain }}"
        proxied: true
        ttl: 1
      - name: "argocd"
        type: "CNAME"
        content: "kacho-loadbalancer.{{ .Values.kacho.domain }}"
        proxied: true
        ttl: 1
      - name: "spire"
        type: "CNAME"
        content: "kacho-loadbalancer.{{ .Values.kacho.domain }}"
        proxied: true
        ttl: 1

# Required outer key — top-level domain inherited from umbrella values.
# Subchart inherits via `global.kacho.domain` pass-through; the local default
# below is overridden by the umbrella for every install.
kacho:
  domain: "api.kacho.local"
global:
  kacho:
    domain: ""
