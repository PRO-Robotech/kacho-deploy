apiVersion: v2
name: spire-agent
version: 0.1.0
appVersion: "1.9.6"
description: |
  KAC-127 Phase 10 — SPIRE Agent DaemonSet (one per node).

  Конфигурация по acceptance §3 (point 3) + Decision Log P10-D9 / P10-D23 / P10-D24:
    - DaemonSet (один Pod на каждый node); hostPath mount
      `/run/spire/sockets/agent.sock` для Workload API expose к pods на той же node.
    - Attestation primary = k8s_psat (projected SA token validated against k8s
      API); supplementary = cosign (image signature against trusted signers).
    - SVID validity = 1h, auto-rotation at 50% lifetime (30 min before expiry).
    - HostPID enabled для cgroup/PID-based workload identification.
    - Cosign verification at attestor (not at admission) — pod without signed
      image not getting SVID → all mesh traffic fails.
type: application
keywords:
  - spire
  - spiffe
  - workload-identity
  - daemonset
home: https://github.com/PRO-Robotech/kacho-deploy
maintainers:
  - name: Kacho Cloud
    email: platform@kacho.cloud
