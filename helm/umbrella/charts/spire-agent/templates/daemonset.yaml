apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "spire-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spire-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "spire-agent.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "spire-agent.selectorLabels" . | nindent 8 }}
        {{- include "spire-agent.labels" . | nindent 8 }}
      annotations:
        kacho.cloud/config-hash: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum | trunc 12 }}
    spec:
      serviceAccountName: {{ include "spire-agent.serviceAccountName" . }}
      hostPID: true
      hostNetwork: false
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: {{ .Values.priorityClassName }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Fetch trust bundle from SPIRE Server before Agent starts.
        - name: init
          image: "cgr.dev/chainguard/wait-for-it:latest"
          command:
            - sh
            - -c
            - |
              echo "Waiting for SPIRE Server..."
              for i in $(seq 1 60); do
                if nc -z -w 2 {{ .Values.serverAddress | quote }} {{ .Values.serverPort }} ; then
                  echo "SPIRE Server reachable"
                  exit 0
                fi
                sleep 2
              done
              echo "SPIRE Server unreachable after 120s"
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: spire-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-config"
            - "/run/spire/config/agent.conf"
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KACHO_TRUST_DOMAIN
              value: {{ include "spire-agent.trustDomain" . | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.healthChecks.livenessPort }}
              protocol: TCP
            - name: metrics
              containerPort: 9988
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-data
              mountPath: /run/spire
            - name: spire-agent-socket-dir
              mountPath: {{ .Values.socket.hostPath }}
            - name: spire-token
              mountPath: /var/run/secrets/tokens
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["SYS_PTRACE"]
      volumes:
        - name: spire-config
          configMap:
            name: {{ include "spire-agent.fullname" . }}-config
        - name: spire-data
          emptyDir: {}
        # hostPath — Workload API socket exposed to pods on same node.
        - name: spire-agent-socket-dir
          hostPath:
            path: {{ .Values.socket.hostPath }}
            type: DirectoryOrCreate
        # Projected SA token — k8s_psat audience binding.
        - name: spire-token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: {{ .Values.attestors.k8s.audience | quote }}
