apiVersion: v1
kind: Service
metadata:
  name: {{ include "spire-agent.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spire-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "spire-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9988
      targetPort: metrics
      protocol: TCP
