# ─── SEC-F — cluster-internal mTLS overlay ───────────────────────────────────
# Apply ON TOP of values.dev.yaml to bring the stand up fully on mTLS:
#
#   helm upgrade --install kacho-umbrella ./helm/umbrella -n kacho \
#     -f ./helm/umbrella/values.dev.yaml -f ./helm/umbrella/values.mtls.yaml
#
# (Makefile: `make dev-up MTLS=on`.) Flips the global mTLS flag + every per-edge
# flag on, turns on the internal-CA PKI (server+client leaf certs per service),
# and the OpenFGA "ingress-from-iam-only" NetworkPolicy.
#
# Pre-reqs (acceptance §«Зависимости-гейты»): SEC-C/D/E in main; cert-manager
# controller installed; NetworkPolicy openfga only after SEC-D is green.
# Base profile (values.dev.yaml) keeps mTLS off → zero regression by default.

# Global mTLS opt-in + per-edge flags (all edges on for the full-stack profile).
# These are the umbrella-level INTENT flags. КРИТ#3: they are mapped below into
# each sibling subchart's own `mtls.*` block so the service templates actually
# render the cert mount + per-edge env (КРИТ#2). Flipping a flag here changes the
# rendered pod-spec of the affected subchart(s).
mtls:
  enabled: true
  edges:
    gateway_to_vpc: true
    gateway_to_compute: true
    gateway_to_iam: true
    gateway_to_nlb: true
    vpc_to_iam: true
    compute_to_iam: true
    nlb_to_iam: true
    # SEC-M — resource-creation client edges. Documentary INTENT (the actual render is
    # gated by each subchart's own mtls.edges block below): compute→vpc closes the
    # NIC-spec (:9090) + one-to-one-NAT IPAM (:9091) edge; nlb→{vpc,compute} are the
    # already-shipped NLB create-flow client edges. vpc→compute (SEC-D-19) is gated by
    # vpc.mtls.edges.compute below (kept implicit, like before).
    compute_to_vpc: true
    nlb_to_vpc: true
    nlb_to_compute: true
    # SEC-G — operator edges. The operator is a sibling (its own config/ kustomize,
    # outside the umbrella subcharts), so these flags are documentary INTENT here;
    # the operator pod-spec is wired in kacho-vpc-operator/config/dev/operator-mtls.yaml
    # (per-edge KACHO_VPCOPERATOR_{VPC,IAM}_MTLS_* env + client-cert mount). The
    # operator's CLIENT cert is rendered by cert-manager-config (vpc-operator entry).
    operator_to_vpc: true
    operator_to_iam: true

# Internal-CA PKI: enable the cert-manager-config subchart + its internal CA.
cert-manager-config:
  enabled: true
  certManager:
    # Dev/kind mTLS profile = ONLY the cluster-internal CA (service→service
    # mTLS). The PUBLIC ACME PKI (letsencrypt issuers + the kacho-wildcard-tls
    # Certificate) needs a real domain + Cloudflare DNS-01 solver and targets the
    # prod-only `kacho-system` namespace — not usable in kind, and nothing in the
    # dev stand consumes kacho-wildcard-tls (cert-manager-config is OFF entirely
    # in the baseline dev profile). Disabling them here removes the last
    # kacho-system-targeting resource so the overlay applies cleanly. The prod
    # mTLS profile keeps the public PKI via values.prod.yaml.
    certificates: []
    issuers:
      prod:
        enabled: false
      staging:
        enabled: false
    internalCA:
      enabled: true

# ─── КРИТ#3 — propagate the umbrella mtls intent into each sibling subchart ────
# Each service consumes its OWN `mtls.*` block (КРИТ#2). A service's SERVER is
# enabled whenever ANY edge terminates at it; in this full-stack profile every
# edge is on, so every server is on. Per-edge CLIENT flags map 1:1 from the
# umbrella `mtls.edges.*` intent above. (Helm cannot self-reference values, so
# this overlay is the single place that materialises the mapping; `helm template`
# / the assertion harness verify flag→pod-spec.)

# api-gateway — backend-dial client only (terminates external TLS separately).
api-gateway:
  mtls:
    enable: true            # gateway_to_* ⇒ the gateway dials ≥1 edge over mTLS
    # SEC-K hybrid: external (browser-facing) listener accepts an OPTIONAL client
    # cert — cert present → mTLS SPIFFE identity; no cert → JWT (SEC-J). This is the
    # true public boundary; internal service listeners stay strict mTLS.
    hybridExternal: true
    edges:
      vpc: true             # ← mtls.edges.gateway_to_vpc
      compute: true         # ← mtls.edges.gateway_to_compute
      iam: true             # ← mtls.edges.gateway_to_iam
      nlb: true             # ← mtls.edges.gateway_to_nlb

# kacho-vpc — server (gateway_to_vpc, compute_to_vpc, nlb_to_vpc terminate here)
# + client (vpc_to_iam; vpc→compute filled by SEC-D).
# SEC-I completeness: vpc_to_iam covers ALL three iam conns — iamRegister
# (:9091 Register), iamProject (:9090 ProjectService.Get) AND iamAuthz (:9091
# Check + FGA-filtered List). Under SEC-H every iam read/authz edge must present a
# client-cert, so all three flip together (else the un-flipped edge's handshake
# fails — B-05/SEC-I-07).
vpc:
  mtls:
    enable: true
    edges:
      iamRegister: true     # ← mtls.edges.vpc_to_iam (iam-internal :9091 Register)
      iamProject: true      # ← mtls.edges.vpc_to_iam (iam-public :9090 ProjectService.Get, SEC-I)
      iamAuthz: true        # ← mtls.edges.vpc_to_iam (iam-internal :9091 Check+list-filter, SEC-I)
      compute: true         # ← vpc→compute ZoneService.Get (subnet create zone_id validation); compute server is mTLS

# kacho-compute — server (gateway_to_compute, vpc_to_compute, nlb_to_compute) +
# client (compute_to_iam; compute→vpc filled by SEC-D).
# SEC-I completeness: compute_to_iam covers ALL three iam conns — iamRegister
# (:9091 Register), iamProject (:9090 ProjectService.Get) AND iamAuthz (:9091
# Check + FGA-filtered List). Under SEC-H every iam read/authz edge must present a
# client-cert, so all three flip together (else the un-flipped edge's handshake
# fails — C-05/SEC-I-07).
compute:
  mtls:
    enable: true
    edges:
      iamRegister: true     # ← mtls.edges.compute_to_iam (iam-internal :9091 Register)
      iamProject: true      # ← mtls.edges.compute_to_iam (iam-public :9090 ProjectService.Get, SEC-I)
      iamAuthz: true        # ← mtls.edges.compute_to_iam (iam-internal :9091 Check+list-filter, SEC-I)
      vpc: true             # ← compute→vpc NIC-spec (:9090) + one-to-one-NAT IPAM (:9091); vpc server is mTLS (SEC-M)

# kacho-nlb — server (gateway_to_nlb terminates here) + clients (nlb_to_iam;
# nlb→vpc / nlb→compute follow when those edges are exercised).
# SEC-I completeness: nlb_to_iam covers BOTH iam listeners — iamRegister
# (:9091 Check+Register) AND iamProject (:9090 ProjectService.Get). Under SEC-H
# every iam read/authz edge must present a client-cert, so both flip together
# (else the un-flipped edge's handshake fails — D-04/SEC-I-07).
kacho-nlb:
  mtls:
    enable: true
    edges:
      iamRegister: true     # ← mtls.edges.nlb_to_iam (iam-internal :9091 Check+Register)
      iamProject: true      # ← mtls.edges.nlb_to_iam (iam-public :9090 ProjectService.Get, SEC-I)
      vpc: true             # nlb→vpc (Address/Subnet/NIC)
      compute: true         # nlb→compute (Region/Instance)

# kacho-iam — SEC-H server-side mTLS on BOTH listeners (public :9090 + internal
# :9091). The server is enabled because edges terminate AT iam (gateway_to_iam,
# vpc_to_iam, compute_to_iam, nlb_to_iam all dial iam over mTLS). IAM is a
# leaf-owner: no outgoing peer-dial edge in scope, so this is server-side only
# (no client secret/edges). Mirrors the vpc/compute server-edge mapping above.
# Also flips the OpenFGA ingress allowlist (only kacho-iam may dial FGA), gated on
# SEC-D being green — vpc/compute/nlb no longer dial FGA directly.
kacho-iam:
  mtls:
    enable: true            # ← vpc_to_iam / compute_to_iam / nlb_to_iam / gateway_to_iam terminate here
  audit:
    networkPolicy:
      openfgaIngressFromIamOnly:
        enabled: true
