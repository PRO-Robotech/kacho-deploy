# values.fe3455.yaml — overlay for the fe3455 managed cluster (Beget).
#
# Layered ON TOP of values.dev.yaml (which enables the full stack + mTLS):
#   helm upgrade --install kacho-umbrella ./helm/umbrella -n kacho --create-namespace \
#     -f ./helm/umbrella/values.dev.yaml \
#     -f ./helm/umbrella/values.fe3455.yaml \
#     --wait --timeout 15m
#
# fe3455 cluster facts that drive this overlay:
#   - cert-manager is ALREADY installed (ns `beget-cert-manager`) → do NOT install
#     the umbrella's cert-manager dependency; its --cluster-resource-namespace is
#     its own ns, so the internal-CA root secret must live THERE. Single helm apply
#     (no two-phase) because the webhook is already Ready.
#   - NO StorageClass / dynamic provisioner → every Postgres runs emptyDir
#     (persistence.enabled=false). Data is ephemeral (greenfield install).
#   - NO ingress controller / LoadBalancer → ingress-nginx off + service ingresses
#     off; reach the stack via `kubectl port-forward`.
#   - images pulled from docker.io/prorobotech/kacho-<svc>:mtls-rc1 (public).

# ── mTLS: keep ON (from values.dev) but reuse the pre-existing cert-manager ──
cert-manager:
  enabled: false                 # already installed in ns beget-cert-manager
mtls:
  enabled: true
  internalCA:
    caNamespace: beget-cert-manager   # cert-manager --cluster-resource-namespace

# ── images: prorobotech registry ──
# Rolled out to fe3455 2026-06-22 (RBAC rules-model 2026 sub-phase H — Rule.module
# scalar + #1 labelSelectable gating; on top of G cleanup). Tags = current LIVE
# images (kubectl set image applied + verified: rollout green, iam migration 0033
# applied → roles rewritten modules:[x]→module:x for 64 roles, catalog labelSelectable
# live). Source-of-truth so a future `helm upgrade -f values.fe3455.yaml` does not revert.
vpc:
  # main-4987b56e: routeTable/address/gateway/networkInterface Create+Update feed labels +
  # parent to the IAM mirror (RegisterItems(ProjectHierarchyItem)) so label-scoped grants
  # materialize for all 7 VPC types — fixes under-show of the 4 residual types.
  image: docker.io/prorobotech/kacho-vpc:main-4987b56e
  imagePullPolicy: IfNotPresent
compute:
  # main-e5634e60: List filter resolves the FGA subject from operations.PrincipalFromContext
  # (x-kacho-principal-*) and fail-closes on empty subject — fixes the public-List over-show
  # leak (previously read a never-sent x-kacho-subject* header → bypassed list-authz).
  image: docker.io/prorobotech/kacho-compute:main-e5634e60
  imagePullPolicy: IfNotPresent
# kacho-geo image: CI-built+pushed. mTLS inherited ON from values.dev. dataMigration
# OFF (S7): geo serves its own seed (compute no longer owns geography). Unchanged this cut.
kacho-geo:
  image: docker.io/prorobotech/kacho-geo:main-84d9d68f
  imagePullPolicy: IfNotPresent
api-gateway:
  # main-cbaa8bc1: permission-catalog sync — ProjectService.List + GroupService.List → <exempt>
  # (parity with User/SA/Role List): gateway drops the account#v_list call-gate + acr=2 step-up
  # on these List RPCs; the IAM handler's viewer ∪ v_list scope-filter is the authoritative gate
  # (200+filtered, never 403; anon→401). Fixes non-member List 403→200+empty + by-label
  # see-in-selector discovery (#255). On the main-93d16dfa base (UserService.Update + BUG-2
  # hide-existence read-deny + Design-B v_* catalog).
  image: docker.io/prorobotech/kacho-api-gateway:main-cbaa8bc1
  imagePullPolicy: IfNotPresent
ui:
  # main-b097ff35: sub-phase H (RulesEditor scalar module + labels gating #1) + #2 roles-list
  # (accountId scope + auto-default + pageSize=1000) + invite fix: InviteUserPage/AccessPage
  # single-account auto-default + guard so inviting without a selected Account-pill no longer
  # sends empty account_id → authz `account:*` deny. All LIVE-verified in browser (roles
  # «Кастомные» shows custom; invite 200 with pill unselected). G base: backend-driven catalog.
  image: docker.io/prorobotech/kacho-ui:main-1261b85b
  imagePullPolicy: IfNotPresent
kacho-iam:
  image:
    repository: docker.io/prorobotech/kacho-iam
    # main-7cede3e0: latency-complete iam — self-floor #259 + Group.List filter #261
    # + label-clear #262 + reconcile drain 2s→150ms #263 + AccessBinding.Delete sync
    # tuple-removal #266 (revoke 845→61ms) + reconcile_outbox LISTEN/NOTIFY #267
    # (migration 0042 trigger; label-grant 1951→307ms). All grant/revoke paths ≤500ms
    # SLO, grant+revoke in the 50-200ms ideal band. On the unify-IAM-label-scope base.
    tag: main-7cede3e0
    pullPolicy: IfNotPresent
kacho-nlb:
  enabled: true
  image:
    # main-3cf783e5: T3.1 (#113) — listener Create+Update emit RegisterResource(labels)
    # on label-change (double-bug closed; cross-service ARM_LABELS revoke).
    repository: docker.io/prorobotech/kacho-nlb
    tag: main-65ba5ad0
    pullPolicy: IfNotPresent

# ── no dynamic storage → every Postgres emptyDir (ephemeral) ──
# Capacity: fe3455 is 4 vCPU / 8 GB total → trim every Postgres request to
# 100m/256Mi (dev defaults pg-vpc to 500m/1Gi, which alone won't fit alongside
# the rest → pg-vpc stuck Pending). Ephemeral test DBs don't need the footprint.
pg-vpc:
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
pg-compute:
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
pg-iam:
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
pg-geo:
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
pg-openfga:
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
pg-nlb:
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
pg-kratos:
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
pg-hydra:
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }

# ── capacity trims: single OpenFGA replica + drop the dev MinIO ──
openfga:
  replicaCount: 1
  ingress:
    enabled: false

# minio-dev (compliance-report S3 sink) isn't needed for the core rollout — drop
# it to free a pod's worth of CPU/mem on the 4-vCPU cluster.
minioDev:
  enabled: false

# ── no ingress controller on this cluster ──
ingress-nginx:
  enabled: false
