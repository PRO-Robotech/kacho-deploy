apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kacho-api
  namespace: kacho
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx
  rules:
    - host: api.kacho.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
